name: Repair cavity borrow

on:
  push:
    branches: [implement/bonded-cavity-foundation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply borrow fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/cavity.rs')
          s = p.read_text().replace('match shape.form {', 'match shape.form.clone() {', 1)
          p.write_text(s)
          PY
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit fix and remove repair workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git rm .github/workflows/repair-cavity-borrow.yml
          git commit -m 'Fix cavity geometry borrow'
          git push
