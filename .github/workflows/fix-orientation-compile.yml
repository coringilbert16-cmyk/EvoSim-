name: Fix orientation compile
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'TEMP: run complete orientation migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply complete orientation migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}')
              p.write_text(s.replace(old, new))

          # Numerical boundary contact is not penetration.
          replace_once('src/material_geometry.rs', 'if center_distance >= a.form.bounding_radius() + b.form.bounding_radius() + tolerance {', 'if center_distance >= a.form.bounding_radius() + b.form.bounding_radius() + tolerance + 1e-12 {')
          replace_once('src/material_geometry.rs', 'center_distance < ar + br - tolerance', 'center_distance < ar + br - tolerance - 1e-12')
          replace_once('src/material_geometry.rs', '< (radius - tolerance).max(0.0)', '< (radius - tolerance - 1e-12).max(0.0)')
          replace_once('src/material_geometry.rs', 'a_max - tolerance <= b_min', 'a_max - tolerance - 1e-12 <= b_min')
          replace_once('src/material_geometry.rs', 'b_max - tolerance <= a_min', 'b_max - tolerance - 1e-12 <= a_min')
          replace_once('src/material_geometry.rs', '(Form::Line { .. }, polygon) | (polygon, Form::Line { .. }) => {', '(Form::Line { .. }, _polygon) | (_polygon, Form::Line { .. }) => {')

          # Blueprint orientation is a fixed rigid frame during construction.
          p = Path('src/construction_realization.rs')
          s = p.read_text()
          s, n = re.subn(r'fn add_circle_contact_candidates\((.*?)anchor:Placement,c:&\[BaseResource\]\)', r'fn add_circle_contact_candidates(\1anchor:Placement,fixed_rotation:f64,c:&[BaseResource])', s, count=1)
          if n != 1: raise SystemExit(f'circle signature replacement failed: {n}')
          start = s.index('fn add_circle_contact_candidates(')
          end = s.index('\nfn candidate_placements_for_targets', start)
          s = s[:start] + s[start:end].replace('rotation_radians:0.0', 'rotation_radians:fixed_rotation') + s[end:]
          s, n = re.subn(r'fn candidate_placements_for_targets\((.*?)anchor:Placement,c:&\[BaseResource\]\)->Vec<Placement>', r'fn candidate_placements_for_targets(\1anchor:Placement,fixed_rotation:f64,c:&[BaseResource])->Vec<Placement>', s, count=1)
          if n != 1: raise SystemExit(f'candidate signature replacement failed: {n}')
          s = s.replace('add_circle_contact_candidates(&mut out,resource,targets,s,anchor,c);', 'add_circle_contact_candidates(&mut out,resource,targets,s,anchor,fixed_rotation,c);', 1)
          old_loop = 'for &target in targets{let Some(world)=target_world_point(s,target,c)else{continue};for endpoint in &endpoints{let Some(local)=local_endpoint_point(resource,*endpoint,c)else{continue};let dx=world.0-anchor.x;let dy=world.1-anchor.y;if local.0.hypot(local.1)>CONTACT_EPSILON&&dx.hypot(dy)>CONTACT_EPSILON{let rotation=dy.atan2(dx)-local.1.atan2(local.0);add_unique_placement(&mut out,placement_for_point_contact(local,world,rotation))}add_unique_placement(&mut out,placement_for_point_contact(local,world,0.0))}}'
          new_loop = 'for &target in targets{let Some(world)=target_world_point(s,target,c)else{continue};for endpoint in &endpoints{let Some(local)=local_endpoint_point(resource,*endpoint,c)else{continue};add_unique_placement(&mut out,placement_for_point_contact(local,world,fixed_rotation));}}'
          if s.count(old_loop) != 1: raise SystemExit('target loop not found exactly once')
          s = s.replace(old_loop, new_loop, 1)
          old_pair = 'let rotation=wdy.atan2(wdx)-ldy.atan2(ldx);let rotated=rotate_point(pa,rotation);add_unique_placement(&mut out,Placement{x:wa.0-rotated.0,y:wa.1-rotated.1,rotation_radians:rotation})'
          new_pair = 'let rotated=rotate_point(pa,fixed_rotation);let expected_b=rotate_point(pb,fixed_rotation);if (wa.0+expected_b.0-wb.0).hypot(wa.1+expected_b.1-wb.1)>1e-7{continue}add_unique_placement(&mut out,Placement{x:wa.0-rotated.0,y:wa.1-rotated.1,rotation_radians:fixed_rotation})'
          if s.count(old_pair) != 1: raise SystemExit('two-point candidate expression not found')
          s = s.replace(old_pair, new_pair, 1)
          replace_once('src/construction_realization.rs', 'let anchor=Placement{x:e.placement.x,y:e.placement.y,rotation_radians:0.0};', 'let anchor=Placement{x:e.placement.x,y:e.placement.y,rotation_radians:e.placement.rotation_radians};')
          replace_once('src/construction_realization.rs', 'fn search(base:&OrganismStructure,m:&Material,anchor:Placement,placements:&mut[Option<Placement>],assigned:&mut[Option<usize>],external:&[Vec<usize>],c:&[BaseResource])->bool{', 'fn search(base:&OrganismStructure,m:&Material,anchor:Placement,fixed_rotation:f64,placements:&mut[Option<Placement>],assigned:&mut[Option<usize>],external:&[Vec<usize>],c:&[BaseResource])->bool{')
          replace_once('src/construction_realization.rs', 'candidate_placements_for_targets(res,&targets,&working,anchor,c)', 'candidate_placements_for_targets(res,&targets,&working,anchor,fixed_rotation,c)')
          replace_once('src/construction_realization.rs', 'if search(base,m,anchor,placements,assigned,external,c){return true}', 'if search(base,m,anchor,fixed_rotation,placements,assigned,external,c){return true}')
          replace_once('src/construction_realization.rs', 'if !search(s,m,anchor,&mut placements,&mut assigned,external,c){', 'if !search(s,m,anchor,e.placement.rotation_radians,&mut placements,&mut assigned,external,c){')
          p.write_text(s)

          # Reject strict penetration, while allowing tangent contact.
          replace_once('src/construction_realization.rs', 'if !crate::material_geometry::placed_forms_overlap(&pa,&pb,0.0){return false}let dx=b.placement.x-a.placement.x;let dy=b.placement.y-a.placement.y;let d=dx.hypot(dy);let(sx,sy)=if d>CONTACT_EPSILON{(dx/d,dy/d)}else{(1.0,0.0)};let scale=pa.form.bounding_radius().max(pb.form.bounding_radius()).max(1.0);let eps=1e-8*scale;let shifted=crate::material_geometry::PlacedMaterialPart{part_index:0,form:pa.form,placement:Placement{x:a.placement.x-sx*eps,y:a.placement.y-sy*eps,rotation_radians:a.placement.rotation_radians}};crate::material_geometry::placed_forms_overlap(&shifted,&pb,0.0)', 'crate::material_geometry::placed_forms_penetrate(&pa,&pb,0.0)')
          p = Path('src/structure.rs')
          s = p.read_text()
          pattern = r'if !crate::material_geometry::placed_forms_overlap\(&pa, &pb, 0\.0\) \{ return false; \}.*?crate::material_geometry::placed_forms_overlap\(&shifted, &pb, 0\.0\)'
          s2, n = re.subn(pattern, 'crate::material_geometry::placed_forms_penetrate(&pa, &pb, 0.0)', s, count=1, flags=re.S)
          if n != 1:
              old = 'if !crate::material_geometry::placed_forms_overlap(&pa, &pb, 0.0) { return false; }'
              if s.count(old) == 1: s = s.replace(old, 'if crate::material_geometry::placed_forms_penetrate(&pa, &pb, 0.0) { return false; }', 1)
              else: raise SystemExit(f'structure penetration replacement failed: {n}')
          else: s = s2
          p.write_text(s)

          # Do not rotate the finished material a second time; validate only.
          p = Path('src/structural_blueprint.rs')
          s = p.read_text()
          pattern = r'\n    let angle = placement\.rotation_radians;\n    if angle\.abs\(\) > 1e-12 \{.*?\n    \}\n\n    for &id in ids \{'
          s2, n = re.subn(pattern, '\n    for &id in ids {', s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'orientation transform block not found: {n}')
          p.write_text(s2.replace('    placement: BlueprintPlacement,', '    _placement: BlueprintPlacement,'))
          PY
          cargo fmt --all
      - name: Run tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of
      - name: Persist source and remove temporary workflows
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/material_geometry.rs src/construction_realization.rs src/structure.rs src/structural_blueprint.rs
          git rm .github/workflows/fix-orientation-compile.yml .github/workflows/strict-penetration-fix.yml TEMP_ORIENTATION_TRIGGER.txt
          git commit -m 'Honor blueprint orientation during construction'
          git push
