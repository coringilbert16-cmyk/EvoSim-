name: phase3-legacy-structure
on:
  push:
    branches: [phase3-physical-structure-authority]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject composite StructuralUnit persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/structure.rs')
          text = p.read_text()
          old = '''        if !m.is_valid() || m.is_empty() {\n            return Err(serde::de::Error::custom("invalid material"));\n        }\n        Ok(Self {'''
          new = '''        if !m.is_valid() || m.is_empty() {\n            return Err(serde::de::Error::custom("invalid material"));\n        }\n        if m.has_internal_structure() {\n            return Err(serde::de::Error::custom(\n                "composite material cannot be loaded as a StructuralUnit; restore its physical constituents and bonds through the organism graph",\n            ));\n        }\n        Ok(Self {'''
          if text.count(old) != 1:\n              raise SystemExit(f'expected exactly one StructuralUnit deserialization guard, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          cargo test --all-targets
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/structure.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 3: reject composite StructuralUnit persistence'
          git push
