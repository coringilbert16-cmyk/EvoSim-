name: Prioritize blueprint anchor

on:
  push:
    branches: [implement/bonded-cavity-foundation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prioritize requested blueprint placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/construction_realization.rs')
          s = p.read_text()
          old = '''    let mut out = Vec::new();
    add_circle_contact_candidates(&mut out, resource, targets, s, anchor, fixed_rotation, c);'''
          new = '''    let mut out = Vec::new();
    add_unique_placement(
        &mut out,
        Placement {
            rotation_radians: fixed_rotation,
            ..anchor
        },
    );
    add_circle_contact_candidates(&mut out, resource, targets, s, anchor, fixed_rotation, c);'''
          if old not in s:
              raise SystemExit('candidate placement insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git rm .github/workflows/patch-anchor-priority.yml
          git commit -m 'Prioritize blueprint anchor placement'
          git push
