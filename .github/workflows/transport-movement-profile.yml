name: Transport movement profile

on:
  pull_request:
    paths:
      - 'src/simulation/environment_flow.rs'
      - '.github/workflows/transport-movement-profile.yml'
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run 60-second transport movement profile
        run: cargo test --locked transport_movement_stage_profile_60s -- --ignored --nocapture
      - name: Run paired 60-second separate-vs-combined transform benchmark
        run: cargo test --locked transport_molecular_candidate_evaluation_benchmark -- --ignored --nocapture
