name: Transport movement profile

concurrency:
  group: transport-movement-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'src/simulation/environment_flow.rs'
      - 'src/simulation/environment_chemistry_experiment.rs'
      - '.github/workflows/transport-movement-profile.yml'
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run 60-second transport movement profile
        run: |
          if cargo test --locked transport_movement_stage_profile_60s -- --ignored --nocapture > /tmp/transport-profile.log 2>&1; then
            grep -E 'TRANSPORT|test result:' /tmp/transport-profile.log | tail -n 40 || true
          else
            tail -n 200 /tmp/transport-profile.log
            exit 1
          fi
      - name: Run four sequential five-pair wall-clock scaling benchmarks
        run: |
          if cargo test --locked transport_molecular_candidate_evaluation_benchmark -- --ignored --nocapture > /tmp/transport-benchmark.log 2>&1; then
            grep -E 'TRANSPORT (SCENARIO|.*RESULT)|test result:' /tmp/transport-benchmark.log | tail -n 80 || true
          else
            tail -n 200 /tmp/transport-benchmark.log
            exit 1
          fi
