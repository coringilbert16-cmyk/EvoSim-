name: Obstacle early-rejection experiment

on:
  pull_request:
    paths:
      - 'src/simulation/environment_flow.rs'
      - '.github/workflows/obstacle-early-rejection-experiment.yml'
  workflow_dispatch:

concurrency:
  group: obstacle-early-rejection-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run opt-in obstacle early-rejection benchmark
        run: cargo test --locked obstacle_early_rejection_benchmark -- --ignored --nocapture
