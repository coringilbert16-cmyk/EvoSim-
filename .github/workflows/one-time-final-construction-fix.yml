name: One-time final construction solver correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply final construction solver correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct pair placement reference and clean temporary files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/construction_realization.rs')
          s = p.read_text()
          old = '                                x: wa.0 - rotated.0,\n'
          new = '                                x: wa.0 - rotated_a.0,\n'
          if old not in s:
              raise SystemExit('stale pair placement reference not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/construction_realization.rs
          git rm .github/workflows/one-time-final-construction-fix.yml .construction-fix-trigger
          git commit -m 'Apply final construction solver correction'
          git push
