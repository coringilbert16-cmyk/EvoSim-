name: Fix geometry regression test
on:
  push:
    branches: [combine-unification]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'coringilbert16-cmyk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct obsolete single-use test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/combine.rs')
          s = p.read_text()
          old = '''    #[test]\n    fn occupied_point_is_no_longer_eligible() {\n        let catalog = default_catalog();\n        let mut structure = OrganismStructure::new();\n        let a = unit(&mut structure, "Carbon", 0.0, 0.0);\n        let b = unit(&mut structure, "Carbon", 1.0, 0.0);\n        let c = unit(&mut structure, "Carbon", 0.0, 1.0);\n        assert!(crate::contact::try_add_bond(&mut structure, bond(a, 0, b, 0), &catalog).is_ok());\n        let mut cache = ConnectionCompatibilityCache::new();\n        let candidates = eligible_candidates(&structure, a, c, &catalog, &mut cache);\n        assert!(candidates.iter().all(|candidate| candidate.point_a != 0));\n    }\n'''
          new = '''    #[test]\n    fn occupied_point_remains_eligible_when_geometry_permits() {\n        let catalog = default_catalog();\n        let mut structure = OrganismStructure::new();\n        let a = unit(&mut structure, "Carbon", 0.0, 0.0);\n        let b = unit(&mut structure, "Carbon", 1.0, 0.0);\n        let c = unit(&mut structure, "Carbon", 0.0, 1.0);\n        assert!(crate::contact::try_add_bond(&mut structure, bond(a, 0, b, 0), &catalog).is_ok());\n        let mut cache = ConnectionCompatibilityCache::new();\n        let candidates = eligible_candidates(&structure, a, c, &catalog, &mut cache);\n        assert!(candidates.iter().any(|candidate| candidate.point_a == 0));\n    }\n'''
          if old not in s:
              raise SystemExit('obsolete test block not found; refusing to modify file')
          p.write_text(s.replace(old, new))
          PY
          rm -f .github/workflows/fix-geometry-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/combine.rs .github/workflows/fix-geometry-test.yml
          git commit -m 'Correct obsolete single-use COMBINE regression test'
          git push
