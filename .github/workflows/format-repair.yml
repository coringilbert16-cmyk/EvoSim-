name: One-time format repair

on:
  push:
    paths:
      - '.github/workflows/format-repair.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting and remove repair workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git rm .github/workflows/format-repair.yml
          git diff --cached --quiet || git commit -m 'Fix Rust formatting on blueprint construction PR'
          git push
