name: Temporary format export
on:
  push:
    branches: [fix/bond-driven-genome-construction]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - run: mkdir -p formatted && cp src/construction_runtime.rs src/structural_blueprint_unified.rs src/combine_runtime.rs src/juvenile.rs formatted/
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: formatted/
