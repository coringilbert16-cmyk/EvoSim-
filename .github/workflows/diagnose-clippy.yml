name: Diagnose Clippy
on:
  push:
    branches:
      - audit/unity-cleanup
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply temporary source repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/genome.rs")
          text = path.read_text()
          old = "let length = 0.797_884;"
          new = "let length = 0.797_884_f64;"
          if old not in text:
              raise SystemExit("expected connector length literal not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format source
        run: cargo fmt --all
      - name: Commit source repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: type juvenile connector geometry [skip ci]"
          git push origin HEAD:audit/unity-cleanup
      - name: Run Clippy diagnostics
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of > CLIPPY_DIAGNOSTIC.txt 2>&1
          echo "status=$?" >> CLIPPY_DIAGNOSTIC.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLIPPY_DIAGNOSTIC.txt
          git commit -m "Diagnose Clippy failure [skip ci]" || exit 0
          git push origin HEAD:audit/unity-cleanup
