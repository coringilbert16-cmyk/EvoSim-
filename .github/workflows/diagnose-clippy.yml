name: Diagnose Clippy
on:
  push:
    branches:
      - audit/unity-cleanup
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Format source
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore: format juvenile architecture [skip ci]"
          git push origin HEAD:audit/unity-cleanup
      - name: Run Clippy diagnostics
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of > CLIPPY_DIAGNOSTIC.txt 2>&1
          echo "status=$?" >> CLIPPY_DIAGNOSTIC.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLIPPY_DIAGNOSTIC.txt
          git commit -m "Diagnose Clippy failure [skip ci]" || exit 0
          git push origin HEAD:audit/unity-cleanup
