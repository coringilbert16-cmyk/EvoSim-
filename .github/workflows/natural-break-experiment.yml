name: Natural BREAK molecule experiment

on:
  push:
    branches:
      - experiment/natural-break-880-validation

permissions:
  contents: read

jobs:
  natural-break:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run naturally powered molecule population
        timeout-minutes: 20
        run: |
          set -o pipefail
          cargo run --release --locked -- --headless --environment-break-experiment --seed 42 --duration-seconds 60 2>&1 | tee natural-break-experiment.log
          restoration_logs="$(grep -E 'restore_material (rejected|penetration|bond insertion rejected)' natural-break-experiment.log || true)"
          if [ -n "$restoration_logs" ]; then
            printf '%s\n' "$restoration_logs" | tee -a natural-break-experiment.log
          else
            echo "RESTORATION DIAGNOSTICS: no restore_material rejection messages observed" | tee -a natural-break-experiment.log
          fi
      - name: Preserve experiment output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-break-experiment
          path: natural-break-experiment.log
          if-no-files-found: warn
