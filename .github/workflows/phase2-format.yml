name: Phase 2 temporary formatter

on:
  push:
    branches: [phase2-storage-combine-authority]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet; then
            git add -A
            git commit -m "fmt: normalize Phase 2 changes"
            git push origin HEAD:phase2-storage-combine-authority
          fi
