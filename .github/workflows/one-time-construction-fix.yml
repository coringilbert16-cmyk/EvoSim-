name: One-time construction solver correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch solver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/construction_realization.rs')
          s=p.read_text()
          s,n=re.subn(r'fn rem_euclid_tau\(angle: f64\) -> f64 \{.*?\n\}\nfn add_unique_placement\(out: &mut Vec<Placement>, placement: Placement\) \{.*?\n\}', '''fn add_unique_placement(out: &mut Vec<Placement>, placement: Placement) {
              if !placement.x.is_finite()
                  || !placement.y.is_finite()
                  || !placement.rotation_radians.is_finite()
              {
                  return;
              }
              let normalized = placement.rotation_radians.rem_euclid(std::f64::consts::TAU);
              if out.iter().any(|e| {
                  (e.x - placement.x).abs() <= CONTACT_EPSILON
                      && (e.y - placement.y).abs() <= CONTACT_EPSILON
                      && ((e.rotation_radians - placement.rotation_radians).abs() <= 1e-10
                          || (e.rotation_radians.rem_euclid(std::f64::consts::TAU) - normalized).abs() <= 1e-10)
              }) {
                  return;
              }
              out.push(placement);
          }''',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('deduplication function not found')
          old='''        if assigned.iter().all(Option::is_some) {
            return external_constraints_satisfied(base, assigned, external, c);
        }'''
          if old in s:
              s=s.replace(old,'''        if assigned.iter().all(Option::is_some) {
            return true;
        }''',1)
          old='''            placements[part] = Some(candidate);
            assigned[part] = ti[part];
            if search(base, m, anchor, fixed_rotation, placements, assigned, external, c) {'''
          new='''            placements[part] = Some(candidate);
            assigned[part] = ti[part];
            if assigned.iter().all(Option::is_some)
                && !external_constraints_satisfied(&trial, &ti, external, c)
            {
                assigned[part] = None;
                placements[part] = None;
                continue;
            }
            if search(base, m, anchor, fixed_rotation, placements, assigned, external, c) {'''
          if old not in s: raise SystemExit('search recursion point not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          cargo fmt --all
          git diff --check
          git rm .github/workflows/one-time-construction-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/construction_realization.rs
          git commit -m 'Require complete external blueprint contact satisfaction'
          git push
