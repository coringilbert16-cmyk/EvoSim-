name: Obstacle bin-size experiment

on:
  pull_request:
    paths:
      - 'src/simulation/environment_flow.rs'
      - '.github/workflows/obstacle-bin-size-experiment.yml'
  workflow_dispatch:

concurrency:
  group: obstacle-bin-size-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run opt-in obstacle-bin resolution experiment
        run: cargo test --locked obstacle_bin_size_experiment_10s -- --ignored --nocapture
