name: Matched Catalysis Placement Screen

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated paired seeds (each seed runs both conditions)."
        required: true
        default: "42,43,44,45,46"
        type: string
      duration_seconds:
        description: "Real wall-clock simulation duration per condition and seed."
        required: true
        default: 60
        type: number
      diagnostic_interval:
        description: "Ticks between full diagnostic snapshots."
        required: true
        default: 100
        type: number
      config_path:
        description: "Matched-catalysis JSON configuration under experiments/."
        required: true
        default: "experiments/matched-catalysis-config.example.json"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      seeds: \${{ steps.parameters.outputs.seeds }}
      duration_seconds: \${{ steps.parameters.outputs.duration_seconds }}
      diagnostic_interval: \${{ steps.parameters.outputs.diagnostic_interval }}
      config_path: \${{ steps.parameters.outputs.config_path }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate paired-screen request
        id: parameters
        env:
          SEEDS_INPUT: \${{ inputs.seeds }}
          DURATION_SECONDS: \${{ inputs.duration_seconds }}
          DIAGNOSTIC_INTERVAL: \${{ inputs.diagnostic_interval }}
          CONFIG_PATH: \${{ inputs.config_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ["SEEDS_INPUT"]
          parts = [part.strip() for part in raw.split(",") if part.strip()]
          if not parts or any(not part.isascii() or not part.isdecimal() for part in parts):
              raise SystemExit("Provide comma-separated nonnegative integer seeds.")
          seeds = [int(part) for part in parts]
          if len(seeds) > 25 or len(seeds) != len(set(seeds)):
              raise SystemExit("Provide 1-25 unique seeds.")

          duration = int(os.environ["DURATION_SECONDS"])
          interval = int(os.environ["DIAGNOSTIC_INTERVAL"])
          if not 30 <= duration <= 3600:
              raise SystemExit("Duration must be between 30 and 3,600 seconds.")
          if not 1 <= interval <= 100000:
              raise SystemExit("Diagnostic interval must be between 1 and 100,000 ticks.")

          config_path = Path(os.environ["CONFIG_PATH"])
          if config_path.is_absolute() or ".." in config_path.parts or not str(config_path).startswith("experiments/"):
              raise SystemExit("Configuration must be a repository-relative file under experiments/.")
          if not config_path.is_file():
              raise SystemExit(f"Configuration file does not exist: {config_path}")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          for key in ("candidate_parts", "target_reactant_a_parts", "target_reactant_b_parts"):
              values = config.get(key)
              if not isinstance(values, list) or len(values) < 2 or any(not isinstance(value, str) or not value.strip() for value in values):
                  raise SystemExit(f"{key} must contain at least two element names.")
          if sorted(config["target_reactant_a_parts"]) == sorted(config["target_reactant_b_parts"]):
              raise SystemExit("Target reactant compositions must differ.")
          if sorted(config["candidate_parts"]) in (
              sorted(config["target_reactant_a_parts"]),
              sorted(config["target_reactant_b_parts"]),
          ):
              raise SystemExit("Candidate composition must differ from both target reactants.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("seeds=" + json.dumps(seeds) + chr(10))
              output.write("duration_seconds=" + str(duration) + chr(10))
              output.write("diagnostic_interval=" + str(interval) + chr(10))
              output.write("config_path=" + str(config_path) + chr(10))
          print(f"Validated {len(seeds)} paired seeds: {seeds}")
          print(f"Two conditions per seed; {duration}s each; config={config_path}")
          PY

  observe:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: \${{ fromJSON(needs.prepare.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run candidate-near condition
        env:
          SEED: \${{ matrix.seed }}
          DURATION_SECONDS: \${{ needs.prepare.outputs.duration_seconds }}
          DIAGNOSTIC_INTERVAL: \${{ needs.prepare.outputs.diagnostic_interval }}
          CONFIG_PATH: \${{ needs.prepare.outputs.config_path }}
        run: |
          set -euo pipefail
          mkdir -p observations/near observations/remote
          cargo run --locked -- --headless --environment-chemistry-experiment --seconds "$DURATION_SECONDS" --seed "$SEED" --diagnostics "observations/near/seed-$SEED.jsonl" --diagnostic-interval "$DIAGNOSTIC_INTERVAL" --matched-catalysis-config "$CONFIG_PATH" --matched-catalysis-condition candidate_near
      - name: Run candidate-remote matched control
        env:
          SEED: \${{ matrix.seed }}
          DURATION_SECONDS: \${{ needs.prepare.outputs.duration_seconds }}
          DIAGNOSTIC_INTERVAL: \${{ needs.prepare.outputs.diagnostic_interval }}
          CONFIG_PATH: \${{ needs.prepare.outputs.config_path }}
        run: |
          set -euo pipefail
          cargo run --locked -- --headless --environment-chemistry-experiment --seconds "$DURATION_SECONDS" --seed "$SEED" --diagnostics "observations/remote/seed-$SEED.jsonl" --diagnostic-interval "$DIAGNOSTIC_INTERVAL" --matched-catalysis-config "$CONFIG_PATH" --matched-catalysis-condition candidate_remote
      - name: Upload paired observations
        if: always() && hashFiles('observations/**/*.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: matched-catalysis-seed-\${{ matrix.seed }}
          path: observations/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [prepare, observe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download paired observations
        uses: actions/download-artifact@v4
        with:
          pattern: matched-catalysis-seed-*
          path: observations
          merge-multiple: true
      - name: Build paired comparison report
        env:
          SEEDS: \${{ join(fromJSON(needs.prepare.outputs.seeds), ',') }}
          DURATION_SECONDS: \${{ needs.prepare.outputs.duration_seconds }}
          CONFIG_PATH: \${{ needs.prepare.outputs.config_path }}
        run: |
          set -euo pipefail
          python3 tools/matched_catalysis_comparison_analyzer.py --near-dir observations/near --remote-dir observations/remote --seeds "$SEEDS" --duration-seconds "$DURATION_SECONDS" --config "$CONFIG_PATH" --output matched-catalysis-comparison.json
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: matched-catalysis-comparison
          path: |
            matched-catalysis-comparison.json
            matched-catalysis-comparison.md
          if-no-files-found: error
          retention-days: 90
