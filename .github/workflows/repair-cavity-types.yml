name: Repair cavity types

on:
  push:
    branches: [implement/bonded-cavity-foundation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply type fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/cavity.rs')
          s = p.read_text()
          s = s.replace('let mut out: Vec<(f64, Point)> = Vec::new();', 'let mut out: Vec<Primitive> = Vec::new();', 1)
          s = s.replace('let mut out = Vec::new();', 'let mut out: Vec<(f64, Point)> = Vec::new();', 1)
          s = s.replace('Form::Polygon { ref vertices } =>', 'Form::Polygon { vertices } =>', 1)
          p.write_text(s)
          PY
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit fixes and remove repair workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git rm .github/workflows/repair-cavity-types.yml
          git commit -m 'Fix cavity type inference'
          git push
