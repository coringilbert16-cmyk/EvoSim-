name: One-time external constraint solver fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch construction solver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/construction_realization.rs')
          s = p.read_text()

          old = 'fn add_unique_placement(out:&mut Vec<Placement>,placement:Placement){if !placement.x.is_finite()||!placement.y.is_finite()||!placement.rotation_radians.is_finite(){return}let normalized=Placement{x:placement.x,y:placement.y,rotation_radians:placement.rotation_radians.rem_euclid(std::f64::consts::TAU)};if !out.iter().any(|e|(e.x-normalized.x).abs()<=CONTACT_EPSILON&&(e.y-normalized.y).abs()<=CONTACT_EPSILON&&(e.rotation_radians-normalized.rotation_radians).abs()<=1e-10){out.push(normalized)}}'
          new = 'fn add_unique_placement(out:&mut Vec<Placement>,placement:Placement){if !placement.x.is_finite()||!placement.y.is_finite()||!placement.rotation_radians.is_finite(){return}let normalized=placement.rotation_radians.rem_euclid(std::f64::consts::TAU);if !out.iter().any(|e|(e.x-placement.x).abs()<=CONTACT_EPSILON&&(e.y-placement.y).abs()<=CONTACT_EPSILON&&((e.rotation_radians-normalized).abs()<=1e-10||(e.rotation_radians-rem_euclid_tau(normalized)).abs()<=1e-10)){return}out.push(placement)}'
          helper = 'fn rem_euclid_tau(angle:f64)->f64{angle.rem_euclid(std::f64::consts::TAU)}\n'
          if old not in s:
              raise SystemExit('add_unique_placement pattern not found')
          s = s.replace(old, helper + new, 1)

          old_search = 'let first_part=assigned.iter().all(Option::is_none);if first_part{for constraint in external{target_units.extend(constraint.iter().copied())}}target_units.sort_unstable();target_units.dedup();let targets=contact_targets_for_units(&working,&target_units,c);'
          new_search = 'for constraint in external{target_units.extend(constraint.iter().copied())}target_units.sort_unstable();target_units.dedup();let targets=contact_targets_for_units(&working,&target_units,c);'
          if old_search not in s:
              raise SystemExit('external target selection pattern not found')
          s = s.replace(old_search, new_search, 1)

          old_base = 'fn search(base:&OrganismStructure,m:&Material,anchor:Placement,fixed_rotation:f64,placements:&mut[Option<Placement>],assigned:&mut[Option<usize>],external:&[Vec<usize>],c:&[BaseResource])->bool{if assigned.iter().all(Option::is_some){return true}'
          new_base = 'fn external_constraints_satisfied(s:&OrganismStructure,assigned:&[Option<usize>],external:&[Vec<usize>],c:&[BaseResource])->bool{external.iter().all(|group|assigned.iter().flatten().any(|&a|group.iter().any(|&b|internal_contact_exists(s,a,b,c))))}\nfn search(base:&OrganismStructure,m:&Material,anchor:Placement,fixed_rotation:f64,placements:&mut[Option<Placement>],assigned:&mut[Option<usize>],external:&[Vec<usize>],c:&[BaseResource])->bool{if assigned.iter().all(Option::is_some){return external_constraints_satisfied(base,assigned,external,c)}'
          if old_base not in s:
              raise SystemExit('search base pattern not found')
          s = s.replace(old_base, new_base, 1)

          old_candidate = 'if !valid||!partial_configuration_valid(&trial,m,&ti,c){continue}placements[part]=Some(candidate);'
          new_candidate = 'if !valid||!partial_configuration_valid(&trial,m,&ti,c){continue}placements[part]=Some(candidate);'
          if old_candidate not in s:
              raise SystemExit('candidate pattern not found')

          p.write_text(s)
          PY
          cargo fmt --all
          test -f .github/workflows/rust.yml
          git diff --check
          git rm .github/workflows/one-time-external-constraint-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/construction_realization.rs
          git commit -m 'Require all external blueprint contacts during construction'
          git push
