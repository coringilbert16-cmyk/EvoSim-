name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format workspace
        run: cargo fmt --all
      - name: Decision runtime compile
        run: cargo test --all-targets decision_runtime --no-run
