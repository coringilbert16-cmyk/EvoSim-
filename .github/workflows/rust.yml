name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture formatter diagnostics
        run: |
          cargo fmt --all 2> /tmp/format-error.log || true
          cp /tmp/format-error.log format-error.log
      - name: Upload formatter diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: formatter-diagnostics
          path: format-error.log
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check source file sizes
        run: bash scripts/check_large_files.sh
      - name: Check COMBINE architecture
        run: bash scripts/check_combine_architecture.sh
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of
