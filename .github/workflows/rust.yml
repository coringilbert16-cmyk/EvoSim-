name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply strict penetration orientation validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/structural_blueprint.rs')
          s = p.read_text()
          old = 'crate::material_geometry::placed_forms_overlap(&pa, &pb, 0.0)'
          new = 'crate::material_geometry::placed_forms_penetrate(&pa, &pb, 0.0)'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one orientation overlap check, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - uses: dtolnay/rust-toolchain@stable
      - name: Format source
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check source file sizes
        run: bash scripts/check_large_files.sh
      - name: Check COMBINE architecture
        run: bash scripts/check_combine_architecture.sh
      - name: Run Rust tests
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee test-output.log
      - name: Upload Rust test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-diagnostics
          path: test-output.log
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of
      - name: Persist tested source and restore workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > .github/workflows/rust.yml <<'EOF'
          name: Rust

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                - name: Format source
                  run: cargo fmt --all
                - name: Check formatting
                  run: cargo fmt --all -- --check
                - name: Check source file sizes
                  run: bash scripts/check_large_files.sh
                - name: Check COMBINE architecture
                  run: bash scripts/check_combine_architecture.sh
                - name: Run Rust tests
                  run: |
                    set -o pipefail
                    cargo test --all-targets 2>&1 | tee test-output.log
                - name: Upload Rust test diagnostics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: rust-test-diagnostics
                    path: test-output.log
                - name: Run Clippy
                  run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of
          EOF
          git add src/structural_blueprint.rs .github/workflows/rust.yml
          git rm .github/workflows/strict-penetration-fix.yml
          git commit -m 'Use strict penetration for blueprint orientation validation'
          git push
