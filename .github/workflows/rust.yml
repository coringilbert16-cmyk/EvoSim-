name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format workspace
        run: cargo fmt --all
      - name: Decision tests
        run: cargo test --all-targets decision_runtime
        continue-on-error: true
      - name: Structural material tests
        run: cargo test --all-targets structural_material
        continue-on-error: true
      - name: Core geometry tests
        run: cargo test --all-targets core_geometry
        continue-on-error: true
      - name: Core integrity tests
        run: cargo test --all-targets core_integrity
        continue-on-error: true
      - name: Membrane geometry tests
        run: cargo test --all-targets membrane_geometry
        continue-on-error: true
      - name: Integration tests
        run: cargo test --all-targets integration_tests
        continue-on-error: true
