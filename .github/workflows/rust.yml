name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format source
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Coordinate legacy seed realization
        if: github.event_name == 'push'
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('src/atomic_blueprint.rs')
          text = path.read_text()
          pattern = re.compile(r"    pub\(crate\) fn compile_seed_from_legacy\(legacy: &StructuralBlueprint, catalog: &\[BaseResource\]\) -> Result<Self, String> \{.*?\n    \}\n\}\n#\[cfg\(test\)\]", re.S)
          replacement = r'''    pub(crate) fn compile_seed_from_legacy(
        legacy: &StructuralBlueprint,
        catalog: &[BaseResource],
    ) -> Result<Self, String> {
        legacy.validate()?;
        let mut structure = OrganismStructure::new();
        let mut groups = HashMap::<usize, Vec<usize>>::new();

        let first = legacy.elements.first().ok_or_else(|| "legacy blueprint has no elements".to_string())?;
        let first_ids = crate::construction_realization::realize_material(&mut structure, first, catalog)
            .map_err(|error| format!("seed element 0 failed: {error}"))?;
        groups.insert(0, first_ids);

        let mut attempted = vec![false; legacy.elements.len()];
        attempted[0] = true;
        loop {
            let mut best = None;
            let mut best_neighbors = 0usize;
            for index in 1..legacy.elements.len() {
                if attempted[index] { continue; }
                let neighbors = legacy.connections.iter().filter_map(|connection| {
                    let neighbor = if connection.element_a == index { connection.element_b }
                        else if connection.element_b == index { connection.element_a }
                        else { return None };
                    groups.contains_key(&neighbor).then_some(neighbor)
                }).collect::<std::collections::HashSet<_>>();
                if neighbors.len() > best_neighbors {
                    best_neighbors = neighbors.len();
                    best = Some(index);
                }
            }
            let Some(index) = best else { break };
            attempted[index] = true;
            let neighbor_targets = legacy.connections.iter().filter_map(|connection| {
                let neighbor = if connection.element_a == index { connection.element_b }
                    else if connection.element_b == index { connection.element_a }
                    else { return None };
                groups.get(&neighbor).cloned()
            }).collect::<Vec<_>>();
            if neighbor_targets.is_empty() {
                return Err(format!("seed element {index} has no realized neighbor"));
            }
            let ids = crate::construction_realization::realize_material_with_constraints(
                &mut structure,
                &legacy.elements[index],
                catalog,
                &neighbor_targets,
            ).map_err(|error| {
                let name = legacy.elements[index].material.parts.iter()
                    .map(|(name, _)| name.as_str()).collect::<Vec<_>>().join("+");
                format!("seed element {index} ({name}) failed with {best_neighbors} realized neighbors: {error}")
            })?;
            groups.insert(index, ids);
        }
        if groups.len() != legacy.elements.len() {
            return Err(format!("coordinated seed realization stopped at {}/{} elements", groups.len(), legacy.elements.len()));
        }
        for connection in &legacy.connections {
            crate::structural_blueprint::realize_connection_groups(&mut structure, &groups, *connection, catalog)?;
        }
        let mut atoms = Vec::with_capacity(structure.units.len());
        let mut unit_to_atom = vec![usize::MAX; structure.units.len()];
        for element_index in 0..legacy.elements.len() {
            for &unit_index in groups.get(&element_index).ok_or_else(|| "seed compiler lost an element group".to_string())? {
                let unit = structure.units.get(unit_index).ok_or_else(|| "seed compiler lost a unit".to_string())?;
                unit_to_atom[unit_index] = atoms.len();
                atoms.push(BlueprintAtom {
                    resource: unit.resource_name().ok_or_else(|| "seed compiler encountered a non-atomic unit".to_string())?.to_string(),
                    transform: BlueprintTransform { x: unit.placement.x, y: unit.placement.y, rotation_radians: unit.placement.rotation_radians },
                });
            }
        }
        let id_to_unit = structure.units.iter().enumerate().map(|(index, unit)| (unit.physical_id, index)).collect::<HashMap<_, _>>();
        let mut bonds = Vec::with_capacity(structure.bonds.len());
        for bond in &structure.bonds {
            let unit_a = *id_to_unit.get(&bond.endpoint_a.constituent_id).ok_or_else(|| "seed compiler found a bond with a missing endpoint A".to_string())?;
            let unit_b = *id_to_unit.get(&bond.endpoint_b.constituent_id).ok_or_else(|| "seed compiler found a bond with a missing endpoint B".to_string())?;
            bonds.push(BlueprintBond { atom_a: unit_to_atom[unit_a], endpoint_a: bond.endpoint_a.location, atom_b: unit_to_atom[unit_b], endpoint_b: bond.endpoint_b.location, required_bonds: 1 });
        }
        bonds.sort_by_key(|bond| (bond.canonical().atom_a, bond.canonical().atom_b));
        let mut core_atoms = Vec::new();
        for &element in &legacy.core_elements {
            core_atoms.extend(groups.get(&element).ok_or_else(|| "seed compiler lost a core group".to_string())?.iter().map(|&unit| unit_to_atom[unit]));
        }
        let result = Self { anchor: BlueprintTransform { x: 0.0, y: 0.0, rotation_radians: 0.0 }, atoms, core_atoms, bonds };
        result.validate()?;
        Ok(result)
    }
}
#[cfg(test)]'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one compiler function, found {count}')
          path.write_text(updated)
          workflow = Path('.github/workflows/rust.yml')
          w = workflow.read_text()
          marker = "      - name: Coordinate legacy seed realization\n"
          start = w.index(marker)
          end = w.index("      - name: Check source file sizes\n", start)
          workflow.write_text(w[:start] + w[end:])
          Path('.github/workflows/coordinate-seed-realization.yml').unlink(missing_ok=True)
          Path('.github/workflows/freeze-seed-topology.yml').unlink(missing_ok=True)
      - name: Check source file sizes
        run: bash scripts/check_large_files.sh
      - name: Check COMBINE architecture
        run: bash scripts/check_combine_architecture.sh
      - name: Run Rust tests
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee test-output.log
      - name: Upload Rust test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-diagnostics
          path: test-output.log
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of
      - name: Commit coordinated seed compiler
        if: github.event_name == 'push' && success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/atomic_blueprint.rs .github/workflows/rust.yml .github/workflows/coordinate-seed-realization.yml .github/workflows/freeze-seed-topology.yml
          git diff --cached --quiet || git commit -m 'Coordinate legacy seed realization before freezing atomic topology'
          git push
