name: Rust

# CI trigger: validate main pushes and every pull request targeting main.

on:
  push:
    branches: [main]
  pull_request:
    # Also validate stacked fix branches against their parent fix branch.
    branches: [main, gui-foundation-geometry-inspired, chemistry-experiment-density-resonance-visuals, horizontal-wrap-vertical-walls, integration/unified-source-and-catalogue, 'fix/**', resonance-time-phase-2026-10-31, resonance-driven-response-2026-10-31, resonance-attraction-repulsion-2026-10-31, resonance-energy-integration-2026-10-31, chemistry-compound-base-matrix-2026-10-29, chemistry-compound-compound-matrix-2026-10-29, chemistry-compound-compound-transaction-2026-10-29, chemistry-molecular-characterization-2026-10-29, chemistry-multimolecule-break-roundtrip-2026-10-29, chemistry-heterogeneous-molecule-interface-2026-10-29, chemistry-heterogeneous-reaction-interface-2026-10-29, chemistry-component-contact-round-robin-2026-10-29, chemistry-molecular-layout-stability-2026-10-29]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check
      # Exercise the independent world inventory on live source, reaction, and tick paths
      # before the full suite, whose historical runtime can exceed the job timeout.
      - name: Repository architecture checks
        timeout-minutes: 5
        run: |
          bash scripts/check_large_files.sh
          bash scripts/check_combine_architecture.sh
      - name: Energy accounting (focused tests)
        if: always()
        timeout-minutes: 30
        run: |
          failures=0
          run_check() {
            echo
            echo ">>> $*"
            timeout 5m "$@"
            status=$?
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_check cargo test --locked world_inventory_rejects_unowned_non_structural_release
          # The ordinary-tick inventory test remains covered by the full Rust suite below.
          run_check cargo test --locked world_energy_inventory_reconciles_world_tone_and_structural_break_together
          run_check cargo test --locked resonance_overload_break_reconciles_world_inventory
          run_check cargo test --locked blocked_push_chain_discards_preflight_without_mutating_world_or_inventory
          run_check cargo test --locked successful_push_chain_commits_each_owner_once_and_reconciles_energy
          run_check cargo test --locked nonliving_surface_receives_world_tone_energy_as_heat_without_living_receivers
          run_check cargo test --locked strict_world_inventory_oracle_rejects_even_sub_tolerance_energy_creation
          run_check cargo test --locked source_budget_rejects_claim_above_remaining_budget_atomically
          run_check cargo test --locked source_budget_rejects_sub_tolerance_overspend_atomically
          run_check cargo test --locked zero_external_input_cannot_credit_holder_within_balance_tolerance
          run_check cargo test --locked external_input_cannot_overdraw_local_source_allowance_within_tolerance
          run_check cargo test --locked external_input_rejects_negative_holder_even_within_tolerance
          run_check cargo test --locked energy_transaction_cannot_create_energy_within_balance_tolerance
          run_check cargo test --locked energy_transaction_rejects_negative_holder_even_within_tolerance
          run_check cargo test --locked transfer_rejects_sub_tolerance_overdraw_without_creating_energy
          run_check cargo test --locked transfer_conserves_holder_sum
          run_check cargo test --locked world_tone_cannot_allocate_more_than_incident_energy_within_tolerance
          run_check cargo test --locked zero_incident_world_tone_cannot_create_energy_within_tolerance
          echo "Focused checks failed: $failures"
          test "$failures" -eq 0
      - name: Chemistry and reactions (focused tests)
        if: always()
        timeout-minutes: 30
        run: |
          failures=0
          run_check() {
            echo
            echo ">>> $*"
            timeout 5m "$@"
            status=$?
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_check cargo test --locked environmental_break_rejects_exhausted_transformation_ids_without_removing_source
          run_check cargo test --locked unobserved_reaction_progress_dissipates_once_per_tick
          run_check cargo test --locked failed_chemical_settlement_preserves_triggered_reaction_progress
          run_check cargo test --locked successful_chemical_break_does_not_spend_resonance_when_reaction_covers_barrier
          run_check cargo test --locked successful_chemical_break_spends_only_resonance_needed_for_reaction_shortfall
          run_check cargo test --locked chemical_break_reconciles_world_energy_inventory
          run_check cargo test --locked chemical_break_with_resonance_shortfall_reconciles_world_inventory
          # Covered by the Energy accounting focused group above.
          run_check cargo test --locked resonance_math_fails_closed_for_invalid_material_properties
          run_check cargo test --locked surface_response_uses_existing_material_resonance_for_energy_split
          run_check cargo test --locked transformed_secondary_signal_never_exceeds_budget_after_rounding
          run_check cargo test --locked live_world_tone_capture_settles_and_reconciles_world_energy
          run_check cargo test --locked world_energy_inventory_reconciles_world_tone_and_structural_break_together
          run_check cargo test --locked zero_incident_world_tone_cannot_create_energy_within_tolerance
          run_check cargo test --locked live_geometry_key_distinguishes_chemical_positions_and_canonicalizes_them
          run_check cargo test --locked nonempty_cache_reopens_with_matching_derived_fingerprint
          run_check cargo test --locked checked_in_manifest_fingerprint_matches_default_catalog
          run_check cargo test --locked changed_catalog_chemical_position_changes_fingerprint_and_rejects_old_manifest
          run_check cargo test --locked rejects_unrepresentable_chemical_position_keys
          run_check cargo test --locked rejects_schema_four_store_after_chemical_position_key_migration
          run_check cargo test --locked chemical_break_
          run_check cargo test --locked sunlight_resonance_funds_environmental_chemical_break_without_external_grant
          run_check cargo test --locked sparse_environmental_discovery_rotates_with_a_bounded_scan_window
          run_check cargo test --locked exposed_environmental_material_settles_heat_without_a_living_receiver
          run_check cargo test --locked insert_partial_append_failure_rolls_back_original_cache_bytes_and_reopens_cleanly
          run_check cargo test --locked cache_append_rollback_failure_reports_both_errors_and_preserves_recovery_evidence
          run_check cargo test --locked manifest_failure_rolls_back_appended_record_and_reopens_cleanly
          run_check cargo test --locked failed_insert_keeps_stale_instance_refreshed_to_committed_store
          run_check cargo test --locked failed_stored_break
          run_check cargo test --locked failed_prepared_combine_
          echo "Focused checks failed: $failures"
          test "$failures" -eq 0
      - name: Transactions and ownership (focused tests)
        if: always()
        timeout-minutes: 30
        run: |
          failures=0
          run_check() {
            echo
            echo ">>> $*"
            timeout 5m "$@"
            status=$?
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_check cargo test --locked aggregate_division_transfers_every_unit_once_and_reconciles_boundary_energy
          run_check cargo test --locked detached_legacy_construction_cannot_divide_or_claim_inventory_ownership
          run_check cargo test --locked failed_begin_reproduction_preserves_rng_and_parent_state
          run_check cargo test --locked non_ready_construction_cannot_create_an_offspring
          run_check cargo test --locked rejected_movement_energy_settlement_does_not_mutate_world_geometry
          run_check cargo test --locked rejected_destination_restores_expulsion_source_and_neighbor_order
          run_check cargo test --locked multi_contact_fluid_forms_multiple_bonds_to_one_rigid_edge
          run_check cargo test --locked multi_contact_fluid_commits_all_three_rigid_bonds_together
          run_check cargo test --locked reopened_two_piece_bob_record_maps_into_transformed_live_parent
          run_check cargo test --locked restored_multi_contact_fluid_keeps_three_live_rigid_contacts
          run_check cargo test --locked worker_accepts_three_piece_limit_and_rejects_wider_limits
          run_check cargo test --locked simultaneous_collinear_solver_builds_one_area_conserving_three_surface_boundary
          run_check cargo test --locked live_combine_coalesces_fluid_pair_atomically
          run_check cargo test --locked coalesced_fluid_boundary_survives_physical_material_roundtrip_and_restore
          run_check cargo test --locked bonded_fluid_pair_merges_area_and_preserves_rigid_bond
          run_check cargo test --locked coalescence_remaps_rigid_bonds_from_both_fluid_constituents
          run_check cargo test --locked fluid_bond_off_shared_interface_rejects_coalescence_atomically
          run_check cargo test --locked separated_bond_endpoints_on_shared_segment_reject_coalescence_atomically
          run_check cargo test --locked unsupported_fluid_corner_and_line_endpoints_reject_coalescence_atomically
          run_check cargo test --locked touching_fluid_boundaries_without_a_bond_do_not_coalesce
          run_check cargo test --locked failed_live_combine_rolls_back_energy_and_ledger_when_union_is_unsupported
          run_check cargo test --locked unsupported_fluid_union_rolls_back_structure_and_bond
          run_check cargo test --locked successful_movement_commits_preflight_energy_and_ledger_after_geometry
          run_check cargo test --locked contained_physical_material_becomes_storage_without_an_acquire_action
          run_check cargo test --locked reproduction_cannot_mutate_storage_while_transformation_is_active
          run_check cargo test --locked finish_reproduction_readiness_ignores_stale_cached_graph
          run_check cargo test --locked rejected_parent_material_attachment_keeps_source_and_developing_graph_atomic
          run_check cargo test --locked waiting_construction_resumes_from_same_graph_when_material_arrives
          run_check cargo test --locked active_transformation_suppresses_new_movement_and_material_actions
          run_check cargo test --locked breached_organism_material_and_energy_holders_reconcile_over_live_ticks
          run_check cargo test --locked breached_organism_retains_storage_and_construction_without_biological_progress
          run_check cargo test --locked invalid_finished_body_position_preserves_released_material_ownership
          run_check cargo test --locked dead_organism_dissipates_retained_resonance_as_heat_on_final_release
          # Replaced by the one-tick lifecycle/conservation regression below.
          run_check cargo test --locked live_tick_releases_a_dead_bondless_graph_into_the_environment
          run_check cargo test --locked failed_stored_break
          run_check cargo test --locked failed_environmental_break
          run_check cargo test --locked failed_late_physical_restoration_preserves_destination_structure
          run_check cargo test --locked material_counts_are_whole_and_catalog_bound
          echo "Focused checks failed: $failures"
          test "$failures" -eq 0
      - name: Geometry and persistence (focused tests)
        if: always()
        timeout-minutes: 30
        run: |
          failures=0
          run_check() {
            echo
            echo ">>> $*"
            timeout 5m "$@"
            status=$?
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_check cargo test --locked append_graph_
          run_check cargo test --locked subgraph_
          run_check cargo test --locked replacing_subgraph_
          run_check cargo test --locked division_partition_
          run_check cargo test --locked realized_state_rejects_non_finite_owner_relative_origin
          run_check cargo test --locked owner_anchor_storage_rejects_non_finite_anchor_without_mutating_inventory
          run_check cargo test --locked compact_family_storage_tests
          run_check cargo test --locked fresh_empty_library_opens_and_reopens_without_seeding_geometry
          run_check cargo test --locked concurrent_default_store_initialization_does_not_race_on_temp_files
          echo "Focused checks failed: $failures"
          test "$failures" -eq 0
      - name: Organism and seed acceptance (focused tests)
        if: always()
        timeout-minutes: 30
        run: |
          failures=0
          run_check() {
            echo
            echo ">>> $*"
            timeout 5m "$@"
            status=$?
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_check cargo test --locked cavity_seed_is_not_yet_a_viable_organism
          run_check cargo test --locked core_specific_viability_
          run_check cargo test --locked confirmed_seed_is_the_established_twelve_piece_nitrogen_ring
          run_check cargo test --locked ancestral_seed_realizes_a_physically_valid_developmental_structure
          echo "Focused checks failed: $failures"
          test "$failures" -eq 0
      - name: Environmental experiment observation (focused test)
        if: always()
        timeout-minutes: 5
        run: cargo test --locked environmental_world_observation_exposes_each_physical_resource_shape -- --nocapture
      - name: Horizontal topology regression diagnostics
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          failed=0
          for test_name in \
            physical_batch_deposit_rejects_late_invalid_destination_without_partial_commit \
            physical_split_replaces_source_only_after_every_piece_destination_is_valid \
            transport_moves_complete_material_and_preserves_inventory \
            vertical_boundary_is_a_hard_wall_not_a_wraparound_seam \
            failed_dead_recycling_deposit_preserves_all_material_and_energy_owners \
            failed_dead_material_release_preserves_organism_energy_and_field \
            harmonic_reception_depends_on_qualifying_realized_cavity \
            world_energy_inventory_reconciles_world_tone_and_structural_break_together \
            bonded_environmental_carbon_hydrogen_can_reach_natural_break_activation \
            cumulative_environmental_chemistry_totals_survive_tick_reset
          do
            cargo test --locked "$test_name" -- --nocapture || failed=1
          done
          exit "$failed"
      - name: Run Rust tests
        if: success()
        # Preserve full-suite coverage after all focused acceptance checks pass.
        timeout-minutes: 10
        run: cargo test --locked --all-targets
      - name: Run Clippy
        timeout-minutes: 5
        if: always()
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of

      # Manual performance measurement; run on demand after environmental-discovery changes:
      # cargo test --locked environmental_discovery_timing_benchmark -- --ignored --nocapture
