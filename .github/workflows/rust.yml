name: Rust

# CI trigger: validate main pushes and every pull request targeting main.

on:
  workflow_dispatch:
    inputs:
      simulation_seconds:
        description: 'Environmental chemistry smoke-test duration (10 seconds for quick validation, 60 for the standard baseline)'
        required: false
        default: '10'
        type: choice
        options:
          - '10'
          - '60'
  push:
    branches: [main, 'movement/**']
  pull_request:
    # Also validate stacked fix branches against their parent fix branch.
    branches: [main, integration/unified-source-and-catalogue, 'fix/**', resonance-time-phase-2026-10-31, resonance-driven-response-2026-10-31, resonance-attraction-repulsion-2026-10-31, resonance-energy-integration-2026-10-31, chemistry-compound-base-matrix-2026-10-29, chemistry-compound-compound-matrix-2026-10-29, chemistry-compound-compound-transaction-2026-10-29, chemistry-molecular-characterization-2026-10-29, chemistry-multimolecule-break-roundtrip-2026-10-29, chemistry-heterogeneous-molecule-interface-2026-10-29, chemistry-heterogeneous-reaction-interface-2026-10-29, chemistry-component-contact-round-robin-2026-10-29, chemistry-molecular-layout-stability-2026-10-29, 'optimization/**', 'movement/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check
      - name: Repository architecture checks
        timeout-minutes: 5
        run: |
          bash scripts/check_large_files.sh
          bash scripts/check_combine_architecture.sh
      - name: Test offline chemistry analyzer
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_chemistry_analyzer.py'
      - name: Test offline chemical organization analyzer
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_chemistry_organization_analyzer.py'
      - name: Test offline chemistry experiment batch analyzer
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_chemistry_experiment_batch_analyzer.py'
      - name: Test offline topology-aware reaction network analyzer
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_reaction_network_analyzer.py'
      - name: Test offline instance-level geometry-aware reaction network analyzer
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_geometry_aware_reaction_network.py'
      - name: Test offline contact-opportunity analyzer
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_contact_opportunity_analyzer.py'
      - name: Run Rust tests
        if: success()
        # Preserve full-suite coverage; the current all-targets suite can exceed six minutes.
        timeout-minutes: 10
        run: cargo test --locked --all-targets
      - name: Capture rustfmt correction patch
        if: always()
        run: |
          cargo fmt --all
          git diff --binary -- src/simulation/state.rs src/simulation/simulation.rs src/simulation/environment.rs src/chemistry/environmental_combine.rs src/simulation/environment_chemistry_experiment.rs src/infrastructure/diagnostics.rs src/tests/environment_tests.rs src/perception/harmonics.rs > rustfmt-corrections.patch
          cat rustfmt-corrections.patch
      - name: Upload rustfmt correction patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-corrections
          path: rustfmt-corrections.patch
          if-no-files-found: error
          retention-days: 7
      - name: Run Clippy
        timeout-minutes: 5
        if: success()
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of

  pr335-discovery-benchmark:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 335
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify extracted modules remain isolated from production reaction execution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/verify_pr335_performance.sh --isolation-only
      - name: Run isolated discovery scaling benchmark
        run: |
          set -euo pipefail
          cargo test --release --locked environmental_discovery_scaling_benchmark -- --ignored --nocapture | tee pr335-discovery-benchmark.csv
      - name: Upload isolated discovery benchmark
        uses: actions/upload-artifact@v4
        with:
          name: pr335-isolated-discovery-benchmark
          path: pr335-discovery-benchmark.csv
          if-no-files-found: error
          retention-days: 30

