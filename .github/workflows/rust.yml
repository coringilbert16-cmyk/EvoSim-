name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply construction and orientation fixes under test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/construction_realization.rs')
          s = p.read_text()
          old = 'if !crate::material_geometry::placed_forms_overlap(&pa,&pb,0.0){return false}let dx=b.placement.x-a.placement.x;let dy=b.placement.y-a.placement.y;let d=dx.hypot(dy);let(sx,sy)=if d>CONTACT_EPSILON{(dx/d,dy/d)}else{(1.0,0.0)};let scale=pa.form.bounding_radius().max(pb.form.bounding_radius()).max(1.0);let eps=1e-8*scale;let shifted=crate::material_geometry::PlacedMaterialPart{part_index:0,form:pa.form,placement:Placement{x:a.placement.x-sx*eps,y:a.placement.y-sy*eps,rotation_radians:a.placement.rotation_radians}};crate::material_geometry::placed_forms_overlap(&shifted,&pb,0.0)'
          new = 'crate::material_geometry::placed_forms_penetrate(&pa,&pb,0.0)'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy construction strict-overlap heuristic, found {s.count(old)}')
          p.write_text(s.replace(old, new))

          p = Path('src/structural_blueprint.rs')
          s = p.read_text()
          old = 'crate::material_geometry::placed_forms_overlap(&pa, &pb, 0.0)'
          new = 'crate::material_geometry::placed_forms_penetrate(&pa, &pb, 0.0)'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one orientation overlap check, found {s.count(old)}')
          p.write_text(s.replace(old, new))

          p = Path('src/structure.rs')
          s = p.read_text()
          old = 'fn units_strictly_overlap(a:&StructuralUnit,b:&StructuralUnit,catalog:&[BaseResource])->bool{let(Some(form_a),Some(form_b))=(a.shape(catalog),b.shape(catalog))else{return false};let pa=crate::material_geometry::PlacedMaterialPart{part_index:0,form:form_a.form.clone(),placement:a.placement};let pb=crate::material_geometry::PlacedMaterialPart{part_index:1,form:form_b.form.clone(),placement:b.placement};if !crate::material_geometry::placed_forms_overlap(&pa,&pb,0.0){return false}let dx=b.placement.x-a.placement.x;let dy=b.placement.y-a.placement.y;let distance=dx.hypot(dy);let(sx,sy)=if distance>1e-12{(dx/distance,dy/distance)}else{(1.0,0.0)};let scale=pa.form.bounding_radius().max(pb.form.bounding_radius()).max(1.0);let epsilon=1e-8*scale;let shifted=crate::material_geometry::PlacedMaterialPart{part_index:0,form:pa.form.clone(),placement:Placement{x:a.placement.x-sx*epsilon,y:a.placement.y-sy*epsilon,rotation_radians:a.placement.rotation_radians}};crate::material_geometry::placed_forms_overlap(&shifted,&pb,0.0)}'
          new = 'fn units_strictly_overlap(a:&StructuralUnit,b:&StructuralUnit,catalog:&[BaseResource])->bool{let(Some(form_a),Some(form_b))=(a.shape(catalog),b.shape(catalog))else{return false};let pa=crate::material_geometry::PlacedMaterialPart{part_index:0,form:form_a.form.clone(),placement:a.placement};let pb=crate::material_geometry::PlacedMaterialPart{part_index:1,form:form_b.form.clone(),placement:b.placement};crate::material_geometry::placed_forms_penetrate(&pa,&pb,0.0)}'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy structure strict-overlap heuristic, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - uses: dtolnay/rust-toolchain@stable
      - name: Format source
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check source file sizes
        run: bash scripts/check_large_files.sh
      - name: Check COMBINE architecture
        run: bash scripts/check_combine_architecture.sh
      - name: Run Rust tests
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee test-output.log
      - name: Upload Rust test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-diagnostics
          path: test-output.log
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of
      - name: Persist tested source and restore workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > .github/workflows/rust.yml <<'EOF'
          name: Rust

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                - name: Format source
                  run: cargo fmt --all
                - name: Check formatting
                  run: cargo fmt --all -- --check
                - name: Check source file sizes
                  run: bash scripts/check_large_files.sh
                - name: Check COMBINE architecture
                  run: bash scripts/check_combine_architecture.sh
                - name: Run Rust tests
                  run: |
                    set -o pipefail
                    cargo test --all-targets 2>&1 | tee test-output.log
                - name: Upload Rust test diagnostics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: rust-test-diagnostics
                    path: test-output.log
                - name: Run Clippy
                  run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of
          EOF
          git add src/construction_realization.rs src/structural_blueprint.rs src/structure.rs .github/workflows/rust.yml
          git rm .github/workflows/strict-penetration-fix.yml
          git commit -m 'Use strict penetration for construction and structure validation'
          git push