name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply pending source fixes
        if: ${{ !contains(github.event.head_commit.message, '[source-fix]') }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('main.rs')
          text = main.read_text()
          text = text.replace('.send(Message::Text(message))', '.send(Message::Text(message.into()))', 1)
          main.write_text(text)
          env = Path('environment.rs')
          text = env.read_text()
          if 'pub fn cells_within_radius(' not in text:
              needle = '''    pub fn neighbor_indices(&self, index: usize) -> Vec<usize> {\n'''
              method = '''    /// Return field cells whose centers fall within the supplied Euclidean\n    /// perception radius of a world-space point.\n    pub fn cells_within_radius(&self, x: f64, y: f64, radius: f64) -> Vec<usize> {\n        if !x.is_finite() || !y.is_finite() || !radius.is_finite() || radius < 0.0 {\n            return Vec::new();\n        }\n        if self.cells.is_empty() || self.width_cells == 0 || self.height_cells == 0 {\n            return Vec::new();\n        }\n        let min_x = (x - radius).max(0.0);\n        let max_x = x + radius;\n        let min_y = (y - radius).max(0.0);\n        let max_y = y + radius;\n        let min_col = (min_x / self.cell_size).floor() as usize;\n        let max_col = ((max_x / self.cell_size).floor() as usize).min(self.width_cells.saturating_sub(1));\n        let min_row = (min_y / self.cell_size).floor() as usize;\n        let max_row = ((max_y / self.cell_size).floor() as usize).min(self.height_cells.saturating_sub(1));\n        if min_col >= self.width_cells || min_row >= self.height_cells || min_col > max_col || min_row > max_row {\n            return Vec::new();\n        }\n        let radius_squared = radius * radius;\n        let mut indices = Vec::new();\n        for row in min_row..=max_row {\n            for col in min_col..=max_col {\n                let index = row * self.width_cells + col;\n                let (cell_x, cell_y) = self.cell_center(index);\n                let dx = cell_x - x;\n                let dy = cell_y - y;\n                if dx * dx + dy * dy <= radius_squared {\n                    indices.push(index);\n                }\n            }\n        }\n        indices\n    }\n\n'''
              if needle not in text:
                  raise SystemExit('Could not locate field neighbor_indices')
              text = text.replace(needle, method + needle, 1)
          env.write_text(text)
          PY
          rm -f .github/workflows/apply-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.rs environment.rs .github/workflows/apply-fixes.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix remaining Rust compile blockers [source-fix]"
          git push
      - name: Run Rust tests
        run: cargo test --all-targets
