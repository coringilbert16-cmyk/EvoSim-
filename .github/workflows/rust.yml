name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply Phase 1 acquisition target fix
        if: github.head_ref == 'phase1-physical-authority'
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'src/simulation.rs';
            const ref = 'phase1-physical-authority';
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref,
            });
            const current = Buffer.from(data.content, 'base64').toString('utf8');
            const oldText = `            || cell
                .materials
                .iter()
                .any(|material| !material.is_empty() && material.is_valid())`;
            const newText = `            || cell
                .materials
                .iter()
                .any(|material| {
                    !material.is_empty()
                        && material.is_valid()
                        && !material.has_internal_structure()
                })`;
            if (current.includes(oldText)) {
              const updated = current.replace(oldText, newText);
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: 'Phase 1: restrict acquisition targets to physically acquirable material',
                content: Buffer.from(updated, 'utf8').toString('base64'),
                sha: data.sha,
                branch: ref,
              });
            }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check source file sizes
        run: bash scripts/check_large_files.sh
      - name: Check COMBINE architecture
        run: bash scripts/check_combine_architecture.sh
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of
