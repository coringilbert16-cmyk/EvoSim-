name: Rust

# CI trigger: validate main pushes and every pull request targeting main.

on:
  workflow_dispatch:
    inputs:
      simulation_seconds:
        description: 'Environmental chemistry smoke-test duration (10 seconds for quick validation, 60 for the standard baseline)'
        required: false
        default: '10'
        type: choice
        options:
          - '10'
          - '60'
      run_domain_scaling_benchmark:
        description: 'Run the manual 32/64/128/250 bounded-domain scaling benchmark'
        required: false
        default: false
        type: boolean
  push:
    branches: [main, 'movement/**']
  pull_request:
    # Also validate stacked fix branches against their parent fix branch.
    branches: [main, integration/unified-source-and-catalogue, 'fix/**', resonance-time-phase-2026-10-31, resonance-driven-response-2026-10-31, resonance-attraction-repulsion-2026-10-31, resonance-energy-integration-2026-10-31, chemistry-compound-base-matrix-2026-10-29, chemistry-compound-compound-matrix-2026-10-29, chemistry-compound-compound-transaction-2026-10-29, chemistry-molecular-characterization-2026-10-29, chemistry-multimolecule-break-roundtrip-2026-10-29, chemistry-heterogeneous-molecule-interface-2026-10-29, chemistry-heterogeneous-reaction-interface-2026-10-29, chemistry-component-contact-round-robin-2026-10-29, chemistry-molecular-layout-stability-2026-10-29, 'optimization/**', 'movement/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check
      - name: Repository architecture checks
        timeout-minutes: 5
        run: |
          bash scripts/check_large_files.sh
          bash scripts/check_combine_architecture.sh
      - name: Test offline analyzers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_chemistry_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_chemistry_organization_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_chemistry_experiment_batch_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_reaction_network_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_geometry_aware_reaction_network.py'
          python3 -m unittest discover -s tests -p 'test_contact_opportunity_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_temporal_chemical_complexity_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_experiment_manifest.py'
          python3 -m unittest discover -s tests -p 'test_unified_chemistry_analysis.py'
          python3 -m unittest discover -s tests -p 'test_compact_experiment_records.py'
          python3 -m unittest discover -s tests -p 'test_finalize_experiment_records.py'
          python3 -m unittest discover -s tests -p 'test_update_experiment_registry.py'
          python3 -m unittest discover -s tests -p 'test_compare_historical_specialist_outputs.py'
          python3 -m unittest discover -s tests -p 'test_obs001_historical_pilot_workflow.py'
      - name: Run Rust tests
        if: success()
        # Preserve full-suite coverage; the current all-targets suite can exceed six minutes.
        timeout-minutes: 10
        run: cargo test --locked --all-targets
      - name: Run shared environmental chemistry smoke simulation
        if: success()
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cargo run --locked -- \
            --headless \
            --environment-chemistry-experiment \
            --seconds "${{ github.event_name == 'pull_request' && github.head_ref == 'perf/world-tone-material-response' && '60' || inputs.simulation_seconds || '10' }}" \
            --seed 42 \
            --diagnostics environmental-chemistry-smoke.jsonl \
            --diagnostic-interval 100
      - name: Validate generated experiment manifest
        if: success()
        run: python3 tools/experiment_manifest.py environmental-chemistry-smoke.jsonl.manifest.json
      - name: Analyze shared chemistry smoke output
        if: success()
        run: |
          python3 tools/chemistry_analyzer.py environmental-chemistry-smoke.jsonl \
            --json-out environmental-chemistry-smoke-analysis.json \
            --markdown-out environmental-chemistry-smoke-analysis.md
      - name: Analyze shared chemical organization output
        if: success()
        run: |
          python3 tools/chemistry_organization_analyzer.py environmental-chemistry-smoke.jsonl \
            --json-out environmental-chemistry-smoke-organization.json \
            --markdown-out environmental-chemistry-smoke-organization.md
      - name: Upload shared environmental chemistry smoke output
        if: always() && hashFiles('environmental-chemistry-smoke.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: environmental-chemistry-smoke-output
          path: |
            environmental-chemistry-smoke.jsonl
            environmental-chemistry-smoke.jsonl.manifest.json
            environmental-chemistry-smoke-analysis.json
            environmental-chemistry-smoke-analysis.md
            environmental-chemistry-smoke-organization.json
            environmental-chemistry-smoke-organization.md
          if-no-files-found: error
          retention-days: 14
      - name: Run Clippy
        timeout-minutes: 5
        if: success()
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of


  domain-scaling-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_domain_scaling_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Benchmark bounded resonance-domain sizes
        run: bash scripts/benchmark_resonance_domain_scaling.sh
