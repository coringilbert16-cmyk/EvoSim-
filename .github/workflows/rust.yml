name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize formatting for validation snapshot
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check source file sizes
        run: bash scripts/check_large_files.sh
      - name: Check COMBINE architecture
        run: bash scripts/check_combine_architecture.sh
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::unnecessary_sort_by -A clippy::unnecessary_map_or -A clippy::manual_is_multiple_of
      - name: Show normalized changed source
        if: always()
        run: git diff -- src/genome.rs src/juvenile.rs src/reproduction.rs src/simulation_tests.rs
