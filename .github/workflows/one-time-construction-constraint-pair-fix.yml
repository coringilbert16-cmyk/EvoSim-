name: One-time construction constraint-pair fix

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply construction constraint-pair solver fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch construction candidate generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/construction_realization.rs')
          s = p.read_text()

          old_pair = '''                        let rotated = rotate_point(pa, fixed_rotation);\n                        let expected_b = rotate_point(pb, fixed_rotation);\n                        if (wa.0 + expected_b.0 - wb.0).hypot(wa.1 + expected_b.1 - wb.1) > 1e-7 {\n                            continue;\n                        }'''
          new_pair = '''                        let rotated_a = rotate_point(pa, fixed_rotation);\n                        let rotated_b = rotate_point(pb, fixed_rotation);\n                        let expected_dx = rotated_b.0 - rotated_a.0;\n                        let expected_dy = rotated_b.1 - rotated_a.1;\n                        let actual_dx = wb.0 - wa.0;\n                        let actual_dy = wb.1 - wa.1;\n                        if (expected_dx - actual_dx).hypot(expected_dy - actual_dy) > 1e-7 {\n                            continue;\n                        }'''
          if old_pair not in s:
              raise SystemExit('pair geometry block not found')
          s = s.replace(old_pair, new_pair, 1)

          old_targets = '''        let mut candidates = Vec::new();\n        let internal_targets = contact_targets_for_units(&working, &internal_target_units, c);\n        for candidate in candidate_placements_for_targets(\n            res,\n            &internal_targets,\n            &working,\n            anchor,\n            fixed_rotation,\n            c,\n        ) {\n            add_unique_placement(&mut candidates, candidate);\n        }\n\n        for constraint in external {\n            for &target_unit in constraint {\n                let targets = contact_targets_for_units(&working, &[target_unit], c);\n                for candidate in candidate_placements_for_targets(\n                    res,\n                    &targets,\n                    &working,\n                    anchor,\n                    fixed_rotation,\n                    c,\n                ) {\n                    add_unique_placement(&mut candidates, candidate);\n                }\n            }\n        }'''
          new_targets = '''        let mut candidates = Vec::new();\n        let internal_targets = contact_targets_for_units(&working, &internal_target_units, c);\n\n        for candidate in candidate_placements_for_targets(\n            res,\n            &internal_targets,\n            &working,\n            anchor,\n            fixed_rotation,\n            c,\n        ) {\n            add_unique_placement(&mut candidates, candidate);\n        }\n\n        let external_target_groups: Vec<Vec<ContactTarget>> = external\n            .iter()\n            .map(|group| contact_targets_for_units(&working, group, c))\n            .collect();\n\n        for (group_index, group_targets) in external_target_groups.iter().enumerate() {\n            let mut targets = internal_targets.clone();\n            targets.extend(group_targets.iter().copied());\n            for candidate in candidate_placements_for_targets(\n                res,\n                &targets,\n                &working,\n                anchor,\n                fixed_rotation,\n                c,\n            ) {\n                add_unique_placement(&mut candidates, candidate);\n            }\n\n            for other_group_targets in external_target_groups.iter().skip(group_index + 1) {\n                let mut pair_targets = group_targets.clone();\n                pair_targets.extend(other_group_targets.iter().copied());\n                for candidate in candidate_placements_for_targets(\n                    res,\n                    &pair_targets,\n                    &working,\n                    anchor,\n                    fixed_rotation,\n                    c,\n                ) {\n                    add_unique_placement(&mut candidates, candidate);\n                }\n            }\n        }'''
          if old_targets not in s:
              raise SystemExit('external candidate-generation block not found')
          p.write_text(s.replace(old_targets, new_targets, 1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/construction_realization.rs
          git rm .github/workflows/one-time-construction-constraint-pair-fix.yml
          git commit -m "Apply construction constraint-pair solver fix"
          git push
