name: Sulfur Parallelogram Geometry Experiment

on:
  pull_request:
    branches: [fix/fluid-coalescence-transaction-2026-10-12]
    paths:
      - "src/materials/resources.rs"
      - "src/construction/material_selection.rs"
      - "src/chemistry/chemistry_library.rs"
      - "src/bob/library.rs"
      - "README.md"
      - ".github/workflows/sulfur-parallelogram-experiment.yml"

permissions:
  contents: read

jobs:
  compare-bob-two-piece-catalogues:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Check out sulfur-parallelogram variant
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: variant

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        working-directory: variant
        run: cargo fmt --all -- --check

      - name: Run full Rust suites on baseline twice and variant once
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/sulfur-baseline-test-library-1" "${{ runner.temp }}/sulfur-baseline-test-library-2" "${{ runner.temp }}/sulfur-variant-test-library"
          set +e
          (
            cd baseline
            EVOSIM_GEOMETRY_LIBRARY_DIR="${{ runner.temp }}/sulfur-baseline-test-library-1" cargo test --all-targets
          ) > "${{ runner.temp }}/sulfur-baseline-1-tests.log" 2>&1
          baseline_status_1=$?
          (
            cd baseline
            EVOSIM_GEOMETRY_LIBRARY_DIR="${{ runner.temp }}/sulfur-baseline-test-library-2" cargo test --all-targets
          ) > "${{ runner.temp }}/sulfur-baseline-2-tests.log" 2>&1
          baseline_status_2=$?
          (
            cd variant
            EVOSIM_GEOMETRY_LIBRARY_DIR="${{ runner.temp }}/sulfur-variant-test-library" cargo test --all-targets
          ) > "${{ runner.temp }}/sulfur-variant-tests.log" 2>&1
          variant_status=$?
          set -e
          printf '%s\n' "$baseline_status_1" > "${{ runner.temp }}/sulfur-baseline-1-tests.exit"
          printf '%s\n' "$baseline_status_2" > "${{ runner.temp }}/sulfur-baseline-2-tests.exit"
          printf '%s\n' "$variant_status" > "${{ runner.temp }}/sulfur-variant-tests.exit"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          def read(label):
              return (root / f"sulfur-{label}-tests.log").read_text(
                  encoding="utf-8", errors="replace"
              )
          def failures(output):
              return set(re.findall(r"^test (.+) \.\.\. FAILED$", output, re.MULTILINE))
          outputs = {
              "baseline-1": read("baseline-1"),
              "baseline-2": read("baseline-2"),
              "variant": read("variant"),
          }
          failed = {label: failures(output) for label, output in outputs.items()}
          baseline_failures = failed["baseline-1"] | failed["baseline-2"]
          new_failures = sorted(failed["variant"] - baseline_failures)
          statuses = {
              "baseline-1": int((root / "sulfur-baseline-1-tests.exit").read_text().strip()),
              "baseline-2": int((root / "sulfur-baseline-2-tests.exit").read_text().strip()),
              "variant": int((root / "sulfur-variant-tests.exit").read_text().strip()),
          }
          compile_error = {
              label: "could not compile" in output or "error[E" in output
              for label, output in outputs.items()
          }
          for label in outputs:
              print(f"{label}_exit={statuses[label]}; failed_tests={len(failed[label])}")
          print("Baseline failure union (captures known intermittent baseline failures):")
          for name in sorted(baseline_failures):
              print(f"  {name}")
          print("New variant failures:")
          for name in new_failures:
              print(f"  {name}")
          if any(compile_error.values()):
              raise SystemExit("Rust suite failed to compile on baseline or variant")
          for label in outputs:
              if statuses[label] != 0 and not failed[label]:
                  raise SystemExit(f"{label} cargo test failed without identifiable test failures")
          if new_failures:
              raise SystemExit("Sulfur variant introduced test failures beyond two baseline runs")
          print("No additional named test failures relative to either baseline run.")
          PY

      - name: Upload Rust test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sulfur-parallelogram-rust-test-logs
          path: |
            ${{ runner.temp }}/sulfur-baseline-1-tests.log
            ${{ runner.temp }}/sulfur-baseline-2-tests.log
            ${{ runner.temp }}/sulfur-variant-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run baseline Bob generation (up to two pieces)
        working-directory: baseline
        env:
          EVOSIM_GEOMETRY_LIBRARY_DIR: ${{ runner.temp }}/sulfur-baseline-library
        run: |
          set -euo pipefail
          mkdir -p "$EVOSIM_GEOMETRY_LIBRARY_DIR"
          cargo run --release -- --geometry-worker-complete-up-to 2 2>&1 | tee "${{ runner.temp }}/sulfur-baseline.log"

      - name: Run parallelogram Bob generation (up to two pieces)
        working-directory: variant
        env:
          EVOSIM_GEOMETRY_LIBRARY_DIR: ${{ runner.temp }}/sulfur-parallelogram-library
        run: |
          set -euo pipefail
          mkdir -p "$EVOSIM_GEOMETRY_LIBRARY_DIR"
          cargo run --release -- --geometry-worker-complete-up-to 2 2>&1 | tee "${{ runner.temp }}/sulfur-parallelogram.log"

      - name: Compare counts, sulfur-containing records, runtime, and storage
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          roots = {
              "baseline": temp / "sulfur-baseline-library",
              "parallelogram": temp / "sulfur-parallelogram-library",
          }
          for label, root in roots.items():
              print(f"=== {label} ===")
              total_bytes = sum(p.stat().st_size for p in root.glob("*") if p.is_file())
              print(f"total_bytes={total_bytes}")
              for filename in (
                  "formations.jsonl",
                  "rigid_contact_families.jsonl",
                  "rigid_point_contact_families.jsonl",
                  "rigid_vertex_contact_families.jsonl",
                  "fluid_boundary_families.jsonl",
              ):
                  path = root / filename
                  if not path.exists():
                      print(f"{filename}: records=0 sulfur_records=0 bytes=0")
                      continue
                  records = 0
                  sulfur_records = 0
                  sulfur_partner_counts = Counter()
                  with path.open(encoding="utf-8") as stream:
                      for line in stream:
                          if not line.strip():
                              continue
                          records += 1
                          try:
                              record = json.loads(line)
                              if "Sulfur" in json.dumps(record, ensure_ascii=False):
                                  sulfur_records += 1
                              if filename == "formations.jsonl":
                                  resources = [
                                      item.get("resource")
                                      for item in record.get("constituents", [])
                                      if isinstance(item, dict)
                                  ]
                                  if "Sulfur" in resources:
                                      for partner in sorted(set(resources) - {"Sulfur"}):
                                          sulfur_partner_counts[partner] += 1
                          except json.JSONDecodeError:
                              if "Sulfur" in line:
                                  sulfur_records += 1
                  print(f"{filename}: records={records} sulfur_records={sulfur_records} bytes={path.stat().st_size}")
                  if filename == "formations.jsonl":
                      print("sulfur_partner_counts=" + json.dumps(dict(sorted(sulfur_partner_counts.items()))))
              log = temp / f"sulfur-{label}.log"
              if log.exists():
                  for line in log.read_text(encoding="utf-8", errors="replace").splitlines():
                      if "geometry worker complete:" in line:
                          print(line)
          PY

      - name: Upload both isolated catalogues and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sulfur-parallelogram-two-piece-comparison
          path: |
            ${{ runner.temp }}/sulfur-baseline-library/
            ${{ runner.temp }}/sulfur-parallelogram-library/
            ${{ runner.temp }}/sulfur-baseline.log
            ${{ runner.temp }}/sulfur-parallelogram.log
          if-no-files-found: warn
          retention-days: 14
