name: One-time placement dedupe correction

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix placement dedupe logic' && github.event.head_commit.message != 'Remove temporary placement fix workflow after patch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix add_unique_placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/construction_realization.rs')
          s = p.read_text()
          old = '''    if !out.iter().any(|e| {\n        (e.x - placement.x).abs() <= CONTACT_EPSILON\n            && (e.y - placement.y).abs() <= CONTACT_EPSILON\n            && ((e.rotation_radians - normalized).abs() <= 1e-10\n                || (e.rotation_radians - rem_euclid_tau(normalized)).abs() <= 1e-10)\n    }) {\n        return;\n    }\n    out.push(placement)'''
          new = '''    if out.iter().any(|e| {\n        (e.x - placement.x).abs() <= CONTACT_EPSILON\n            && (e.y - placement.y).abs() <= CONTACT_EPSILON\n            && ((e.rotation_radians - normalized).abs() <= 1e-10\n                || (e.rotation_radians.rem_euclid(std::f64::consts::TAU) - normalized).abs() <= 1e-10)\n    }) {\n        return;\n    }\n    out.push(placement)'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit correction and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add src/construction_realization.rs
          git rm .github/workflows/one-time-add-unique-fix.yml
          git commit -m "Fix placement dedupe logic"
          git push
