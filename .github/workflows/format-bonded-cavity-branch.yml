name: Format bonded cavity branch

on:
  push:
    branches: [implement/bonded-cavity-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Repair generated cavity syntax before formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/cavity.rs')
          s = p.read_text()
          s = s.replace(
              'if !out.iter().any(|(u,_):&(f64,Point)|(*u-t).abs()<=EPS){out.push((t,a.add(d.scale(t)))}}}out}',
              'if !out.iter().any(|(u, _): &(f64, Point)| (*u - t).abs() <= EPS) { out.push((t, a.add(d.scale(t)))); } } out}',
              1,
          )
          replacement = '''fn line_circle_intersections(a: Point, b: Point, center: Point, radius: f64) -> Vec<(f64, Point)> {
              let d = b.sub(a);
              let f = a.sub(center);
              let aa = d.dot(d);
              if aa <= EPS { return Vec::new(); }
              let bb = 2.0 * f.dot(d);
              let cc = f.dot(f) - radius * radius;
              let discriminant = bb * bb - 4.0 * aa * cc;
              if discriminant < -EPS { return Vec::new(); }
              let root = discriminant.max(0.0).sqrt();
              let mut out = Vec::new();
              for t in [(-bb - root) / (2.0 * aa), (-bb + root) / (2.0 * aa)] {
                  if t >= -EPS && t <= 1.0 + EPS {
                      let t = t.clamp(0.0, 1.0);
                      if !out.iter().any(|(u, _)| (*u - t).abs() <= EPS) {
                          out.push((t, a.add(d.scale(t))));
                      }
                  }
              }
              out
          }
          fn circle_circle_intersections'''
          s, count = re.subn(r'fn line_circle_intersections.*?fn circle_circle_intersections', replacement, s, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit('expected line-circle function was not found')
          p.write_text(s)
          PY
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit formatted source and remove formatter
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git rm .github/workflows/format-bonded-cavity-branch.yml
          git commit -m 'Format bonded cavity implementation'
          git push
