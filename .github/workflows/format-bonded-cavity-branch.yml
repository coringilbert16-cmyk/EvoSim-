name: Format bonded cavity branch

on:
  push:
    branches: [implement/bonded-cavity-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Repair generated cavity syntax before formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/cavity.rs')
          s = p.read_text()
          old = 'if !out.iter().any(|(u,_):&(f64,Point)|(*u-t).abs()<=EPS){out.push((t,a.add(d.scale(t)))}}}out}'
          new = 'if !out.iter().any(|(u, _): &(f64, Point)| (*u - t).abs() <= EPS) { out.push((t, a.add(d.scale(t)))); } } out}'
          if old not in s:
              raise SystemExit('expected cavity syntax fragment was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit formatted source and remove formatter
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git rm .github/workflows/format-bonded-cavity-branch.yml
          git commit -m 'Format bonded cavity implementation'
          git push
