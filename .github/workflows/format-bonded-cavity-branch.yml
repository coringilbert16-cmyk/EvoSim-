name: Format bonded cavity branch

on:
  push:
    branches: [implement/bonded-cavity-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit formatted source and remove formatter
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git rm .github/workflows/format-bonded-cavity-branch.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format bonded cavity implementation'
          git push
