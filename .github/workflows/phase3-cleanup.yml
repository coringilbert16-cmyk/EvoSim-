name: phase3-cleanup
on:
  push:
    branches: [phase3-physical-structure-authority]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete PhysicalMaterialInstance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/material_geometry.rs')
          s = p.read_text()
          pattern = r'(?ms)^#\[derive\(Clone, Debug, PartialEq\)\]\npub struct PhysicalMaterialInstance \{.*?^\}\nimpl PhysicalMaterialInstance \{.*?^\}\n'
          updated, count = re.subn(pattern, '', s, count=1)
          if count != 1:
              raise SystemExit(f'expected one PhysicalMaterialInstance block, found {count}')
          test_pattern = r'(?ms)^    #\[test\]\n    fn physical_instance_keeps_material_and_geometry_together\(\) \{.*?^    \}\n'
          updated, test_count = re.subn(test_pattern, '', updated, count=1)
          if test_count != 1:
              raise SystemExit(f'expected one obsolete PhysicalMaterialInstance test, found {test_count}')
          p.write_text(updated)
          PY
          cargo fmt --all
          cargo test --all-targets
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/material_geometry.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 3: remove obsolete PhysicalMaterialInstance abstraction'
          git push
