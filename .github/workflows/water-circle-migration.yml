name: Water circle migration

on:
  push:
    branches:
      - unified-physical-graph

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Water circle migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Water circle migration
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          # Resource model: remove the obsolete fluid form and make Water a circle.
          replace('src/resources.rs', '''    Polygon { vertices: Vec<(f64, f64)> },\n    Fluid { nominal_area: f64 },\n''', '''    Polygon { vertices: Vec<(f64, f64)> },\n''')
          replace('src/resources.rs', '''            Form::Polygon { vertices } => {\n                vertices.len() >= 3 && vertices.iter().all(|(x, y)| x.is_finite() && y.is_finite())\n            }\n            Form::Fluid { nominal_area } => nominal_area.is_finite() && *nominal_area > 0.0,\n''', '''            Form::Polygon { vertices } => {\n                vertices.len() >= 3 && vertices.iter().all(|(x, y)| x.is_finite() && y.is_finite())\n            }\n''')
          replace('src/resources.rs', '''        match self {\n            Form::Circle { .. } | Form::Fluid { .. } => None,\n''', '''        match self {\n            Form::Circle { .. } => None,\n''')
          replace('src/resources.rs', '''            Form::Polygon { vertices } => vertices\n                .iter()\n                .map(|(x, y)| (x * x + y * y).sqrt())\n                .fold(0.0_f64, f64::max),\n            Form::Fluid { nominal_area } => (nominal_area / std::f64::consts::PI).sqrt(),\n''', '''            Form::Polygon { vertices } => vertices\n                .iter()\n                .map(|(x, y)| (x * x + y * y).sqrt())\n                .fold(0.0_f64, f64::max),\n''')
          replace('src/resources.rs', '''            Form::Circle { radius } => ConnectionSites::Circumference { radius: *radius },\n            Form::Fluid { .. } => ConnectionSites::Undetermined,\n''', '''            Form::Circle { radius } => ConnectionSites::Circumference { radius: *radius },\n''')
          replace('src/resources.rs', '''pub const NOMINAL_UNIT_AREA: f64 = 0.5;\n\n''', '')
          replace('src/resources.rs', '''            shape: Shape {\n                form: Form::Fluid {\n                    nominal_area: NOMINAL_UNIT_AREA,\n                },\n            },\n''', '''            shape: Shape {\n                form: Form::Circle { radius: 0.398_942 },\n            },\n''')
          replace('src/resources.rs', '''                Form::Circle { .. } | Form::Fluid { .. } => {\n''', '''                Form::Circle { .. } => {\n''')
          replace('src/resources.rs', '''                Form::Circle { radius } => std::f64::consts::PI * radius * radius,\n                Form::Fluid { nominal_area } => *nominal_area,\n''', '''                Form::Circle { radius } => std::f64::consts::PI * radius * radius,\n''')
          replace('src/resources.rs', '''    fn water_is_a_fluid_with_undetermined_connection_sites() {\n        let water = default_catalog().into_iter().find(|r| r.name == "Water").unwrap();\n        assert!(matches!(water.shape.form, Form::Fluid { .. }));\n        assert_eq!(water.shape.connection_sites(), ConnectionSites::Undetermined);\n    }\n''', '''    fn water_is_a_circle_with_circumference_connection_sites() {\n        let water = default_catalog().into_iter().find(|r| r.name == "Water").unwrap();\n        assert!(matches!(water.shape.form, Form::Circle { radius } if radius > 0.0));\n        assert!(matches!(water.shape.connection_sites(), ConnectionSites::Circumference { radius } if radius > 0.0));\n    }\n''')
          replace('src/resources.rs', '''        assert_eq!(catalog.iter().filter(|r| matches!(r.shape.form, Form::Circle { .. })).count(), 1);\n''', '''        assert_eq!(catalog.iter().filter(|r| matches!(r.shape.form, Form::Circle { .. })).count(), 2);\n''')
          replace('src/resources.rs', '''    fn every_resource_has_a_unique_shape() {\n        let catalog = default_catalog();\n        assert_eq!(catalog.iter().filter(|r| matches!(r.shape.form, Form::Circle { .. })).count(), 2);\n        for i in 0..catalog.len() {\n            for j in (i + 1)..catalog.len() {\n                assert_ne!(catalog[i].shape.form, catalog[j].shape.form);\n            }\n        }\n    }\n''', '''    fn multiple_resources_may_share_the_same_physical_shape() {\n        let catalog = default_catalog();\n        let circles = catalog.iter().filter(|r| matches!(r.shape.form, Form::Circle { .. })).count();\n        assert_eq!(circles, 2);\n    }\n''')

          # The unified graph no longer has a Fluid endpoint; remove obsolete
          # fluid-specific branches from the remaining geometry helpers.
          replace('src/interface_geometry.rs', '        Form::Circle { .. } | Form::Fluid { .. } => 0.0,\n', '        Form::Circle { .. } => 0.0,\n')
          replace('src/interface_geometry.rs', '        (Form::Fluid { .. }, _) | (_, Form::Fluid { .. }) => 0.0,\n', '')
          replace('src/material_geometry.rs', '        (Form::Fluid { .. }, _) | (_, Form::Fluid { .. }) => false,\n', '')
          replace('src/boundary_contact.rs', '        (Form::Fluid { .. }, _) | (_, Form::Fluid { .. }) => false,\n', '')

          # Structural-material geometry no longer needs a special fluid exclusion.
          p = Path('src/structural_material.rs')
          text = p.read_text()
          old = '''        if matches!(&resource.shape.form, Form::Fluid { .. }) {\n            return None;\n        }\n'''
          if old in text:
              text = text.replace(old, '')
          old_test = '''    fn standalone_water_is_a_fluid_connection_region() {\n        let s = StructuralMaterial::from_material(Material::free_base("Water", 1.0)).unwrap();\n        let c = default_catalog();\n        assert!(matches!(s.shape(&c).unwrap().form, Form::Fluid { .. }));\n        assert!(matches!(s.connection_sites(&c).unwrap(), ConnectionSites::Undetermined));\n    }\n'''
          new_test = '''    fn standalone_water_is_a_circle_connection_region() {\n        let s = StructuralMaterial::from_material(Material::free_base("Water", 1.0)).unwrap();\n        let c = default_catalog();\n        assert!(matches!(s.shape(&c).unwrap().form, Form::Circle { radius } if *radius > 0.0));\n        assert!(matches!(s.connection_sites(&c).unwrap(), ConnectionSites::Circumference { radius } if *radius > 0.0));\n    }\n'''
          if old_test in text:
              text = text.replace(old_test, new_test)
          p.write_text(text)

          # Remove stale test language from material geometry and replace it
          # with the now-authoritative Water circle behavior.
          replace('src/material_geometry.rs', '''    #[test]\n    fn fluid_has_no_invented_spatial_boundary() {\n        let fluid = part(Form::Fluid { nominal_area: 100.0 }, 0.0, 0.0, 0.0);\n        let circle = part(Form::Circle { radius: 10.0 }, 0.0, 0.0, 0.0);\n        assert!(!placed_forms_overlap(&fluid, &circle, 0.0));\n    }\n''', '''    #[test]\n    fn water_uses_explicit_circle_geometry() {\n        let water = default_catalog().into_iter().find(|r| r.name == "Water").unwrap();\n        assert!(matches!(water.shape.form, Form::Circle { .. }));\n        let water_part = part(water.shape.form.clone(), 0.0, 0.0, 0.0);\n        let other = part(Form::Circle { radius: 0.398_942 }, 0.5, 0.0, 0.0);\n        assert!(placed_forms_overlap(&water_part, &other, 0.0));\n    }\n''')

          # The old uniqueness test is invalid once Water shares circular
          # geometry with Hydrogen; shape identity is not resource identity.
          for path in ['src/resources.rs']:
              if 'Form::Fluid' in Path(path).read_text():
                  raise SystemExit(f'stale Form::Fluid remains in {path}')
          for path in ['src/interface_geometry.rs','src/material_geometry.rs','src/boundary_contact.rs','src/structural_material.rs']:
              if 'Form::Fluid' in Path(path).read_text():
                  raise SystemExit(f'stale Form::Fluid remains in {path}')
          PY
          if git diff --quiet; then
            echo 'Water circle migration made no changes'
            exit 0
          fi
          cargo fmt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/resources.rs src/interface_geometry.rs src/material_geometry.rs src/boundary_contact.rs src/structural_material.rs
          git commit -m 'Apply Water circle migration'
          git push
