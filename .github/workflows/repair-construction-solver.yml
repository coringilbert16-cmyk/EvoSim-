name: Repair construction solver
on:
  push:
    paths:
      - '.github/workflows/repair-construction-solver.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply anchored-root solver candidate
        run: |
          git checkout 7268774304946d49612fe5ef3f48cf758f0f0540 -- src/construction_realization.rs
          sed -i 's/y: wa\.1 - rotated\.1,/y: wa.1 - rotated_a.1,/' src/construction_realization.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/construction_realization.rs')
          s = p.read_text()
          old = 'let candidates=candidate_placements_for_targets(res,&targets,&working,anchor,fixed_rotation,c);'
          new = 'let candidates=if part==0{vec![Placement{x:anchor.x,y:anchor.y,rotation_radians:fixed_rotation}]}else{candidate_placements_for_targets(res,&targets,&working,anchor,fixed_rotation,c)};'
          if old not in s:
              raise SystemExit('solver candidate line not found')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt --all
      - name: Run fresh organism realization test
        run: cargo test --all-targets fresh_organism_is_realized_from_its_genome_blueprint -- --nocapture
      - name: Run full tests
        run: cargo test --all-targets
      - name: Commit repaired solver and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/construction_realization.rs
          git rm .github/workflows/repair-construction-solver.yml
          git commit -m 'Anchor material construction to blueprint frame'
          git push
