name: Reset construction solver
on:
  push:
    paths:
      - '.github/workflows/repair-construction-solver.yml'

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-complete solver baseline
        run: |
          git checkout a5a2a6cb5f6662544d7feff2046cc68d9b744537 -- src/construction_realization.rs
          cargo fmt --all
          cargo check --all-targets
      - name: Commit baseline and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/construction_realization.rs
          git rm .github/workflows/repair-construction-solver.yml
          git commit -m 'Reset construction solver to known-complete baseline'
          git push
