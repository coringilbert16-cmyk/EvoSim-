name: Fix construction source

on:
  push:
    paths:
      - '.github/workflows/fix-construction-source.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale pair-placement reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/construction_realization.rs')
          s = p.read_text()
          old = 'y: wa.1 - rotated.1,'
          new = 'y: wa.1 - rotated_a.1,'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale reference, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all -- --check
          cargo check --all-targets
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/construction_realization.rs
          git rm .github/workflows/fix-construction-source.yml
          git commit -m 'Fix construction solver pair placement reference'
          git push
