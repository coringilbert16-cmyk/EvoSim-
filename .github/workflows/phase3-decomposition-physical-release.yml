name: phase3-decomposition-physical-release

on:
  push:
    branches: [phase3-physical-structure-authority]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-physical-structure-authority
          fetch-depth: 0

      - name: Route released physical material into the physical field
        run: |
          python3 - <<'PY'
          from pathlib import Path

          environment = Path('src/environment.rs')
          text = environment.read_text()
          old = '''    pub fn deposit(&mut self, x: f64, y: f64, material: Material) -> bool {
        match self.index_for_position(x, y) {
            Some(index) => {
                self.deposit_at_index(index, material);
                true
            }
            None => false,
        }
    }
'''
          new = '''    pub(crate) fn deposit<T: Into<FieldDeposit>>(&mut self, x: f64, y: f64, material: T) -> bool {
        let Some(index) = self.index_for_position(x, y) else {
            return false;
        };
        match material.into() {
            FieldDeposit::Logical(material) => {
                self.deposit_at_index(index, material);
                true
            }
            FieldDeposit::Physical(material) => self.deposit_physical_at_index(index, material),
        }
    }
'''
          if old not in text:
              raise SystemExit('environment deposit block not found')
          text = text.replace(old, new, 1)
          marker = '''impl FieldCell {
'''
          insert = '''pub(crate) enum FieldDeposit {
    Logical(Material),
    Physical(PhysicalMaterial),
}

impl From<Material> for FieldDeposit {
    fn from(material: Material) -> Self {
        Self::Logical(material)
    }
}

impl From<PhysicalMaterial> for FieldDeposit {
    fn from(material: PhysicalMaterial) -> Self {
        Self::Physical(material)
    }
}

impl FieldCell {
'''
          if marker not in text:
              raise SystemExit('FieldCell marker not found')
          text = text.replace(marker, insert, 1)
          environment.write_text(text)

          simulation = Path('src/simulation.rs')
          text = simulation.read_text()
          old = '''                for material in materials {
                    self.environment
                        .field
                        .deposit(position.x, position.y, material);
                }
'''
          if old not in text:
              raise SystemExit('simulation release block unexpectedly changed')
          simulation.write_text(text)
          PY

      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --all-targets

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/environment.rs src/simulation.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 3: preserve physical material during decomposition'
          git push origin HEAD:phase3-physical-structure-authority

# Triggered after the workflow file itself is established on the migration branch.
