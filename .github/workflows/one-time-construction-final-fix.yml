name: One-time construction realization correction

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply construction realization correction'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrow solver correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/construction_realization.rs')
          s = p.read_text()

          old = '''    if !out.iter().any(|e| {\n        (e.x - placement.x).abs() <= CONTACT_EPSILON\n            && (e.y - placement.y).abs() <= CONTACT_EPSILON\n            && ((e.rotation_radians - normalized).abs() <= 1e-10\n                || (e.rotation_radians - rem_euclid_tau(normalized)).abs() <= 1e-10)\n    }) {\n        return;\n    }\n    out.push(placement)'''
          new = '''    if out.iter().any(|e| {\n        (e.x - placement.x).abs() <= CONTACT_EPSILON\n            && (e.y - placement.y).abs() <= CONTACT_EPSILON\n            && ((e.rotation_radians - normalized).abs() <= 1e-10\n                || (e.rotation_radians.rem_euclid(std::f64::consts::TAU) - normalized).abs() <= 1e-10)\n    }) {\n        return;\n    }\n    out.push(placement)'''
          if old not in s:
              raise SystemExit('add_unique_placement block not found')
          s = s.replace(old, new, 1)

          old = '''        if assigned.iter().all(Option::is_some) {\n            return external_constraints_satisfied(base, assigned, external, c);\n        }'''
          new = '''        if assigned.iter().all(Option::is_some) {\n            return true;\n        }'''
          if old not in s:
              raise SystemExit('search base case not found')
          s = s.replace(old, new, 1)

          old = '''            if !valid || !partial_configuration_valid(&trial, m, &ti, c) {\n                continue;\n            }\n            placements[part] = Some(candidate);\n            assigned[part] = ti[part];'''
          new = '''            if !valid || !partial_configuration_valid(&trial, m, &ti, c) {\n                continue;\n            }\n            placements[part] = Some(candidate);\n            assigned[part] = ti[part];\n            if assigned.iter().all(Option::is_some)\n                && !external_constraints_satisfied(&trial, &ti, external, c)\n            {\n                assigned[part] = None;\n                placements[part] = None;\n                continue;\n            }'''
          if old not in s:
              raise SystemExit('candidate completion block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/construction_realization.rs
          git rm .github/workflows/one-time-construction-final-fix.yml
          git commit -m "Apply construction realization correction"
          git push
