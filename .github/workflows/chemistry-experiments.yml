name: Environmental Chemistry Experiments

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated independent random seeds (up to 25)."
        required: true
        default: "42,43,44,45,46"
        type: string
      duration_seconds:
        description: "Real simulation duration per seed, in seconds."
        required: true
        default: 300
        type: number
      diagnostic_interval:
        description: "Ticks between full inventory snapshots."
        required: true
        default: 100
        type: number
      profile_movement:
        description: "Record separate resonance-calculation and placement-validation timings."
        required: true
        default: false
        type: boolean
      profile_tick:
        description: "Record sampled whole-tick phase timings (one tick in ten)."
        required: true
        default: false
        type: boolean
      deep_diagnostics:
        description: "Opt in to exhaustive local-resonance and detailed contact diagnostics; temporary only."
        required: true
        default: false
        type: boolean
      experiment_id:
        description: "Registered experiment ID (for example EXP-2026-007)."
        required: false
        default: ""
        type: string
      research_plan:
        description: "Research plan ID, if this run supports a registered plan."
        required: false
        default: ""
        type: string
      condition_id:
        description: "Condition identifier within the registered experiment."
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - experiments/chemistry-run.json

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.parameters.outputs.should_run }}
      seeds: ${{ steps.parameters.outputs.seeds }}
      duration_seconds: ${{ steps.parameters.outputs.duration_seconds }}
      diagnostic_interval: ${{ steps.parameters.outputs.diagnostic_interval }}
      profile_movement: ${{ steps.parameters.outputs.profile_movement }}
      profile_tick: ${{ steps.parameters.outputs.profile_tick }}
      deep_diagnostics: ${{ steps.parameters.outputs.deep_diagnostics }}
      experiment_id: ${{ steps.parameters.outputs.experiment_id }}
      research_plan: ${{ steps.parameters.outputs.research_plan }}
      condition_id: ${{ steps.parameters.outputs.condition_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate experiment parameters
        id: parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_INPUT: ${{ github.ref }}
          SEEDS_INPUT: ${{ inputs.seeds }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          DIAGNOSTIC_INTERVAL: ${{ inputs.diagnostic_interval }}
          PROFILE_MOVEMENT_INPUT: ${{ inputs.profile_movement }}
          PROFILE_TICK_INPUT: ${{ inputs.profile_tick }}
          DEEP_DIAGNOSTICS_INPUT: ${{ inputs.deep_diagnostics }}
          EXPERIMENT_ID_INPUT: ${{ inputs.experiment_id }}
          RESEARCH_PLAN_INPUT: ${{ inputs.research_plan }}
          CONDITION_ID_INPUT: ${{ inputs.condition_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          if os.environ["GITHUB_REF_INPUT"] != "refs/heads/main":
              raise SystemExit("Environmental experiment runs must be dispatched from main.")

          if os.environ["EVENT_NAME"] == "push":
              with open("experiments/chemistry-run.json", encoding="utf-8") as source:
                  config = json.load(source)
              if config.get("run") is not True:
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("should_run=false" + chr(10))
                  print("Experiment request is inactive; no simulations launched.")
                  raise SystemExit(0)
              seeds = config.get("seeds", [])
              duration = int(config.get("duration_seconds", 300))
              interval = int(config.get("diagnostic_interval", 100))
              profile_movement = bool(config.get("profile_movement", False))
              profile_tick = bool(config.get("profile_tick", False))
              deep_diagnostics = bool(config.get("deep_diagnostics", False))
              experiment_id = str(config.get("experiment_id") or "").strip()
              research_plan = str(config.get("research_plan") or "").strip()
              condition_id = str(config.get("condition_id") or "").strip()
          else:
              raw = os.environ["SEEDS_INPUT"]
              parts = [part.strip() for part in raw.split(",") if part.strip()]
              if any(not part.isascii() or not part.isdecimal() for part in parts):
                  raise SystemExit("Every seed must be a nonnegative integer.")
              seeds = [int(part) for part in parts]
              duration = int(os.environ["DURATION_SECONDS"])
              interval = int(os.environ["DIAGNOSTIC_INTERVAL"])
              profile_movement = os.environ["PROFILE_MOVEMENT_INPUT"].lower() == "true"
              profile_tick = os.environ["PROFILE_TICK_INPUT"].lower() == "true"
              deep_diagnostics = os.environ["DEEP_DIAGNOSTICS_INPUT"].lower() == "true"
              experiment_id = os.environ.get("EXPERIMENT_ID_INPUT", "").strip()
              research_plan = os.environ.get("RESEARCH_PLAN_INPUT", "").strip()
              condition_id = os.environ.get("CONDITION_ID_INPUT", "").strip()

          if experiment_id and not re.fullmatch(r"EXP-\d{4}-\d{3}", experiment_id):
              raise SystemExit("Experiment ID must match EXP-YYYY-NNN.")
          if research_plan and not re.fullmatch(r"(?:PLAN|OBS)-\d{3}", research_plan):
              raise SystemExit("Research plan must match PLAN-NNN or OBS-NNN.")
          if condition_id and not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", condition_id):
              raise SystemExit("Condition ID may contain only letters, numbers, dots, underscores, and hyphens.")
          if not experiment_id or not condition_id:
              raise SystemExit("Permanent experiment records require a registered experiment_id and condition_id.")
          with open("experiments/records/registry.md", encoding="utf-8") as registry_file:
              registered_experiments = {
                  line.split("|", 2)[1].strip()
                  for line in registry_file
                  if line.startswith("|") and line.count("|") >= 2
              }
          if experiment_id not in registered_experiments:
              raise SystemExit(f"Experiment {experiment_id} must be registered in experiments/records/registry.md before execution.")

          if not isinstance(seeds, list) or not seeds or len(seeds) > 25:
              raise SystemExit("Provide between 1 and 25 independent seeds.")
          if any(not isinstance(seed, int) or isinstance(seed, bool) or seed < 0 for seed in seeds):
              raise SystemExit("Every seed must be a nonnegative integer.")
          if len(seeds) != len(set(seeds)):
              raise SystemExit("Seeds must be unique.")
          if not 30 <= duration <= 3600:
              raise SystemExit("Duration must be between 30 and 3,600 seconds.")
          if not 1 <= interval <= 100000:
              raise SystemExit("Diagnostic interval must be between 1 and 100,000 ticks.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("should_run=true" + chr(10))
              output.write("seeds=" + json.dumps(seeds) + chr(10))
              output.write("duration_seconds=" + str(duration) + chr(10))
              output.write("diagnostic_interval=" + str(interval) + chr(10))
              output.write("profile_movement=" + str(profile_movement).lower() + chr(10))
              output.write("profile_tick=" + str(profile_tick).lower() + chr(10))
              output.write("deep_diagnostics=" + str(deep_diagnostics).lower() + chr(10))
              output.write("experiment_id=" + experiment_id + chr(10))
              output.write("research_plan=" + research_plan + chr(10))
              output.write("condition_id=" + condition_id + chr(10))
          print(f"Experiment metadata: experiment={experiment_id or 'unspecified'}, plan={research_plan or 'unspecified'}, condition={condition_id or 'unspecified'}")
          print(f"Validated {len(seeds)} seeds: {seeds}")
          print(f"Duration per seed: {duration}s; diagnostic interval: {interval} ticks")
          PY

  observe:
    if: needs.prepare.outputs.should_run == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: ${{ fromJSON(needs.prepare.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run standard six-element environmental chemistry observation
        timeout-minutes: 110
        env:
          SEED: ${{ matrix.seed }}
          DURATION_SECONDS: ${{ needs.prepare.outputs.duration_seconds }}
          DIAGNOSTIC_INTERVAL: ${{ needs.prepare.outputs.diagnostic_interval }}
          DEEP_DIAGNOSTICS: ${{ needs.prepare.outputs.deep_diagnostics }}
          EVOSIM_PROFILE_MOVEMENT: ${{ needs.prepare.outputs.profile_movement }}
          EVOSIM_PROFILE_TICK: ${{ needs.prepare.outputs.profile_tick }}
          EVOSIM_EXPERIMENT_ID: ${{ needs.prepare.outputs.experiment_id }}
          EVOSIM_RESEARCH_PLAN: ${{ needs.prepare.outputs.research_plan }}
          EVOSIM_CONDITION_ID: ${{ needs.prepare.outputs.condition_id }}
        run: |
          set -euo pipefail
          mkdir -p observations
          EXTRA_ARGS=()
          if [[ "$DEEP_DIAGNOSTICS" == "true" ]]; then
            EXTRA_ARGS+=(--deep-diagnostics)
          fi
          cargo run --locked -- --headless --environment-chemistry-experiment --seconds "$DURATION_SECONDS" --seed "$SEED" --diagnostics "observations/seed-$SEED.jsonl" --diagnostic-interval "$DIAGNOSTIC_INTERVAL" "${EXTRA_ARGS[@]}"
      - name: Upload temporary raw observations for consolidation
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-raw-seed-${{ matrix.seed }}
          path: observations/
          if-no-files-found: error
          retention-days: 1
      - name: Clean local raw diagnostic workspace
        if: always()
        run: rm -rf observations
  aggregate:
    if: needs.prepare.outputs.should_run == 'true'
    needs: [prepare, observe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Download short-lived raw observations
        uses: actions/download-artifact@v4
        with:
          pattern: chemistry-raw-seed-*
          path: observations
          merge-multiple: true
      - name: Run unified offline analysis and build temporary seed summaries
        env:
          SEEDS_JSON: ${{ needs.prepare.outputs.seeds }}
          DURATION_SECONDS: ${{ needs.prepare.outputs.duration_seconds }}
          DEEP_DIAGNOSTICS: ${{ needs.prepare.outputs.deep_diagnostics }}
        run: |
          set -euo pipefail
          SEEDS=$(python3 -c 'import json,os; print(",".join(map(str,json.loads(os.environ["SEEDS_JSON"]))))')
          EXTRA_ARGS=()
          if [[ "$DEEP_DIAGNOSTICS" == "true" ]]; then
            EXTRA_ARGS+=(--deep-analysis)
          fi
          python3 tools/unified_chemistry_analysis.py observations --seeds "$SEEDS" --duration-seconds "$DURATION_SECONDS" --output-dir work/unified "${EXTRA_ARGS[@]}"
          python3 tools/contact_opportunity_analyzer.py observations --seeds "$SEEDS" --duration-seconds "$DURATION_SECONDS" --output-dir work/coverage --summary-only
          mkdir -p work/temporary-seed-records
          for SEED in ${SEEDS//,/ }; do
            python3 tools/compact_experiment_record.py \
              --seed "$SEED" \
              --chemistry "work/unified/per-seed/seed-$SEED-chemistry.json" \
              --organization "work/unified/per-seed/seed-$SEED-organization.json" \
              --manifest "observations/seed-$SEED.jsonl.manifest.json" \
              --opportunity-coverage work/coverage/contact-opportunity-analysis.json \
              --output "work/temporary-seed-records/seed-$SEED-record.json"
          done
      - name: Finalize exactly two permanent experiment files
        env:
          SEEDS_JSON: ${{ needs.prepare.outputs.seeds }}
          EXPERIMENT_ID: ${{ needs.prepare.outputs.experiment_id }}
          CONDITION_ID: ${{ needs.prepare.outputs.condition_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Permanent experiment publication is restricted to main." >&2; exit 1; }
          [[ "$EXPERIMENT_ID" =~ ^EXP-[0-9]{4}-[0-9]{3}$ ]] || { echo "A registered EXP-YYYY-NNN identifier is required for permanent publication." >&2; exit 1; }
          [[ "$CONDITION_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "A valid condition_id is required for permanent publication." >&2; exit 1; }
          SEEDS=$(python3 -c 'import json,os; print(",".join(map(str,json.loads(os.environ["SEEDS_JSON"]))))')
          python3 tools/finalize_experiment_records.py \
            --records work/temporary-seed-records/seed-*-record.json \
            --expected-seeds "$SEEDS" \
            --analysis-index work/unified/unified-analysis-index.json \
            --setup-out work/final/experiment-setup.json \
            --report-out work/final/consolidated-report.json
          DEST="experiments/records/results/$EXPERIMENT_ID-$CONDITION_ID"
          export DEST
          [[ ! -e "$DEST" ]] || { echo "Refusing to overwrite an existing permanent experiment record: $DEST" >&2; exit 1; }
          mkdir -p "$DEST"
          cp work/final/experiment-setup.json "$DEST/setup.json"
          cp work/final/consolidated-report.json "$DEST/consolidated-report.json"
          python3 - <<'PY'
          import os
          from pathlib import Path

          experiment_id = os.environ["EXPERIMENT_ID"]
          condition_id = os.environ["CONDITION_ID"]
          destination = Path(os.environ["DEST"])
          registry_path = Path("experiments/records/registry.md")
          lines = registry_path.read_text(encoding="utf-8").splitlines()
          matches = []
          for index, line in enumerate(lines):
              if not line.startswith("|"):
                  continue
              columns = [column.strip() for column in line.strip().strip("|").split("|")]
              if columns and columns[0] == experiment_id:
                  matches.append((index, columns))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one registry row for {experiment_id}; found {len(matches)}.")
          index, columns = matches[0]
          if len(columns) != 5:
              raise SystemExit(f"Unexpected registry schema for {experiment_id}; expected five columns.")
          setup_link = f"[{condition_id} setup]({destination.as_posix()}/setup.json)"
          report_link = f"[{condition_id} report]({destination.as_posix()}/consolidated-report.json)"
          links = f"{setup_link} · {report_link}"
          if links not in columns[4]:
              columns[4] = f"{columns[4]}; {links}" if columns[4] else links
          columns[3] = f"Results recorded: {condition_id}"
          lines[index] = "| " + " | ".join(columns) + " |"
          registry_path.write_text("\\n".join(lines) + "\\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST/setup.json" "$DEST/consolidated-report.json" experiments/records/registry.md
          git commit -m "Record $EXPERIMENT_ID $CONDITION_ID experiment results"
          git push origin "HEAD:main"
      - name: Delete temporary raw and compact-record artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("chemistry-raw-seed-")) | .id')
          while IFS= read -r ID; do
            [[ -n "$ID" ]] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID"
          done <<< "$IDS"
          rm -rf observations work
