name: Environmental Chemistry Experiments

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated independent random seeds (up to 25)."
        required: true
        default: "42,43,44,45,46"
        type: string
      duration_seconds:
        description: "Real simulation duration per seed, in seconds."
        required: true
        default: 1500
        type: number
      diagnostic_interval:
        description: "Ticks between full inventory snapshots."
        required: true
        default: 100
        type: number
  push:
    branches: [main]
    paths:
      - experiments/chemistry-run.json

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.parameters.outputs.should_run }}
      seeds: ${{ steps.parameters.outputs.seeds }}
      duration_seconds: ${{ steps.parameters.outputs.duration_seconds }}
      diagnostic_interval: ${{ steps.parameters.outputs.diagnostic_interval }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate experiment parameters
        id: parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          SEEDS_INPUT: ${{ inputs.seeds }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          DIAGNOSTIC_INTERVAL: ${{ inputs.diagnostic_interval }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          if os.environ["EVENT_NAME"] == "push":
              with open("experiments/chemistry-run.json", encoding="utf-8") as source:
                  config = json.load(source)
              if config.get("run") is not True:
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("should_run=false" + chr(10))
                  print("Experiment request is inactive; no simulations launched.")
                  raise SystemExit(0)
              seeds = config.get("seeds", [])
              duration = int(config.get("duration_seconds", 300))
              interval = int(config.get("diagnostic_interval", 100))
          else:
              raw = os.environ["SEEDS_INPUT"]
              parts = [part.strip() for part in raw.split(",") if part.strip()]
              if any(not part.isascii() or not part.isdecimal() for part in parts):
                  raise SystemExit("Every seed must be a nonnegative integer.")
              seeds = [int(part) for part in parts]
              duration = int(os.environ["DURATION_SECONDS"])
              interval = int(os.environ["DIAGNOSTIC_INTERVAL"])

          if not isinstance(seeds, list) or not seeds or len(seeds) > 25:
              raise SystemExit("Provide between 1 and 25 independent seeds.")
          if any(not isinstance(seed, int) or isinstance(seed, bool) or seed < 0 for seed in seeds):
              raise SystemExit("Every seed must be a nonnegative integer.")
          if len(seeds) != len(set(seeds)):
              raise SystemExit("Seeds must be unique.")
          if not 30 <= duration <= 3600:
              raise SystemExit("Duration must be between 30 and 3,600 seconds.")
          if not 1 <= interval <= 100000:
              raise SystemExit("Diagnostic interval must be between 1 and 100,000 ticks.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("should_run=true" + chr(10))
              output.write("seeds=" + json.dumps(seeds) + chr(10))
              output.write("duration_seconds=" + str(duration) + chr(10))
              output.write("diagnostic_interval=" + str(interval) + chr(10))
          print(f"Validated {len(seeds)} seeds: {seeds}")
          print(f"Duration per seed: {duration}s; diagnostic interval: {interval} ticks")
          PY

  observe:
    if: needs.prepare.outputs.should_run == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: ${{ fromJSON(needs.prepare.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run standard six-element environmental chemistry observation
        timeout-minutes: 110
        env:
          SEED: ${{ matrix.seed }}
          DURATION_SECONDS: ${{ needs.prepare.outputs.duration_seconds }}
          DIAGNOSTIC_INTERVAL: ${{ needs.prepare.outputs.diagnostic_interval }}
        run: |
          set -euo pipefail
          mkdir -p observations
          cargo run --locked -- --headless --environment-chemistry-experiment --seconds "$DURATION_SECONDS" --seed "$SEED" --diagnostics "observations/seed-$SEED.jsonl" --diagnostic-interval "$DIAGNOSTIC_INTERVAL"
      - name: Analyze reactions and energy
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python3 tools/chemistry_analyzer.py "observations/seed-$SEED.jsonl" --json-out "observations/seed-$SEED-chemistry.json" --markdown-out "observations/seed-$SEED-chemistry.md"
      - name: Analyze molecular organization and lineage
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python3 tools/chemistry_organization_analyzer.py "observations/seed-$SEED.jsonl" --json-out "observations/seed-$SEED-organization.json" --markdown-out "observations/seed-$SEED-organization.md"
      - name: Upload raw observation and per-seed analysis
        if: always() && hashFiles('observations/seed-*.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-observation-seed-${{ matrix.seed }}
          path: observations/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: needs.prepare.outputs.should_run == 'true'
    needs: [prepare, observe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all per-seed observations
        uses: actions/download-artifact@v4
        with:
          pattern: chemistry-observation-seed-*
          path: observations
          merge-multiple: true
      - name: Build pooled chemistry and molecular-development report
        env:
          SEEDS: ${{ join(fromJSON(needs.prepare.outputs.seeds), ',') }}
          DURATION_SECONDS: ${{ needs.prepare.outputs.duration_seconds }}
        run: |
          set -euo pipefail
          python3 tools/chemistry_experiment_batch_analyzer.py observations --seeds "$SEEDS" --duration-seconds "$DURATION_SECONDS" --json-out chemistry-experiment-combined.json --markdown-out chemistry-experiment-combined.md
          python3 tools/reaction_network_analyzer.py observations --seeds "$SEEDS" --duration-seconds "$DURATION_SECONDS" --output-dir reaction-network
          python3 tools/geometry_aware_reaction_network.py observations --seeds "$SEEDS" --duration-seconds "$DURATION_SECONDS" --output-dir geometry-aware-network
          python3 tools/contact_opportunity_analyzer.py observations --seeds "$SEEDS" --duration-seconds "$DURATION_SECONDS" --output-dir contact-opportunities
      - name: Upload combined experiment report
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-experiment-combined
          path: |
            chemistry-experiment-combined.json
            chemistry-experiment-combined.md
            reaction-network/
            geometry-aware-network/
            contact-opportunities/
          if-no-files-found: error
          retention-days: 90
