name: Environmental Chemistry Experiments

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated independent random seeds (up to 25)."
        required: true
        default: "42,43,44,45,46"
        type: string
      duration_seconds:
        description: "Real simulation duration per seed, in seconds."
        required: true
        default: 300
        type: number
      diagnostic_interval:
        description: "Ticks between full inventory snapshots."
        required: true
        default: 100
        type: number

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.parameters.outputs.seeds }}
    steps:
      - name: Validate experiment parameters
        id: parameters
        env:
          SEEDS_INPUT: ${{ inputs.seeds }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          DIAGNOSTIC_INTERVAL: ${{ inputs.diagnostic_interval }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          raw = os.environ["SEEDS_INPUT"]
          parts = [part.strip() for part in raw.split(",") if part.strip()]
          if not parts or len(parts) > 25:
              raise SystemExit("Provide between 1 and 25 comma-separated seeds.")
          if any(not re.fullmatch(r"\\d+", part) for part in parts):
              raise SystemExit("Every seed must be a nonnegative integer.")
          seeds = [int(part) for part in parts]
          if len(seeds) != len(set(seeds)):
              raise SystemExit("Seeds must be unique.")
          duration = int(os.environ["DURATION_SECONDS"])
          interval = int(os.environ["DIAGNOSTIC_INTERVAL"])
          if not 30 <= duration <= 3600:
              raise SystemExit("Duration must be between 30 and 3,600 seconds.")
          if not 1 <= interval <= 100000:
              raise SystemExit("Diagnostic interval must be between 1 and 100,000 ticks.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("seeds=" + json.dumps(seeds) + "\\n")
          print(f"Validated {len(seeds)} seeds: {seeds}")
          print(f"Duration per seed: {duration}s; diagnostic interval: {interval} ticks")
          PY

  observe:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: ${{ fromJSON(needs.prepare.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run standard six-element environmental chemistry observation
        timeout-minutes: 110
        env:
          SEED: ${{ matrix.seed }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          DIAGNOSTIC_INTERVAL: ${{ inputs.diagnostic_interval }}
        run: |
          set -euo pipefail
          mkdir -p observations
          cargo run --locked -- \\
            --headless \\
            --environment-chemistry-experiment \\
            --seconds "$DURATION_SECONDS" \\
            --seed "$SEED" \\
            --diagnostics "observations/seed-$SEED.jsonl" \\
            --diagnostic-interval "$DIAGNOSTIC_INTERVAL"
      - name: Analyze reactions and energy
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python3 tools/chemistry_analyzer.py "observations/seed-$SEED.jsonl" \\
            --json-out "observations/seed-$SEED-chemistry.json" \\
            --markdown-out "observations/seed-$SEED-chemistry.md"
      - name: Analyze molecular organization and lineage
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python3 tools/chemistry_organization_analyzer.py "observations/seed-$SEED.jsonl" \\
            --json-out "observations/seed-$SEED-organization.json" \\
            --markdown-out "observations/seed-$SEED-organization.md"
      - name: Upload raw observation and per-seed analysis
        if: always() && hashFiles('observations/seed-*.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-observation-seed-${{ matrix.seed }}
          path: observations/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [prepare, observe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all per-seed observations
        uses: actions/download-artifact@v4
        with:
          pattern: chemistry-observation-seed-*
          path: observations
          merge-multiple: true
      - name: Build pooled chemistry and molecular-development report
        env:
          SEEDS: ${{ inputs.seeds }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          set -euo pipefail
          python3 tools/chemistry_experiment_batch_analyzer.py observations \\
            --seeds "$SEEDS" \\
            --duration-seconds "$DURATION_SECONDS" \\
            --json-out chemistry-experiment-combined.json \\
            --markdown-out chemistry-experiment-combined.md
      - name: Upload combined experiment report
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-experiment-combined
          path: |
            chemistry-experiment-combined.json
            chemistry-experiment-combined.md
          if-no-files-found: error
          retention-days: 90
