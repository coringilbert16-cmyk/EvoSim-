name: Environmental broad-phase benchmark

on:
  push:
    branches: [chemistry/shared-interaction-records-stage1]

permissions:
  contents: read

jobs:
  equal-tick-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: 1761a3be04635af828038ba93d9340f153511a2c
      PR_SHA: ${{ github.sha }}
      TICKS: 1800
      SEED: 42
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build baseline and optimized revisions
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-baseline" cargo build --release --locked
          git checkout --detach "$PR_SHA"
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-optimized" cargo build --release --locked

      - name: Run paired equal-tick measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          baseline="$RUNNER_TEMP/target-baseline/release/evosim"
          optimized="$RUNNER_TEMP/target-optimized/release/evosim"

          run_case() {
            local label="$1"
            local binary="$2"
            local output="benchmark-results/${label}.log"
            local diagnostics="benchmark-results/${label}.jsonl"
            echo "RUN label=$label revision=$([ "$binary" = "$baseline" ] && echo baseline || echo optimized) seed=$SEED ticks=$TICKS"
            "$binary" --headless --environment-chemistry-experiment \
              --ticks "$TICKS" --seed "$SEED" \
              --diagnostics "$diagnostics" --diagnostic-interval "$TICKS" \
              > "$output"
            grep "ENVIRONMENTAL CHEMISTRY END:" "$output"
          }

          # Alternate order to reduce systematic warm-up or runner-load bias.
          run_case baseline-1 "$baseline"
          run_case optimized-1 "$optimized"
          run_case optimized-2 "$optimized"
          run_case baseline-2 "$baseline"
          run_case baseline-3 "$baseline"
          run_case optimized-3 "$optimized"

          python3 - <<'PY'
          import re
          from pathlib import Path
          import statistics

          groups = {"baseline": [], "optimized": []}
          for path in sorted(Path("benchmark-results").glob("*.log")):
              match = re.search(r"tick=(\d+) elapsed_wall_seconds=([0-9.]+)", path.read_text())
              if not match:
                  raise SystemExit(f"Missing final tick/time in {path}")
              ticks, seconds = int(match.group(1)), float(match.group(2))
              if ticks != 1800:
                  raise SystemExit(f"{path} completed {ticks} ticks, expected 1800")
              group = "baseline" if path.name.startswith("baseline") else "optimized"
              groups[group].append(seconds)

          for name, values in groups.items():
              if len(values) != 3:
                  raise SystemExit(f"Expected 3 {name} samples, got {len(values)}")
              print(f"{name}: samples_seconds={values} median_seconds={statistics.median(values):.3f}")

          old = statistics.median(groups["baseline"])
          new = statistics.median(groups["optimized"])
          delta = (new / old - 1.0) * 100.0
          speedup = old / new
          print(f"RESULT equal_ticks=1800 seed=42 baseline_median_s={old:.3f} optimized_median_s={new:.3f} time_change_percent={delta:+.2f}% speedup={speedup:.4f}x")
          PY

      - name: Upload benchmark logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environmental-broad-phase-equal-tick-benchmark
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
