name: PR 288 Sequential Regression Experiments

on:
  push:
    branches:
      - bench/pr288-sequential-regressions

permissions:
  contents: read

concurrency:
  group: pr288-sequential-regressions
  cancel-in-progress: true

jobs:
  sequential-regressions:
    name: Sequential cache and chemistry regression groups
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated PR 288 candidate
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: 1. Cache identity, fingerprint invalidation, and persistence
        run: cargo test --locked chemistry::chemistry_library::tests:: -- --test-threads=1

      - name: 2. COMBINE discovery and live physical eligibility
        run: cargo test --locked chemistry::environmental_combine::tests:: -- --test-threads=1

      - name: 3. BREAK discovery, scheduling, and transaction regressions
        run: cargo test --locked chemistry::chemical_reaction::tests:: -- --test-threads=1

      - name: 4. Full Rust regression suite
        run: cargo test --locked
