name: phase3-storage-authority
on:
  push:
    branches: [phase3-physical-structure-authority]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove logical-to-physical fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/material_storage.rs')
          text = p.read_text()
          old = '''    pub(crate) fn peek_matching_physical(&self, target: &Material) -> Option<PhysicalMaterial> {\n        let entry = self\n            .entries\n            .iter()\n            .find(|entry| entry.material() == target && !entry.material().is_empty())?;\n        entry\n            .physical()\n            .or_else(|| Some(PhysicalMaterial::logical(target.clone())))\n    }'''
          new = '''    pub(crate) fn peek_matching_physical(&self, target: &Material) -> Option<PhysicalMaterial> {\n        self.entries.iter().find_map(|entry| match entry {\n            StoredMaterial::Physical(instance)\n                if instance.material == *target && !instance.material.is_empty() =>\n            {\n                Some(instance.clone())\n            }\n            _ => None,\n        })\n    }'''
          if old not in text:
              raise SystemExit('peek_matching_physical block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('src/material_storage.rs')
          text = p.read_text()
          old = '''    pub(crate) fn take_matching_physical(&mut self, target: &Material) -> Option<PhysicalMaterial> {\n        let index = self\n            .entries\n            .iter()\n            .position(|entry| entry.material() == target && !entry.material().is_empty())?;\n        match self.entries.swap_remove(index) {\n            StoredMaterial::Physical(instance) => Some(instance),\n            StoredMaterial::Logical(material) => Some(PhysicalMaterial::logical(material)),\n        }\n    }'''
          new = '''    pub(crate) fn take_matching_physical(&mut self, target: &Material) -> Option<PhysicalMaterial> {\n        let index = self.entries.iter().position(|entry| {\n            matches!(entry, StoredMaterial::Physical(instance)\n                if instance.material == *target && !instance.material.is_empty())\n        })?;\n        match self.entries.swap_remove(index) {\n            StoredMaterial::Physical(instance) => Some(instance),\n            StoredMaterial::Logical(_) => None,\n        }\n    }'''
          if old not in text:
              raise SystemExit('take_matching_physical block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test --all-targets
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 3: require realized physical storage for physical access'
          git push
