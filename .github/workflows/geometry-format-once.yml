name: Geometry format once

on:
  push:
    branches: [geometry-authority-completion-4]

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'coringilbert16-cmyk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format geometry authority migration"
          git push
