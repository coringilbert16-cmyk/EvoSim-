name: Harmonic Aura CI

on:
  push:
    branches:
      - harmonic-aura-model
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo check --all-targets
      - run: cargo test --all-targets
