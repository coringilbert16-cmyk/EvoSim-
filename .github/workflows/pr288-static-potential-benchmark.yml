name: PR 288 Static Potential Same-Runner Benchmark

on:
  push:
    branches:
      - bench/pr288-static-potential-candidate

concurrency:
  group: pr288-static-potential-same-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Alternating baseline and candidate release runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Prepare exact baseline and candidate revisions
        shell: bash
        env:
          BASE_SHA: 7b3ff2f6ca5956e34c1ce035054bffbceb42659d
          CANDIDATE_SHA: 1d412c84ebff0371ed223fa21b49e09887be1e92
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" "$CANDIDATE_SHA"
          git worktree add /tmp/pr288-baseline "$BASE_SHA"
          git worktree add /tmp/pr288-candidate "$CANDIDATE_SHA"
          (cd /tmp/pr288-baseline && cargo build --release)
          (cd /tmp/pr288-candidate && cargo build --release)
      - name: Run alternating matched experiments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr288-matched
          : > /tmp/pr288-matched/timings.tsv
          declare -A counts
          counts[baseline]=0
          counts[candidate]=0
          sequence=(baseline candidate candidate baseline baseline candidate)
          for variant in "${sequence[@]}"; do
            counts[$variant]=$((counts[$variant] + 1))
            iteration="${counts[$variant]}"
            if [ "$variant" = baseline ]; then
              workdir="/tmp/pr288-baseline"
            else
              workdir="/tmp/pr288-candidate"
            fi
            binary="$workdir/target/release/evosim"
            output="/tmp/pr288-matched/${variant}-${iteration}.jsonl"
            start_ns=$(date +%s%N)
            (cd "$workdir" && "$binary" --headless \
              --environment-chemistry-experiment \
              --seed 42 \
              --duration-seconds 180 \
              --diagnostic-interval 100 \
              --diagnostics "$output")
            end_ns=$(date +%s%N)
            elapsed=$(awk -v start="$start_ns" -v end="$end_ns" 'BEGIN { printf "%.6f", (end-start)/1000000000 }')
            ticks=$(grep -o '"ticks_observed":[0-9]*' "$output" | tail -1 | cut -d: -f2)
            awk -v v="$variant" -v i="$iteration" -v t="$ticks" -v e="$elapsed" 'BEGIN { printf "%s\t%d\t%d\t%s\t%.3f\n", v, i, t, e, t/e }' | tee -a /tmp/pr288-matched/timings.tsv
            grep '"event":"environmental_chemistry_summary"' "$output" | tee -a /tmp/pr288-matched/summaries.jsonl
          done
          echo "=== MEDIAN THROUGHPUT BY REVISION ==="
          python3 - <<'PY'
          import statistics
          rows = {}
          with open("/tmp/pr288-matched/timings.tsv", encoding="utf-8") as source:
              for line in source:
                  variant, iteration, ticks, elapsed, rate = line.split()
                  rows.setdefault(variant, []).append(float(rate))
          for variant, rates in sorted(rows.items()):
              print(f"{variant}: runs={len(rates)} rates={rates} median_ticks_per_second={statistics.median(rates):.3f}")
          baseline = statistics.median(rows["baseline"])
          candidate = statistics.median(rows["candidate"])
          print(f"candidate_vs_baseline_percent={(candidate / baseline - 1.0) * 100.0:.2f}%")
          PY
          echo "=== RAW TIMINGS ==="
          cat /tmp/pr288-matched/timings.tsv
      - name: Upload matched benchmark data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr288-same-runner-matched-benchmark
          path: /tmp/pr288-matched/
          if-no-files-found: warn
