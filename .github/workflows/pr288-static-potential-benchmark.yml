name: PR 288 Cache Metrics Wall-Clock Benchmark

on:
  push:
    branches:
      - bench/pr288-wall-clock-break-samples

concurrency:
  group: pr288-cache-metrics-wall-clock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Three 60-second samples per revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Prepare exact validated revisions
        shell: bash
        env:
          BASE_SHA: 5001a505a8654f672f47520109626c081e9e0b47
          CANDIDATE_SHA: 49a94bacf13b4d147a9dba37819ebc0ac4eeaab8
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" "$CANDIDATE_SHA"
          git worktree add /tmp/pr288-baseline "$BASE_SHA"
          git worktree add /tmp/pr288-candidate "$CANDIDATE_SHA"
          (cd /tmp/pr288-baseline && cargo build --release)
          (cd /tmp/pr288-candidate && cargo build --release)
          for variant in baseline candidate; do
            mkdir -p "/tmp/pr288-seed-$variant"
            cp -a "/tmp/pr288-$variant/chemistry_library/data" "/tmp/pr288-seed-$variant/data"
          done
      - name: Run three alternating 60-second samples per revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr288-cache-metrics
          : > /tmp/pr288-cache-metrics/samples.tsv
          : > /tmp/pr288-cache-metrics/metrics.tsv
          : > /tmp/pr288-cache-metrics/summaries.jsonl
          sequence=(baseline candidate candidate baseline baseline candidate)
          for index in "${!sequence[@]}"; do
            variant="${sequence[$index]}"
            sample=$((index / 2 + 1))
            workdir="/tmp/pr288-$variant"
            binary="$workdir/target/release/evosim"
            output="/tmp/pr288-cache-metrics/${variant}-${sample}.jsonl"
            log="/tmp/pr288-cache-metrics/${variant}-${sample}.log"
            rm -rf "$workdir/chemistry_library/data"
            mkdir -p "$workdir/chemistry_library"
            cp -a "/tmp/pr288-seed-$variant/data" "$workdir/chemistry_library/data"
            start=$(date +%s%N)
            (cd "$workdir" && EVOSIM_CHEMISTRY_CACHE_METRICS=1 "$binary" --headless \
              --environment-chemistry-experiment --seed 42 --ticks 18446744073709551615 --seconds 60 \
              --diagnostic-interval 1000 --diagnostics "$output" > "$log" 2>&1)
            end=$(date +%s%N)
            wall_seconds=$(awk -v a="$start" -v b="$end" 'BEGIN { printf "%.6f", (b-a)/1000000000 }')
            summary=$(grep 'ENVIRONMENTAL CHEMISTRY END:' "$log" | tail -1)
            ticks=$(printf '%s\n' "$summary" | sed -n 's/.*tick=\([0-9]*\).*/\1/p')
            elapsed=$(printf '%s\n' "$summary" | sed -n 's/.*elapsed_seconds=\([0-9.]*\).*/\1/p')
            rate=$(printf '%s\n' "$summary" | sed -n 's/.*ticks_per_second=\([0-9.]*\).*/\1/p')
            test -n "$ticks" && test -n "$elapsed" && test -n "$rate"
            awk -v elapsed="$elapsed" 'BEGIN { exit !(elapsed >= 59.0 && elapsed <= 62.0) }'
            printf "%s\t%d\t%s\t%s\t%s\t%s\n" "$variant" "$sample" "$ticks" "$elapsed" "$wall_seconds" "$rate" | tee -a /tmp/pr288-cache-metrics/samples.tsv
            grep '"event":"environmental_chemistry_summary"' "$output" >> /tmp/pr288-cache-metrics/summaries.jsonl
            grep '^CHEMISTRY_CACHE_METRICS ' "$log" | sed "s/^CHEMISTRY_CACHE_METRICS /$variant\t$sample\t/" >> /tmp/pr288-cache-metrics/metrics.tsv
          done
          echo "=== THROUGHPUT MEDIANS ==="
          python3 - <<'PY'
          import statistics
          rows = {}
          with open("/tmp/pr288-cache-metrics/samples.tsv", encoding="utf-8") as source:
              for line in source:
                  variant, sample, ticks, elapsed, wall, rate = line.split()
                  rows.setdefault(variant, []).append(float(rate))
          for variant, rates in sorted(rows.items()):
              print(f"{variant}: samples={len(rates)} rates={rates} median_ticks_per_second={statistics.median(rates):.3f}")
          baseline = statistics.median(rows["baseline"])
          candidate = statistics.median(rows["candidate"])
          print(f"candidate_vs_baseline_percent={(candidate / baseline - 1.0) * 100.0:.2f}%")
          assert len(rows["baseline"]) == 3 and len(rows["candidate"]) == 3
          PY
          echo "=== CACHE METRICS TOTALS ==="
          python3 - <<'PY'
          import json
          from collections import defaultdict
          totals = defaultdict(lambda: defaultdict(int))
          with open("/tmp/pr288-cache-metrics/metrics.tsv", encoding="utf-8") as source:
              for line in source:
                  variant, sample, payload = line.rstrip("\n").split("\t", 2)
                  data = json.loads(payload)
                  for key, value in data.items():
                      totals[variant][key] += value
          for variant in ("baseline", "candidate"):
              t = totals[variant]
              lookups = t["cache_hits"] + t["cache_misses"]
              hit_rate = 100.0 * t["cache_hits"] / lookups if lookups else 0.0
              avg_combine_ms = t["combine_discovery_ns"] / t["combine_discovery_calls"] / 1_000_000 if t["combine_discovery_calls"] else 0.0
              print(f"{variant}: lookups={lookups} hits={t['cache_hits']} misses={t['cache_misses']} hit_rate={hit_rate:.2f}% potential_calculations={t['potential_calculations']} combine_discovery_calls={t['combine_discovery_calls']} combine_discovery_total_ms={t['combine_discovery_ns']/1e6:.3f} avg_combine_discovery_ms={avg_combine_ms:.6f}")
          PY
          echo "=== BREAK/COMBINE SUMMARY ==="
          python3 - <<'PY'
          import json
          rows = [json.loads(line) for line in open("/tmp/pr288-cache-metrics/summaries.jsonl", encoding="utf-8") if line.strip()]
          for key in ("combine_committed", "combine_rejected", "break_committed", "break_rejected"):
              print(f"{key}={sum(row[key] for row in rows)}")
          print(f"summary_records={len(rows)}")
          PY
          echo "=== RAW SAMPLES ==="
          cat /tmp/pr288-cache-metrics/samples.tsv
          echo "=== RAW METRICS ==="
          cat /tmp/pr288-cache-metrics/metrics.tsv
      - name: Validate inventory and energy conservation
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math
          path = "/tmp/pr288-cache-metrics/summaries.jsonl"
          try:
              rows = [json.loads(line) for line in open(path, encoding="utf-8") if line.strip()]
          except FileNotFoundError:
              raise SystemExit("No experiment summaries were produced")
          if not rows:
              raise SystemExit("No experiment summaries were produced")
          expected = {"Carbon":15.0,"Hydrogen":16.0,"Nitrogen":24.0,"Oxygen":20.0,"Phosphorus":17.0,"Sulfur":19.0,"Water":17.0}
          for i, row in enumerate(rows, 1):
              assert isinstance(row.get("ticks_observed"), int) and row["ticks_observed"] > 0, (i, row.get("ticks_observed"))
              assert row.get("final_material_inventory") == expected, (i, row.get("final_material_inventory"))
              residual = row.get("energy_balance_residual")
              assert isinstance(residual, (int, float)) and math.isfinite(residual) and abs(residual) < 1e-4, (i, residual)
          print(f"Validated {len(rows)} timed samples: variable tick counts, exact material inventory, energy residual < 1e-4")
          print("Totals:", {
              "combine_committed": sum(r["combine_committed"] for r in rows),
              "combine_rejected": sum(r["combine_rejected"] for r in rows),
              "break_committed": sum(r["break_committed"] for r in rows),
              "break_rejected": sum(r["break_rejected"] for r in rows),
          })
          PY
      - name: Upload instrumented benchmark data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr288-cache-metrics-60-second-samples
          path: /tmp/pr288-cache-metrics/
          if-no-files-found: warn
