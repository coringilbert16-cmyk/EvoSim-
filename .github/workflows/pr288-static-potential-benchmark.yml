name: PR 288 Static Potential Matched Benchmark

on:
  push:
    branches:
      - bench/pr288-static-potential-candidate
      - bench/pr288-static-potential-baseline

concurrency:
  group: pr288-static-potential-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Three-run 24,000-tick organism-free chemistry benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out benchmark revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Build release executable
        run: cargo build --release
      - name: Run three timed reproducible release experiments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr288-benchmark
          : > /tmp/pr288-benchmark/timings.tsv
          for iteration in 1 2 3; do
            output="/tmp/pr288-benchmark/run-${iteration}.jsonl"
            start_ns=$(date +%s%N)
            target/release/evosim --headless \
              --environment-chemistry-experiment \
              --seed 42 \
              --duration-seconds 180 \
              --diagnostic-interval 100 \
              --diagnostics "$output"
            end_ns=$(date +%s%N)
            elapsed=$(awk -v start="$start_ns" -v end="$end_ns" 'BEGIN { printf "%.6f", (end-start)/1000000000 }')
            ticks=$(grep -o '"ticks_observed":[0-9]*' "$output" | tail -1 | cut -d: -f2)
            awk -v i="$iteration" -v t="$ticks" -v e="$elapsed" 'BEGIN { printf "run=%d ticks=%d elapsed_seconds=%s ticks_per_second=%.3f\n", i, t, e, t/e }' | tee -a /tmp/pr288-benchmark/timings.tsv
            grep '"event":"environmental_chemistry_summary"' "$output" | tee -a /tmp/pr288-benchmark/timings.tsv
          done
          echo "=== TIMING SUMMARY ==="
          cat /tmp/pr288-benchmark/timings.tsv
      - name: Upload benchmark diagnostics and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr288-benchmark-${{ github.ref_name == 'bench/pr288-static-potential-baseline' && 'baseline' || 'candidate' }}
          path: /tmp/pr288-benchmark/
          if-no-files-found: warn
