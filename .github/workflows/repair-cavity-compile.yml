name: Repair cavity compile

on:
  push:
    branches: [implement/bonded-cavity-foundation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cavity = Path('src/cavity.rs')
          s = cavity.read_text()
          s = s.replace('let mut out = Vec::new();', 'let mut out: Vec<(f64, Point)> = Vec::new();', 1)
          s = s.replace('Form::Polygon { vertices } => add_polygon_edges', 'Form::Polygon { ref vertices } => add_polygon_edges', 1)
          cavity.write_text(s)
          genome = Path('src/genome.rs')
          s = genome.read_text().replace('use crate::resources::{InternalBond, Material};', 'use crate::resources::Material;', 1)
          genome.write_text(s)
          PY
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit fixes and remove repair workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git rm .github/workflows/repair-cavity-compile.yml
          git commit -m 'Fix cavity compiler errors'
          git push
