name: temp-wire-juvenile-runtime
on:
  push:
    branches: [audit/unity-cleanup]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire runtime juvenile initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/simulation.rs')
          s = p.read_text()
          old = '''    pub(crate) fn create_initial_organism() -> Organism {
        let genome = initial_genome();
        let catalog = crate::resources::default_catalog();
        let structure = genome
            .structural_blueprint
            .realize(&catalog)
            .expect("initial structural blueprint must be realizable");
        let mature_mass = genome
            .structural_blueprint
            .structural_mass(&catalog)
            .max(f64::EPSILON);
        let realized_mass: f64 = structure
            .units
            .iter()
            .map(|unit| unit.material.mass(&catalog))
            .sum();
        let development_stage = if realized_mass / mature_mass >= ADULTHOOD_GROWTH_FRACTION {
            DevelopmentStage::Adult
        } else {
            DevelopmentStage::Juvenile
        };
        Organism {
'''
          new = '''    pub(crate) fn create_initial_organism() -> Organism {
        let genome = initial_genome();
        let catalog = crate::resources::default_catalog();
        let (structure, _initial_ledger, initial_energy) = crate::juvenile::realize_initial(
            &genome.juvenile_blueprint,
            &catalog,
        )
        .expect("initial genome must produce a viable juvenile realization");
        Organism {
'''
          if old not in s:
              raise SystemExit('initialization block not found')
          s = s.replace(old, new, 1)
          s = s.replace('            usable_energy: 0.0,\n', '            usable_energy: initial_energy,\n', 1)
          s = s.replace('            stored_material: crate::material_storage::MaterialStorage::default(),\n', '            stored_material: {\n                let mut storage = crate::material_storage::MaterialStorage::default();\n                assert!(storage.store(crate::resources::Material::free_base("Hydrogen", 1.0)));\n                storage\n            },\n', 1)
          s = s.replace('            development_stage,\n', '            development_stage: DevelopmentStage::Juvenile,\n', 1)
          p.write_text(s)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation.rs
          git commit -m "Wire runtime seed to viable juvenile realization" || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/temp-wire-juvenile-runtime.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary juvenile runtime wiring workflow" || true
          git push || true
