name: BREAK Discovery Reuse Matched Benchmark

on:
  push:
    branches:
      - optimization/break-discovery-reuse-main

concurrency:
  group: break-discovery-reuse-matched
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: One continuous 60-second run per revision
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Prepare exact revisions with identical duration runner
        shell: bash
        env:
          BASE_SHA: 400bf1689ea05d0377716906dbffa8560e0a0af7
          CANDIDATE_SHA: b1f893383c0dc8a8cfd063c77e53f41ce79bb823
          DURATION_RUNNER_SHA: e20f38ca78151eb75f56d548bd6181686716f4be
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" "$CANDIDATE_SHA" "$DURATION_RUNNER_SHA"
          git worktree add /tmp/break-reuse-baseline "$BASE_SHA"
          git worktree add /tmp/break-reuse-candidate "$CANDIDATE_SHA"
          for variant in baseline candidate; do
            worktree="/tmp/break-reuse-$variant"
            git show "$DURATION_RUNNER_SHA:src/simulation/simulation_runner.rs" > "$worktree/src/simulation/simulation_runner.rs"
            (cd "$worktree" && cargo build --release)
          done
      - name: Run exactly one uninterrupted 60-second sample per revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/break-reuse-results
          make_isolated_runtime_dir() {
            local source="$1"
            local destination="$2"
            mkdir -p "$destination"
            shopt -s dotglob nullglob
            for entry in "$source"/*; do
              local name
              name="$(basename "$entry")"
              if [[ "$name" == "chemistry_library" ]]; then
                continue
              fi
              ln -s "$entry" "$destination/$name"
            done
            mkdir -p "$destination/chemistry_library/data"
          }
          for variant in baseline candidate; do
            worktree="/tmp/break-reuse-$variant"
            runtime="/tmp/break-reuse-runtime-$variant"
            make_isolated_runtime_dir "$worktree" "$runtime"
            binary="$worktree/target/release/evosim"
            diagnostics="/tmp/break-reuse-results/$variant.jsonl"
            log="/tmp/break-reuse-results/$variant.log"
            start_ns="$(date +%s%N)"
            (cd "$runtime" && "$binary" --headless --environment-chemistry-experiment --seed 42 --duration-seconds 60 --diagnostic-interval 1000 --diagnostics "$diagnostics" > "$log" 2>&1)
            end_ns="$(date +%s%N)"
            elapsed="$(awk -v a="$start_ns" -v b="$end_ns" 'BEGIN { printf "%.6f", (b-a)/1000000000 }')"
            summary="$(grep '"event":"environmental_chemistry_summary"' "$diagnostics" | tail -1)"
            test -n "$summary"
            ticks="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ticks_observed"])' "$summary")"
            rate="$(awk -v t="$ticks" -v s="$elapsed" 'BEGIN { printf "%.3f", t/s }')"
            printf "%s\t%s\t%s\t%s\n" "$variant" "$ticks" "$elapsed" "$rate" | tee -a /tmp/break-reuse-results/throughput.tsv
            grep 'ENVIRONMENTAL CHEMISTRY START\|ENVIRONMENTAL CHEMISTRY END' "$log"
          done
          echo "=== MATCHED THROUGHPUT ==="
          cat /tmp/break-reuse-results/throughput.tsv
          python3 - <<'PY'
          rows = {}
          with open("/tmp/break-reuse-results/throughput.tsv", encoding="utf-8") as source:
              for line in source:
                  variant, ticks, elapsed, rate = line.split()
                  if variant in rows:
                      raise SystemExit(f"Duplicate {variant} measurement")
                  rows[variant] = float(rate)
          assert set(rows) == {"baseline", "candidate"}, rows
          print(f"candidate_vs_baseline_percent={(rows['candidate'] / rows['baseline'] - 1.0) * 100.0:.2f}%")
          PY
      - name: Validate both final inventories and energy balances
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          rows = {}
          for variant in ("baseline", "candidate"):
              path = Path(f"/tmp/break-reuse-results/{variant}.jsonl")
              summaries = [json.loads(line) for line in path.read_text().splitlines()
                           if '"event":"environmental_chemistry_summary"' in line]
              if len(summaries) != 1:
                  raise SystemExit(f"{variant}: expected exactly one final summary, found {len(summaries)}")
              row = summaries[0]
              ticks = row.get("ticks_observed")
              if not isinstance(ticks, int) or ticks <= 0:
                  raise SystemExit(f"{variant}: invalid observed tick count {ticks}")
              inventory = row.get("final_material_inventory")
              if not isinstance(inventory, dict) or sum(inventory.values()) != 1280:
                  raise SystemExit(f"{variant}: invalid final inventory {inventory}")
              residual = row.get("energy_balance_residual")
              if not isinstance(residual, (int, float)) or not math.isfinite(residual) or abs(residual) >= 1e-4:
                  raise SystemExit(f"{variant}: invalid energy residual {residual}")
              rows[variant] = row
          if rows["baseline"]["final_material_inventory"] != rows["candidate"]["final_material_inventory"]:
              raise SystemExit("Baseline and candidate final material inventories differ")
          print("PASS: one completed run per revision; both preserve 1,280 resources and energy residual < 1e-4")
          for variant, row in rows.items():
              print(variant, "ticks=", row["ticks_observed"],
                    "combine_committed=", row.get("combine_committed"),
                    "break_committed=", row.get("break_committed"),
                    "energy_residual=", row["energy_balance_residual"])
          PY
      - name: Upload benchmark runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: break-discovery-reuse-60-second-matched-benchmark
          path: /tmp/break-reuse-results/
          if-no-files-found: error
