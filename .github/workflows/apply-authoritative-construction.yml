name: apply-authoritative-construction
on:
  push:
    branches: [implementation/authoritative-combine-construction]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 exact match, found {n}')
              p.write_text(s.replace(old,new,1))
          p=Path('src/main.rs'); s=p.read_text()
          if 'mod construction_authority;' not in s:
              s=s.replace('mod construction_realization;\n','mod construction_realization;\nmod construction_authority;\n',1); p.write_text(s)
          p=Path('src/combine_runtime.rs'); s=p.read_text().replace('pub(crate) pub(crate) fn water_field_amount','pub(crate) fn water_field_amount',1)
          if 'pub(crate) fn try_combine_specific_pair(' not in s:
              marker='/// Build a temporary physical representation for arbitrary material'
              fn='''pub(crate) fn try_combine_specific_pair(structure:&mut crate::structure::OrganismStructure,unit_a:usize,unit_b:usize,endpoint_a:ConnectionEndpoint,endpoint_b:ConnectionEndpoint,catalog:&[BaseResource],cache:&mut ConnectionCompatibilityCache,energy:&mut f64,water:f64)->Option<CombineAttempt>{let candidate=crate::contact::connection_pair_candidates_cached(structure,unit_a,unit_b,catalog,cache).into_iter().find(|c|c.endpoint_a==endpoint_a&&c.endpoint_b==endpoint_b&&c.distance<=COMBINE_CONTACT_TOLERANCE&&c.available_a&&c.available_b)?;let a=structure.units.get(unit_a)?.properties(catalog)?;let b=structure.units.get(unit_b)?.properties(catalog)?;let evaluation=crate::combine::evaluate_formation(candidate,a.cohesion,b.cohesion);let(_,_,investment)=required_investment(a,b,evaluation,water).ok()?;form_bond(structure,BondFormationRequest{unit_a,unit_b,endpoint_a,endpoint_b,investment,water},catalog,cache,energy)}\n\n'''
              i=s.index(marker); s=s[:i]+fn+s[i:]
          p.write_text(s)
          p=Path('src/reproduction.rs'); s=p.read_text()
          if 'WaitingForEnergy,' not in s:
              s=s.replace('    WaitingForMaterial,\n    DevelopmentalFailure,','    WaitingForMaterial,\n    WaitingForEnergy,\n    DevelopmentalFailure,',1)
          pattern=r'fn construct_any_frontier_element\(.*?\n\npub\(crate\)fn begin_reproduction'
          new_fn='''fn construct_any_frontier_element(stored_material:&MaterialStorage,structure:&mut OrganismStructure,realized:&HashMap<usize,Vec<usize>>,allowed:&HashSet<usize>,blueprint:&crate::structural_blueprint::StructuralBlueprint,catalog:&[BaseResource],energy:&mut f64,water:f64)->ConstructionAdvance{let candidates=frontier(blueprint,realized,allowed);if candidates.is_empty(){return ConstructionAdvance::DevelopmentalFailure}let mut physically_valid=false;let mut energy_blocked=false;for blueprint_index in candidates{let mut candidate_structure=structure.clone();let Some((indices,stress))=add_blueprint_element(&mut candidate_structure,realized,blueprint_index,blueprint,catalog)else{continue};physically_valid=true;let mut remaining=stored_material.clone();if assemble_blueprint_material(&mut remaining,&blueprint.elements[blueprint_index].material).is_none(){continue}let mut candidate_energy=*energy;match crate::construction_authority::commit_candidate_structure(structure,&candidate_structure,catalog,&mut candidate_energy,water){Ok(committed)=>{*energy=candidate_energy;*structure=committed;return ConstructionAdvance::Progress{remaining,blueprint_index,stress,structure_indices:indices}},Err(_)=>{energy_blocked=true}}}if physically_valid&&energy_blocked{ConstructionAdvance::WaitingForEnergy}else if physically_valid{ConstructionAdvance::WaitingForMaterial}else{ConstructionAdvance::DevelopmentalFailure}}\n\npub(crate)fn begin_reproduction'''
          if not re.search(pattern,s,re.S): raise SystemExit('construct function pattern missing')
          s=re.sub(pattern,new_fn,s,count=1,flags=re.S)
          s=s.replace('pub(crate)fn begin_reproduction(parent:&mut Organism,rng:&mut ChaCha8Rng,catalog:&[BaseResource])->ReproductionStart{','pub(crate)fn begin_reproduction(parent:&mut Organism,rng:&mut ChaCha8Rng,catalog:&[BaseResource],water:f64)->ReproductionStart{',1)
          old='Ok(core)=>{parent.stored_material=next_remaining;parent.reproductive_readiness=0.0;let realized_elements=core.mapping.elements.iter().map(|element|element.blueprint_element_index).collect::<Vec<_>>();'
          new='Ok(core)=>{let mut candidate_energy=parent.usable_energy;let Ok(committed_core)=crate::construction_authority::commit_candidate_structure(&OrganismStructure::new(),&core.structure,catalog,&mut candidate_energy,water)else{remaining=next_remaining;for material in consumed.materials{let _=remaining.store(material);}if attempt+1<MAX_CORE_CONSTRUCTION_ATTEMPTS{continue}else{break}};parent.stored_material=next_remaining;parent.usable_energy=candidate_energy;parent.reproductive_readiness=0.0;let realized_elements=core.mapping.elements.iter().map(|element|element.blueprint_element_index).collect::<Vec<_>>();'
          if old in s: s=s.replace(old,new,1)
          if 'developing_structure:core.structure' in s: s=s.replace('developing_structure:core.structure','developing_structure:committed_core',1)
          s=s.replace('pub(crate)fn advance_construction(stored_material:&mut MaterialStorage,construction:&mut ReproductiveConstruction,catalog:&[BaseResource])->ConstructionAdvance{','pub(crate)fn advance_construction(stored_material:&mut MaterialStorage,construction:&mut ReproductiveConstruction,catalog:&[BaseResource],energy:&mut f64,water:f64)->ConstructionAdvance{',1)
          s=s.replace('construct_any_frontier_element(stored_material,&mut construction.developing_structure,&realized,&target,blueprint,catalog)','construct_any_frontier_element(stored_material,&mut construction.developing_structure,&realized,&target,blueprint,catalog,energy,water)',1)
          p.write_text(s)
          p=Path('src/simulation.rs'); s=p.read_text()
          s=re.sub(r'crate::reproduction::begin_reproduction\(organism,&mut self\.rng,&catalog\)', 'crate::reproduction::begin_reproduction(organism,&mut self.rng,&catalog,crate::combine_runtime::water_field_amount(&self.environment,organism))', s, count=1)
          s=re.sub(r'crate::reproduction::advance_construction\(&mut organism\.stored_material,construction,&catalog\)', 'crate::reproduction::advance_construction(&mut organism.stored_material,construction,&catalog,&mut organism.usable_energy,crate::combine_runtime::water_field_amount(&self.environment,organism))', s, count=1)
          s=s.replace('crate::reproduction::ConstructionAdvance::WaitingForMaterial=>{}crate::reproduction::ConstructionAdvance::DevelopmentalFailure=>','crate::reproduction::ConstructionAdvance::WaitingForMaterial=>{}crate::reproduction::ConstructionAdvance::WaitingForEnergy=>{}crate::reproduction::ConstructionAdvance::DevelopmentalFailure=>',1)
          p.write_text(s)
          PY
          cargo test --quiet
      - name: Commit implementation if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: route physical construction through authoritative COMBINE"
          git push
