name: phase3-structural-unit
on:
  push:
    branches: [phase3-physical-structure-authority]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify composite StructuralUnit guard
        run: |
          grep -F 'material.has_internal_structure()' src/structure.rs
          cargo fmt --all -- --check
          cargo test --all-targets
