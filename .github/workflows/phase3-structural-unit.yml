name: phase3-structural-unit
on:
  push:
    branches: [phase3-physical-structure-authority]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate composite StructuralUnit loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/structure.rs')
          text = p.read_text()
          marker = '        if !m.is_valid() || m.is_empty() {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('StructuralUnit material validation guard not found')
          end = text.find('        Ok(Self {', start)
          if end < 0:
              raise SystemExit('StructuralUnit deserialization return not found')
          block = text[start:end]
          if 'm.has_internal_structure()' not in block:
              replacement = '''        if !m.is_valid() || m.is_empty() {
            return Err(serde::de::Error::custom("invalid material"));
        }
        if m.has_internal_structure() {
            return Err(serde::de::Error::custom(
                "composite material cannot be loaded as a StructuralUnit; restore its physical constituents and bonds through the organism graph",
            ));
        }
'''
              text = text[:start] + replacement + text[end:]
              p.write_text(text)
          PY
          cargo fmt --all
          cargo test --all-targets
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/structure.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 3: reject composite StructuralUnit persistence'
          git push
