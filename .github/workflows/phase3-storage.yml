name: phase3-storage
on:
  push:
    branches: [phase3-physical-structure-authority]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate direct storage consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          exact = {
              'src/combine_runtime.rs': [
                  ('organism.stored_material.materials.first()?.clone()', 'organism.stored_material.first_material()?'),
              ],
              'src/simulation.rs': [
                  ('for material in organism.stored_material.materials.iter().cloned() {', 'for material in organism.stored_material.iter_materials().cloned() {'),
                  ('for material in construction.committed_material.materials.iter().cloned() {', 'for material in construction.committed_material.iter_materials().cloned() {'),
              ],
              'src/reproduction.rs': [
                  ('.materials', '.iter_materials()'),
              ],
              'src/simulation_tests.rs': [
                  ('o.stored_material.materials,', 'o.stored_material.materials_snapshot(),'),
                  ('o.stored_material.materials.len()', 'o.stored_material.len()'),
                  ('o.stored_material.materials.contains(&m)', 'o.stored_material.materials_snapshot().contains(&m)'),
                  ('s.organisms[0].stored_material.materials.contains(&m)', 's.organisms[0].stored_material.materials_snapshot().contains(&m)'),
              ],
              'src/phase2_structure_contract_tests.rs': [
                  ('organism.stored_material.materials.len()', 'organism.stored_material.len()'),
              ],
          }

          for name, pairs in exact.items():
              p = Path(name)
              text = p.read_text()
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              p.write_text(text)

          p = Path('src/phase2_structure_contract_tests.rs')
          text = p.read_text()
          chain = r'let realized_(before|after)\s*=\s*organism\s*\.stored_material\s*\.physical_instances\s*\.iter\(\)\s*\.filter\(\|instance\|\s*instance\.is_some\(\)\)\s*\.count\(\);'
          text = re.sub(chain, lambda m: f'let realized_{m.group(1)} = organism.stored_material.physical_count();', text)
          if 'physical_instances' in text:
              raise SystemExit('remaining phase2 physical_instances access was not migrated')
          p.write_text(text)
          PY
          cargo fmt --all
          cargo test --all-targets
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 3: complete storage consumer migration'
          git push
