name: phase3-death-finalize
on:
  push:
    branches: [phase3-physical-structure-authority]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-physical-structure-authority
          fetch-depth: 0
      - name: Migrate death storage without losing realization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          storage = Path('src/material_storage.rs')
          text = storage.read_text()
          marker = '''    pub(crate) fn materials_snapshot(&self) -> Vec<Material> {\n        self.iter_materials().cloned().collect()\n    }\n'''
          if 'pub(crate) fn drain_entries' not in text:
              if marker not in text:
                  raise SystemExit('storage marker not found')
              text = text.replace(marker, marker + '''\n    pub(crate) fn drain_entries(&mut self) -> Vec<StoredMaterial> {\n        std::mem::take(&mut self.entries)\n    }\n''', 1)
              storage.write_text(text)
          simulation = Path('src/simulation.rs')
          text = simulation.read_text()
          old = '''        for material in organism.stored_material.iter_materials().cloned() {\n            environment.field.deposit(position.x, position.y, material);\n        }\n        if let Some(construction) = &organism.reproductive_construction {\n            for material in construction.committed_material.iter_materials().cloned() {\n                environment.field.deposit(position.x, position.y, material);\n            }\n        }\n'''
          new = '''        for entry in organism.stored_material.drain_entries() {\n            match entry {\n                crate::material_storage::StoredMaterial::Logical(material) => {\n                    environment.field.deposit(position.x, position.y, material);\n                }\n                crate::material_storage::StoredMaterial::Physical(material) => {\n                    environment.field.deposit(position.x, position.y, material);\n                }\n            }\n        }\n        if let Some(mut construction) = organism.reproductive_construction.take() {\n            for entry in construction.committed_material.drain_entries() {\n                match entry {\n                    crate::material_storage::StoredMaterial::Logical(material) => {\n                        environment.field.deposit(position.x, position.y, material);\n                    }\n                    crate::material_storage::StoredMaterial::Physical(material) => {\n                        environment.field.deposit(position.x, position.y, material);\n                    }\n                }\n            }\n        }\n'''
          if old not in text:
              raise SystemExit('death storage block not found')
          simulation.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test --all-targets
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/material_storage.rs src/simulation.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 3: preserve realized material during death'
          git push origin HEAD:phase3-physical-structure-authority
