name: Diagnose COMBINE guard
on:
  push:
    branches:
      - audit/unity-cleanup
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run guard with diagnostics
        run: |
          set +e
          bash scripts/check_combine_architecture.sh > /tmp/guard.log 2>&1
          status=$?
          {
            echo "status=$status"
            echo '--- guard output ---'
            cat /tmp/guard.log
            echo '--- direct Bond matches ---'
            grep -R -nE '\\bBond[[:space:]]*\\{' src --include='*.rs' || true
            echo '--- direct bond admission matches ---'
            grep -R -nE '(\\.add_bond|::add_bond|try_add_bond)[[:space:]]*\\(' src --include='*.rs' || true
            echo '--- capacity matches ---'
            grep -R -nE 'connection_count\\([^)]*\\)[[:space:]]*==[[:space:]]*0|connection_count\\([^)]*\\)[[:space:]]*<[[:space:]]*1|MAX_CONNECTION|MAX_CONNECTIONS|CONNECTION_CAPACITY|connection_capacity' src --include='*.rs' || true
          } > COMBINE_GUARD_DIAGNOSTIC.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMBINE_GUARD_DIAGNOSTIC.txt
          git commit -m "Diagnose COMBINE architecture guard" || exit 0
          git push origin HEAD:audit/unity-cleanup
