name: Static Potential Cache Matched Benchmark — Current Baseline

on:
  push:
    branches:
      - bench/static-potential-cache-matched
  pull_request:
    branches:
      - main

concurrency:
  group: static-potential-cache-matched
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Three fixed 24,000-tick samples per revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Prepare exact validated revisions
        shell: bash
        env:
          BASE_SHA: 02114ede20874f732b39e83ae79b2ad444eb9580
          CANDIDATE_SHA: a8a176f2ce34c182c0f1015083592318add697a5
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" "$CANDIDATE_SHA"
          git worktree add /tmp/static-cache-baseline "$BASE_SHA"
          git worktree add /tmp/static-cache-candidate "$CANDIDATE_SHA"
          (cd /tmp/static-cache-baseline && cargo build --release)
          (cd /tmp/static-cache-candidate && cargo build --release)
      - name: Warm both revisions outside measured samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/static-cache-metrics
          for variant in baseline candidate; do
            workdir="/tmp/static-cache-$variant"
            (cd "$workdir" && EVOSIM_CHEMISTRY_CACHE_METRICS=1 "$workdir/target/release/evosim" --headless \
              --environment-chemistry-experiment --seed 42 --ticks 1000 \
              --diagnostic-interval 1000 --diagnostics "/tmp/static-cache-metrics/warmup-$variant.jsonl" \
              > "/tmp/static-cache-metrics/warmup-$variant.log" 2>&1)
          done
      - name: Run three alternating one-minute instrumented samples per revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/static-cache-metrics
          : > /tmp/static-cache-metrics/samples.tsv
          : > /tmp/static-cache-metrics/runs.tsv
          : > /tmp/static-cache-metrics/metrics.tsv
          : > /tmp/static-cache-metrics/summaries.jsonl
          declare -A counts
          counts[baseline]=0
          counts[candidate]=0
          sequence=(baseline candidate candidate baseline baseline candidate)
          for variant in "${sequence[@]}"; do
            counts[$variant]=$((counts[$variant] + 1))
            sample="${counts[$variant]}"
            workdir="/tmp/static-cache-$variant"
            binary="$workdir/target/release/evosim"
            output="/tmp/static-cache-metrics/${variant}-${sample}.jsonl"
            log="/tmp/static-cache-metrics/${variant}-${sample}.log"
            sample_start=$(date +%s%N)
            (cd "$workdir" && EVOSIM_CHEMISTRY_CACHE_METRICS=1 "$binary" --headless \
              --environment-chemistry-experiment --seed 42 --ticks 24000 \
              --diagnostic-interval 1000 --diagnostics "$output" > "$log" 2>&1)
            sample_end=$(date +%s%N)
            elapsed=$(awk -v a="$sample_start" -v b="$sample_end" 'BEGIN { printf "%.6f", (b-a)/1000000000 }')
            ticks=$(grep -o '"ticks_observed":[0-9]*' "$output" | tail -1 | cut -d: -f2)
            test "$ticks" = "24000"
            sample_ticks=$ticks
            run_count=1
            printf "%s\t%d\t%d\t%s\n" "$variant" "$sample" "$run_count" "$elapsed" >> /tmp/static-cache-metrics/runs.tsv
            grep '"event":"environmental_chemistry_summary"' "$output" >> /tmp/static-cache-metrics/summaries.jsonl
            grep '^CHEMISTRY_CACHE_METRICS ' "$log" | sed "s/^CHEMISTRY_CACHE_METRICS /$variant\t$sample\t1\t/" >> /tmp/static-cache-metrics/metrics.tsv
            rate=$(awk -v ticks="$sample_ticks" -v seconds="$elapsed" 'BEGIN { printf "%.3f", ticks/seconds }')
            printf "%s\t%d\t%d\t%s\t%d\t%s\n" "$variant" "$sample" "$sample_ticks" "$elapsed" "$run_count" "$rate" | tee -a /tmp/static-cache-metrics/samples.tsv
          done
          echo "=== THROUGHPUT MEDIANS ==="
          python3 - <<'PY'
          import statistics
          rows = {}
          with open("/tmp/static-cache-metrics/samples.tsv", encoding="utf-8") as source:
              for line in source:
                  variant, sample, ticks, elapsed, runs, rate = line.split()
                  rows.setdefault(variant, []).append(float(rate))
          for variant, rates in sorted(rows.items()):
              print(f"{variant}: samples={len(rates)} rates={rates} median_ticks_per_second={statistics.median(rates):.3f}")
          baseline = statistics.median(rows["baseline"])
          candidate = statistics.median(rows["candidate"])
          print(f"candidate_vs_baseline_percent={(candidate / baseline - 1.0) * 100.0:.2f}%")
          assert len(rows["baseline"]) == 3 and len(rows["candidate"]) == 3
          PY
          echo "=== CACHE METRICS TOTALS ==="
          python3 - <<'PY'
          import json
          from collections import defaultdict
          totals = defaultdict(lambda: defaultdict(int))
          runs = defaultdict(int)
          with open("/tmp/static-cache-metrics/metrics.tsv", encoding="utf-8") as source:
              for line in source:
                  variant, sample, run, payload = line.rstrip("\n").split("\t", 3)
                  data = json.loads(payload)
                  runs[variant] += 1
                  for key, value in data.items():
                      totals[variant][key] += value
          for variant in ("baseline", "candidate"):
              t = totals[variant]
              lookups = t["cache_hits"] + t["cache_misses"]
              hit_rate = 100.0 * t["cache_hits"] / lookups if lookups else 0.0
              avg_calc_us = t["potential_calculation_ns"] / t["potential_calculations"] / 1000 if t["potential_calculations"] else 0.0
              avg_combine_ms = t["combine_discovery_ns"] / t["combine_discovery_calls"] / 1_000_000 if t["combine_discovery_calls"] else 0.0
              print(f"{variant}: experiment_runs={runs[variant]} lookups={lookups} hits={t['cache_hits']} misses={t['cache_misses']} hit_rate={hit_rate:.2f}% potential_calculations={t['potential_calculations']} potential_calc_total_ms={t['potential_calculation_ns']/1e6:.3f} avg_potential_calc_us={avg_calc_us:.3f} combine_discovery_calls={t['combine_discovery_calls']} combine_discovery_total_ms={t['combine_discovery_ns']/1e6:.3f} avg_combine_discovery_ms={avg_combine_ms:.6f}")
          PY
          echo "=== RAW SAMPLES ==="
          cat /tmp/static-cache-metrics/samples.tsv
          echo "=== RAW METRICS ==="
          cat /tmp/static-cache-metrics/metrics.tsv
      - name: Validate inventory and energy conservation
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math
          path = "/tmp/static-cache-metrics/summaries.jsonl"
          try:
              rows = [json.loads(line) for line in open(path, encoding="utf-8") if line.strip()]
          except FileNotFoundError:
              raise SystemExit("No experiment summaries were produced")
          if not rows:
              raise SystemExit("No experiment summaries were produced")
          reference_inventory = None
          for i, row in enumerate(rows, 1):
              assert row.get("ticks_observed") == 24000, (i, row)
              inventory = row.get("final_material_inventory")
              assert isinstance(inventory, dict) and sum(inventory.values()) == 1280, (i, inventory)
              if reference_inventory is None:
                  reference_inventory = inventory
              assert inventory == reference_inventory, (i, inventory, reference_inventory)
              residual = row.get("energy_balance_residual")
              assert isinstance(residual, (int, float)) and math.isfinite(residual) and abs(residual) < 1e-4, (i, residual)
          print(f"Validated {len(rows)} complete runs: 24,000 ticks each, matching 1,280-resource inventories, energy residual < 1e-4")
          print("Totals:", {
              "combine_committed": sum(r["combine_committed"] for r in rows),
              "combine_rejected": sum(r["combine_rejected"] for r in rows),
              "break_committed": sum(r["break_committed"] for r in rows),
              "break_rejected": sum(r["break_rejected"] for r in rows),
          })
          PY
      - name: Upload instrumented benchmark data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-potential-cache-matched-benchmark
          path: /tmp/static-cache-metrics/
          if-no-files-found: warn
