<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvoSim Geometry Library</title><style>:root{font-family:system-ui;color:#eee;background:#111}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:340px 1fr;overflow:hidden}aside{border-right:1px solid #333;background:#181818;display:flex;flex-direction:column;min-width:0}header{padding:14px;border-bottom:1px solid #333}h1{font-size:18px;margin:0 0 10px}.muted{color:#aaa;font-size:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}input,select,button{background:#222;color:#eee;border:1px solid #444;border-radius:4px;padding:7px}button{cursor:pointer}.formation{padding:9px 12px;border-bottom:1px solid #292929;cursor:pointer}.formation:hover,.formation.selected{background:#292929}.formation strong{display:block}.formation small{color:#999}#formation-list{overflow:auto;flex:1}main{display:grid;grid-template-rows:1fr 245px;min-width:0}#canvas-wrap{position:relative;overflow:hidden;background:#0d0d0d}canvas{width:100%;height:100%;display:block}#hint{position:absolute;left:12px;top:12px;background:#000b;padding:8px 10px;border:1px solid #333;border-radius:4px;color:#bbb;font-size:12px}#details{border-top:1px solid #333;background:#181818;overflow:auto;padding:12px}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:8px;margin-bottom:10px}.card{background:#222;border:1px solid #333;border-radius:4px;padding:7px}.card b{display:block;font-size:11px;color:#aaa}.card span{font-size:13px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid #303030;padding:5px}th{color:#aaa}.family{margin-top:10px}.family h3{font-size:13px;margin:10px 0 4px}@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:300px 1fr}aside{border-right:0;border-bottom:1px solid #333}main{min-height:0}.detail-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><aside><header><h1>Geometry Reference Library</h1><div class="muted">Read-only microscope for the persistent catalogue. The worker remains independent.</div><div class="controls"><input id="search" placeholder="resource / signature"><select id="size"><option value="all">All sizes</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5+</option></select><button id="refresh">Refresh</button><button id="prev">Previous</button><button id="next">Next</button></div><div id="summary" class="muted" style="margin-top:9px">Loading…</div></header><div id="formation-list"></div></aside><main><div id="canvas-wrap"><canvas id="canvas"></canvas><div id="hint">Click a formation. Wheel = zoom. Drag = pan. R = reset.</div></div><section id="details"><div class="muted">Select a formation to inspect its realized geometry, constituent placements, bond topology, and persisted contact families.</div></section></main><script src="/geometry_library.js"></script></body></html>
