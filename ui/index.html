<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvoSim</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111; color: #eee; font-family: sans-serif; overflow: hidden; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    header { padding: 10px 14px; background: #1b1b1b; border-bottom: 1px solid #333; }
    #status { font-size: 14px; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; }
    #world { width: min(90vw, 1000px); height: min(80vh, 700px); background: #050505; border: 1px solid #333; }
  </style>
</head>
<body>
  <div id="app">
    <header><div id="status">Connecting to EvoSim…</div></header>
    <main><canvas id="world"></canvas></main>
  </div>
  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * devicePixelRatio));
      canvas.height = Math.max(1, Math.floor(rect.height * devicePixelRatio));
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    window.addEventListener('resize', resize);
    resize();

    function render(snapshot) {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);
      status.textContent = `EvoSim connected — tick ${snapshot.tick ?? '?'}`;

      // Checkpoint 2 intentionally keeps rendering minimal. The canvas is the
      // read-only viewport; organism/resource visualization will be expanded
      // in later checkpoints once the snapshot shape is finalized.
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socket = new WebSocket(`${protocol}//${location.host}/ws`);

      socket.addEventListener('open', () => {
        status.textContent = 'EvoSim connected';
      });
      socket.addEventListener('message', event => {
        try { render(JSON.parse(event.data)); } catch (_) {}
      });
      socket.addEventListener('close', () => {
        status.textContent = 'EvoSim disconnected — retrying…';
        setTimeout(connect, 1000);
      });
      socket.addEventListener('error', () => socket.close());
    }

    connect();
  </script>
</body>
</html>
