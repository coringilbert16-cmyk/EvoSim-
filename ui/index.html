<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvoSim</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111; color: #eee; font-family: sans-serif; overflow: hidden; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    header { padding: 10px 14px; background: #1b1b1b; border-bottom: 1px solid #333; }
    #status { font-size: 14px; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; }
    #world { width: min(90vw, 1000px); height: min(80vh, 700px); background: #050505; border: 1px solid #333; cursor: grab; }
    #world.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="app">
    <header><div id="status">Connecting to EvoSim…</div></header>
    <main><canvas id="world"></canvas></main>
  </div>
  <script>
    // Browser-only camera transform. It owns view state, never simulation state.
    class Camera {
      constructor() {
        this.x = 0;
        this.y = 0;
        this.scale = 1;
      }

      fitWorld(worldWidth, worldHeight, viewportWidth, viewportHeight, padding = 0.92) {
        if (![worldWidth, worldHeight, viewportWidth, viewportHeight, padding].every(Number.isFinite)) {
          return;
        }
        if (worldWidth <= 0 || worldHeight <= 0 || viewportWidth <= 0 || viewportHeight <= 0 || padding <= 0) {
          return;
        }

        this.x = worldWidth / 2;
        this.y = worldHeight / 2;
        this.scale = Math.min(viewportWidth / worldWidth, viewportHeight / worldHeight) * padding;
      }

      worldToScreen(x, y, viewportWidth, viewportHeight) {
        return {
          x: (x - this.x) * this.scale + viewportWidth / 2,
          y: (y - this.y) * this.scale + viewportHeight / 2,
        };
      }

      screenToWorld(x, y, viewportWidth, viewportHeight) {
        return {
          x: (x - viewportWidth / 2) / this.scale + this.x,
          y: (y - viewportHeight / 2) / this.scale + this.y,
        };
      }

      pan(screenDeltaX, screenDeltaY) {
        if (!Number.isFinite(screenDeltaX) || !Number.isFinite(screenDeltaY)) {
          return;
        }
        this.x -= screenDeltaX / this.scale;
        this.y -= screenDeltaY / this.scale;
      }

      zoomAt(screenX, screenY, factor, viewportWidth, viewportHeight) {
        if (!Number.isFinite(factor) || factor <= 0 || !Number.isFinite(screenX) || !Number.isFinite(screenY)) {
          return;
        }

        const before = this.screenToWorld(screenX, screenY, viewportWidth, viewportHeight);
        this.scale *= factor;
        const after = this.screenToWorld(screenX, screenY, viewportWidth, viewportHeight);
        this.x += before.x - after.x;
        this.y += before.y - after.y;
      }
    }

    const status = document.getElementById('status');
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const camera = new Camera();
    let cameraInitialized = false;
    let lastSnapshot = null;
    let dragState = null;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * devicePixelRatio));
      canvas.height = Math.max(1, Math.floor(rect.height * devicePixelRatio));
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

      if (!cameraInitialized && lastSnapshot) {
        fitToWorld(lastSnapshot);
      }
    }

    function viewportSize() {
      return {
        width: canvas.clientWidth,
        height: canvas.clientHeight,
      };
    }

    function fitToWorld(snapshot) {
      const worldWidth = snapshot.environment?.width || 1;
      const worldHeight = snapshot.environment?.height || 1;
      const viewport = viewportSize();
      camera.fitWorld(worldWidth, worldHeight, viewport.width, viewport.height);
      cameraInitialized = true;
    }

    function render(snapshot) {
      lastSnapshot = snapshot;
      if (!cameraInitialized) {
        fitToWorld(snapshot);
      }

      const viewport = viewportSize();
      ctx.clearRect(0, 0, viewport.width, viewport.height);

      for (const organism of snapshot.organisms || []) {
        const cells = organism.occupied_cells || [];
        for (const cell of cells) {
          const point = camera.worldToScreen(cell.x, cell.y, viewport.width, viewport.height);
          ctx.beginPath();
          ctx.arc(point.x, point.y, Math.max(1, 1.5 * camera.scale), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      status.textContent = `EvoSim connected — tick ${snapshot.tick ?? '?'}`;
    }

    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const viewport = viewportSize();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const factor = Math.exp(-event.deltaY * 0.001);
      camera.zoomAt(x, y, factor, viewport.width, viewport.height);
      if (lastSnapshot) {
        render(lastSnapshot);
      }
    }, { passive: false });

    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0) {
        return;
      }
      canvas.setPointerCapture(event.pointerId);
      dragState = { pointerId: event.pointerId, x: event.clientX, y: event.clientY };
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', event => {
      if (!dragState || dragState.pointerId !== event.pointerId) {
        return;
      }
      const dx = event.clientX - dragState.x;
      const dy = event.clientY - dragState.y;
      dragState.x = event.clientX;
      dragState.y = event.clientY;
      camera.pan(dx, dy);
      if (lastSnapshot) {
        render(lastSnapshot);
      }
    });

    function endDrag(event) {
      if (!dragState || dragState.pointerId !== event.pointerId) {
        return;
      }
      dragState = null;
      canvas.classList.remove('dragging');
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', () => {
      dragState = null;
      canvas.classList.remove('dragging');
    });

    window.addEventListener('resize', resize);
    resize();

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socket = new WebSocket(`${protocol}//${location.host}/ws`);

      socket.addEventListener('open', () => {
        status.textContent = 'EvoSim connected';
      });
      socket.addEventListener('message', event => {
        try { render(JSON.parse(event.data)); } catch (_) {}
      });
      socket.addEventListener('close', () => {
        status.textContent = 'EvoSim disconnected — retrying…';
        setTimeout(connect, 1000);
      });
      socket.addEventListener('error', () => socket.close());
    }

    connect();
  </script>
</body>
</html>
