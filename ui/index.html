<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvoSim — Seed Microscope</title>
  <style>
    :root { color-scheme: dark; --panel: #11161d; --line: #2b3440; --text: #e8edf2; --muted: #8e9aa8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b0f; color: var(--text); font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
    #app { width: 100%; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
    #viewport { position: relative; min-width: 0; min-height: 0; background: #080b0f; }
    #world { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #world.dragging { cursor: grabbing; }
    #hud { position: absolute; left: 12px; top: 10px; padding: 7px 9px; background: rgba(8,11,15,.88); border: 1px solid var(--line); pointer-events: none; white-space: pre; }
    #diagnostics { min-width: 0; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px; }
    #diagnostics h1 { font-size: 13px; margin: 0 0 10px; }
    #connection { color: var(--muted); margin-bottom: 10px; }
    details { border: 1px solid var(--line); margin: 6px 0; background: #0d1218; }
    summary { cursor: pointer; padding: 7px 8px; color: #cdd6df; user-select: none; }
    .section { padding: 7px 9px 9px; border-top: 1px solid var(--line); }
    .kv { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(0, 1.5fr); gap: 3px 10px; }
    .key { color: var(--muted); overflow-wrap: anywhere; }
    .value { color: var(--text); overflow-wrap: anywhere; white-space: pre-wrap; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
    .physical-note { color: var(--muted); margin: 0 0 8px; }
    @media (max-width: 900px) { #app { grid-template-columns: minmax(0, 1fr) 320px; } }
  </style>
</head>
<body>
<div id="app">
  <section id="viewport">
    <canvas id="world"></canvas>
    <div id="hud">SEED MICROSCOPE\nwaiting for observation…</div>
  </section>
  <aside id="diagnostics">
    <h1>SEED — DIAGNOSTICS</h1>
    <div id="connection">Connecting…</div>
    <div id="sections"></div>
  </aside>
</div>
<script>
(() => {
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const connection = document.getElementById('connection');
  const sections = document.getElementById('sections');

  const camera = { x: 500, y: 500, scale: 5, initialized: false };
  let observation = null;
  let dragging = false;
  let lastPointer = null;

  function resize() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  }
  window.addEventListener('resize', resize);

  function viewport() { return { w: canvas.clientWidth, h: canvas.clientHeight }; }
  function screen(x, y) { const v = viewport(); return { x: (x - camera.x) * camera.scale + v.w / 2, y: (y - camera.y) * camera.scale + v.h / 2 }; }
  function world(sx, sy) { const v = viewport(); return { x: (sx - v.w / 2) / camera.scale + camera.x, y: (sy - v.h / 2) / camera.scale + camera.y }; }

  function formPath(form) {
    if (!form) return false;
    ctx.beginPath();
    if (form.Circle) ctx.arc(0, 0, form.Circle.radius, 0, Math.PI * 2);
    else if (form.Line) { const h = form.Line.length / 2; ctx.moveTo(-h, 0); ctx.lineTo(h, 0); }
    else if (form.Rectangle) ctx.rect(-form.Rectangle.width / 2, -form.Rectangle.height / 2, form.Rectangle.width, form.Rectangle.height);
    else if (form.RegularPolygon) {
      const n = form.RegularPolygon.sides, r = form.RegularPolygon.radius;
      for (let i = 0; i < n; i++) { const a = i * Math.PI * 2 / n, x = r * Math.cos(a), y = r * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.closePath();
    } else if (form.Polygon) {
      const pts = form.Polygon.vertices || [];
      pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.closePath();
    } else return false;
    return true;
  }

  function drawForm(form, x, y, rotation, stroke = '#d9e1e8', fill = 'rgba(120,150,180,.18)') {
    if (!form || !formPath(form)) return;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rotation || 0);
    ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(.7, 1 / Math.max(camera.scale, 1));
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawField() {
    for (const cell of observation.field || []) {
      const p = screen(cell.x, cell.y);
      const size = 25 * camera.scale;
      if (p.x + size < 0 || p.y + size < 0 || p.x - size > canvas.clientWidth || p.y - size > canvas.clientHeight) continue;
      ctx.save();
      ctx.strokeStyle = 'rgba(120,150,180,.16)'; ctx.lineWidth = 1;
      ctx.strokeRect(p.x - size / 2, p.y - size / 2, size, size);
      ctx.fillStyle = 'rgba(120,150,180,.08)'; ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
      ctx.fillStyle = '#aeb9c5'; ctx.font = '10px ui-monospace, monospace';
      const labels = (cell.materials || []).map(m => m.parts.map(p => `${p[0]}:${p[1]}`).join('+'));
      ctx.fillText(labels.join(' | '), p.x - size / 2 + 3, p.y + 3);
      ctx.restore();
    }
  }

  function drawEnvironmentMarkers() {
    for (const p of observation.vents || []) {
      const s = screen(p.x, p.y); ctx.save(); ctx.strokeStyle = '#a9b4bf'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(s.x - 5, s.y); ctx.lineTo(s.x + 5, s.y); ctx.moveTo(s.x, s.y - 5); ctx.lineTo(s.x, s.y + 5); ctx.stroke(); ctx.restore();
    }
    for (const p of observation.decomposing_bodies || []) {
      const s = screen(p.x, p.y); ctx.save(); ctx.strokeStyle = '#8b949e'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(s.x, s.y, 7, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  }

  function drawSeed() {
    const units = observation.structure?.units || [];
    const bonds = observation.structure?.bonds || [];
    ctx.save(); ctx.strokeStyle = 'rgba(235,242,248,.8)'; ctx.lineWidth = Math.max(1, Math.min(3, camera.scale * .08));
    for (const bond of bonds) {
      if (!bond.endpoint_a || !bond.endpoint_b) continue;
      const a = screen(bond.endpoint_a.x, bond.endpoint_a.y), b = screen(bond.endpoint_b.x, bond.endpoint_b.y);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.restore();
    for (const unit of units) {
      const p = screen(unit.x, unit.y);
      drawForm(unit.form, p.x, p.y, unit.rotation_radians);
    }
  }

  function render() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    if (!observation) return;
    drawField(); drawEnvironmentMarkers(); drawSeed();
    const seedPos = observation.seed.occupied_cells?.[0];
    if (seedPos) {
      const p = screen(seedPos.x, seedPos.y);
      ctx.save(); ctx.strokeStyle = '#f0f4f8'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    hud.textContent = `SEED MICROSCOPE\nTICK ${observation.tick}  |  ${observation.running ? 'RUNNING' : 'PAUSED'}  |  ${observation.ticks_per_second} TPS`;
  }

  function value(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? String(Math.round(v * 1e6) / 1e6) : String(v);
    if (typeof v === 'string' || typeof v === 'boolean' || v === null) return String(v);
    return JSON.stringify(v, null, 2);
  }
  function kv(entries) {
    const div = document.createElement('div'); div.className = 'kv';
    for (const [k, v] of entries) { const a = document.createElement('div'); a.className = 'key'; a.textContent = k; const b = document.createElement('div'); b.className = 'value'; b.textContent = value(v); div.append(a, b); }
    return div;
  }
  function section(title, entries, open = false) {
    const d = document.createElement('details'); d.open = open; const s = document.createElement('summary'); s.textContent = title; const body = document.createElement('div'); body.className = 'section'; body.appendChild(kv(entries)); d.append(s, body); sections.appendChild(d);
  }
  function rawSection(title, data, open = false) {
    const d = document.createElement('details'); d.open = open; const s = document.createElement('summary'); s.textContent = title; const body = document.createElement('div'); body.className = 'section'; const pre = document.createElement('pre'); pre.textContent = JSON.stringify(data, null, 2); body.appendChild(pre); d.append(s, body); sections.appendChild(d);
  }

  function renderDiagnostics() {
    sections.replaceChildren();
    if (!observation) return;
    const seed = observation.seed;
    connection.textContent = `Observation tick ${observation.tick} · seed ${seed.id}`;
    section('Identity', [['id', seed.id], ['position', seed.occupied_cells?.[0]], ['age', seed.age], ['development_stage', seed.development_stage]], true);
    section('Physical state', [['unit_count', observation.structure.units.length], ['bond_count', observation.structure.bonds.length], ['stored_material', seed.stored_material], ['active_transformation_id', seed.active_transformation_id], ['reproductive_construction', seed.reproductive_construction]], true);
    section('Energy / stress', [['usable_energy', seed.usable_energy], ['stress', seed.stress], ['stress_threshold', seed.stress_threshold], ['energy_ledger', observation.energy_ledger]], true);
    section('Genome', [['genome', seed.genome]], false);
    section('Perception / sensing', [['resource_sense', seed.resource_sense]], false);
    section('Memory', [['memory', seed.memory]], false);
    section('Decision history', [['decision_history', seed.decision_history]], false);
    section('Reproduction', [['reproductive_readiness', seed.reproductive_readiness], ['reproductive_construction', seed.reproductive_construction]], false);
    section('Active transformations', [['transformations', observation.active_transformations]], false);
    section('Environment', [['world_width', observation.world_width], ['world_height', observation.world_height], ['field_cells_with_material', observation.field.length], ['vents', observation.vents], ['decomposing_bodies', observation.decomposing_bodies]], false);
    rawSection('Raw seed state', seed, false);
  }

  async function observe() {
    try {
      const response = await fetch('/observation/seed', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      observation = await response.json();
      if (!camera.initialized) {
        const p = observation.seed.occupied_cells?.[0];
        if (p) { camera.x = p.x; camera.y = p.y; }
        camera.initialized = true;
      }
      renderDiagnostics(); render();
      connection.style.color = '';
    } catch (error) {
      connection.textContent = `Observation error: ${error.message}`;
      connection.style.color = '#d88';
    }
  }

  canvas.addEventListener('pointerdown', e => { dragging = true; lastPointer = { x: e.clientX, y: e.clientY }; canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (!dragging) return; camera.x -= (e.clientX - lastPointer.x) / camera.scale; camera.y -= (e.clientY - lastPointer.y) / camera.scale; lastPointer = { x: e.clientX, y: e.clientY }; render(); });
  canvas.addEventListener('pointerup', e => { dragging = false; lastPointer = null; canvas.classList.remove('dragging'); canvas.releasePointerCapture(e.pointerId); });
  canvas.addEventListener('wheel', e => { e.preventDefault(); const before = world(e.offsetX, e.offsetY); camera.scale = Math.min(100, Math.max(.1, camera.scale * (e.deltaY < 0 ? 1.12 : .89))); const after = world(e.offsetX, e.offsetY); camera.x += before.x - after.x; camera.y += before.y - after.y; render(); }, { passive: false });

  resize();
  observe();
  setInterval(observe, 100);
})();
</script>
</body>
</html>
