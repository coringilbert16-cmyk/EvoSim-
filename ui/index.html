<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvoSim</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f5f5f5; color: #111; font-family: sans-serif; overflow: hidden; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    header { padding: 8px 12px; background: #fff; border-bottom: 1px solid #bbb; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    #status { font-size: 14px; flex:1 1 260px; }
    #keyboard-help { font-size:12px; color:#444; white-space:nowrap; }
    .speed-control { display:flex; align-items:center; gap:5px; white-space:nowrap; }
    #timeline { position:fixed; left:12px; right:12px; bottom:10px; display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(255,255,255,.94); border:1px solid #999; border-radius:6px; z-index:20; }
    #history { flex:1; min-width:120px; }
    #timeline-label { min-width:150px; font-size:12px; text-align:right; }
    .transport-button { border:1px solid #777; border-radius:4px; padding:5px 10px; background:#fff; color:#111; cursor:pointer; white-space:nowrap; }
    .transport-button.primary { background:#166534; color:#fff; border-color:#166534; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; }
    #world { width: min(90vw, 1000px); height: min(80vh, 700px); background: #fff; border: 1px solid #888; cursor: crosshair; touch-action: none; }
    #world.panning { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div id="status">Connecting to EvoSim…</div>
      <div id="keyboard-help">Space: pause/play · &lt;: back one tick · &gt;: forward one tick · Esc: reset</div>
    </header>
    <div id="timeline">
      <button id="run-toggle" class="transport-button primary" type="button">Run</button>
      <button id="step-back" class="transport-button" type="button" title="Rewind one simulation tick">Back</button>
      <button id="step-once" class="transport-button" type="button" title="Advance one simulation tick">Step</button>
      <button id="live-follow" class="transport-button" type="button" hidden>Continue from Here</button>
      <input id="history" type="range" min="0" max="0" value="0" step="1" aria-label="Simulation history">
      <span id="timeline-label">Live</span>
      <label class="speed-control">Speed <input id="speed" type="range" min="0.1" max="100" step="0.1" value="10"><span id="speed-value">10</span> ticks/s</label>
    </div>
    <main><canvas id="world"></canvas></main>
  </div>
  <script>
    // Browser-only camera transform. It owns view state, never simulation state.
    class Camera {
      constructor() { this.x = 0; this.y = 0; this.scale = 1; this.minScale = 0.04; this.maxScale = 24; this.worldBounds = null; }
      fitBounds(minX, maxX, minY, maxY, viewportWidth, viewportHeight, padding = 0.82) {
        if (![minX, maxX, minY, maxY, viewportWidth, viewportHeight, padding].every(Number.isFinite)) return;
        const width = Math.max(maxX - minX, 1e-9), height = Math.max(maxY - minY, 1e-9);
        if (viewportWidth <= 0 || viewportHeight <= 0 || padding <= 0) return;
        this.x = (minX + maxX) / 2; this.y = (minY + maxY) / 2;
        const fitScale = Math.min(viewportWidth / width, viewportHeight / height) * padding;
        // The fitted view is the zoom-out limit: never show less than the
        // complete world. Preserve a useful zoom-in range for inspecting detail.
        this.minScale = fitScale;
        this.maxScale = Math.min(300, fitScale * 24);
        this.scale = fitScale;
      }
      fitWorld(worldWidth, worldHeight, viewportWidth, viewportHeight, padding = 0.92) {
        this.worldBounds = { minX: 0, maxX: worldWidth, minY: 0, maxY: worldHeight };
        this.fitBounds(0, worldWidth, 0, worldHeight, viewportWidth, viewportHeight, padding);
        this.clampView(viewportWidth, viewportHeight);
      }
      clampView(viewportWidth, viewportHeight) {
        if (!this.worldBounds || this.scale <= 0 || viewportWidth <= 0 || viewportHeight <= 0) return;
        const halfWidth = viewportWidth / (2 * this.scale), halfHeight = viewportHeight / (2 * this.scale);
        const bounds = this.worldBounds;
        const centerX = (bounds.minX + bounds.maxX) / 2, centerY = (bounds.minY + bounds.maxY) / 2;
        this.x = halfWidth * 2 >= bounds.maxX - bounds.minX
          ? centerX : Math.max(bounds.minX + halfWidth, Math.min(bounds.maxX - halfWidth, this.x));
        this.y = halfHeight * 2 >= bounds.maxY - bounds.minY
          ? centerY : Math.max(bounds.minY + halfHeight, Math.min(bounds.maxY - halfHeight, this.y));
      }
      worldToScreen(x, y, viewportWidth, viewportHeight) {
        return { x: (x - this.x) * this.scale + viewportWidth / 2, y: (y - this.y) * this.scale + viewportHeight / 2 };
      }
      screenToWorld(x, y, viewportWidth, viewportHeight) {
        return { x: (x - viewportWidth / 2) / this.scale + this.x, y: (y - viewportHeight / 2) / this.scale + this.y };
      }
      pan(dx, dy, viewportWidth, viewportHeight) { if (Number.isFinite(dx) && Number.isFinite(dy)) { this.x -= dx / this.scale; this.y -= dy / this.scale; this.clampView(viewportWidth, viewportHeight); } }
      zoomAt(screenX, screenY, factor, viewportWidth, viewportHeight) {
        if (!Number.isFinite(factor) || factor <= 0) return;
        const before = this.screenToWorld(screenX, screenY, viewportWidth, viewportHeight);
        this.scale = Math.max(this.minScale, Math.min(this.maxScale, this.scale * factor));
        const after = this.screenToWorld(screenX, screenY, viewportWidth, viewportHeight);
        this.x += before.x - after.x; this.y += before.y - after.y;
        this.clampView(viewportWidth, viewportHeight);
      }
      centerOn(x, y) { if (Number.isFinite(x) && Number.isFinite(y)) { this.x = x; this.y = y; } }
    }

    const status = document.getElementById('status');
    window.addEventListener('error', event => {
      const message = event.message || 'Unknown browser error';
      if (status) status.textContent = 'Viewer script error: ' + message.slice(0, 180);
    });
    window.addEventListener('unhandledrejection', event => {
      const reason = event.reason instanceof Error ? event.reason.message : String(event.reason);
      if (status) status.textContent = 'Viewer async error: ' + reason.slice(0, 180);
    });
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const camera = new Camera();
    const selectedIds = new Set();
    let focusedOrganismId = null;
    let observationLevel = 'World';
    let observation = null;
    let cameraInitialized = false;
    let interaction = null;
    let requestSerial = 0;
    let runtimeStatus = null;
    let speedControlActive = false;
    let noLivingOrganisms = false;
    let historyViewTick = null;
    let historyTicks = [];
    let timelineScrubbing = false;
    const worldCache = {
      organisms: new Map(),
      field: new Map()
    };
    // Display interpolation is presentation-only. Simulation observations remain authoritative.
    let displayAnimationStartedAt = 0;
    let displayAnimationDurationMs = 100;
    const displayPositionStarts = new WeakMap();
    window.__evosimGetDisplayPosition = part => {
      const start = displayPositionStarts.get(part);
      if (!start) return { x: part.x, y: part.y };
      const alpha = Math.max(0, Math.min(1, (performance.now() - displayAnimationStartedAt) / displayAnimationDurationMs));
      return { x: start.x + (part.x - start.x) * alpha, y: start.y + (part.y - start.y) * alpha };
    };

    async function control(path) {
      try {
        const response = await fetch(path, { method: 'POST', cache: 'no-store' });
        if (!response.ok) throw new Error();
        await refreshRuntimeStatus();
      } catch (_) {
        status.textContent = 'Control unavailable — simulation may be restarting…';
      }
    }

    async function refreshRuntimeStatus() {
      try {
        const response = await fetch('/observation/status', { cache: 'no-store' });
        if (!response.ok) throw new Error();
        runtimeStatus = await response.json();
        noLivingOrganisms = runtimeStatus.population === 0;
        historyTicks = runtimeStatus.history_ticks || [];
        const slider = document.getElementById('history');
        slider.min = historyTicks.length ? historyTicks[0] : 0;
        slider.max = runtimeStatus.tick ?? 0;
        slider.step = 1;
        if (!timelineScrubbing) slider.value = historyViewTick ?? runtimeStatus.tick ?? 0;
        updateTimeline();
        updateControls();
        return runtimeStatus;
      } catch (_) {
        runtimeStatus = null;
        return null;
      }
    }

    function updateTimeline() {
      const slider = document.getElementById('history');
      const label = document.getElementById('timeline-label');
      const liveButton = document.getElementById('live-follow');
      if (liveButton) liveButton.hidden = historyViewTick == null;
      if (timelineScrubbing) {
        label.textContent = 'Seek to tick ' + slider.value;
        return;
      }
      if (!historyTicks.length) { label.textContent = 'No history'; return; }
      const tick = historyViewTick ?? runtimeStatus?.tick ?? Number(slider.value);
      label.textContent = historyViewTick == null
        ? (runtimeStatus?.running ? 'Playing — tick ' : 'Paused — tick ') + tick
        : 'Paused at tick ' + tick;
    }

    function clearWorldCache() {
      worldCache.organisms.clear();
      worldCache.field.clear();
    }

    async function loadHistoricalWorld(tick) {
      const serial = ++requestSerial;
      try {
        // Seeking restores simulation state and replays from the nearest
        // retained checkpoint; it does not display a detached old snapshot.
        const response = await fetch('/control/restore/' + encodeURIComponent(tick), {
          method: 'POST', cache: 'no-store'
        });
        if (!response.ok) throw new Error();
        if (serial !== requestSerial) return;
        historyViewTick = tick;
        observationLevel = 'World';
        selectedIds.clear();
        focusedOrganismId = null;
        clearWorldCache();
        observation = null;
        cameraInitialized = false;
        await refreshRuntimeStatus();
        await loadObservation('World');
        updateTimeline();
      } catch (_) {
        if (serial === requestSerial) status.textContent = 'Could not seek to that simulation tick.';
      }
    }

    async function continueFromHere() {
      historyViewTick = null;
      await control('/control/resume');
      updateTimeline();
    }

    function updateControls() {
      const speed = document.getElementById('speed');
      const speedValue = document.getElementById('speed-value');
      const runToggle = document.getElementById('run-toggle');
      if (runToggle) {
        runToggle.textContent = runtimeStatus?.running ? 'Pause' : 'Run';
        runToggle.classList.toggle('primary', !runtimeStatus?.running);
        runToggle.setAttribute('aria-label', runtimeStatus?.running ? 'Pause simulation' : 'Run simulation');
      }
      if (runtimeStatus?.ticks_per_second != null && !speedControlActive) {
        speed.value = runtimeStatus.ticks_per_second;
        speedValue.textContent = Number(runtimeStatus.ticks_per_second).toFixed(1).replace(/\\.0$/, '');
      }
    }

    document.getElementById('run-toggle').addEventListener('click', async () => {
      if (runtimeStatus?.running) await control('/control/pause');
      else {
        historyViewTick = null;
        await control('/control/resume');
      }
      updateTimeline();
    });
    document.getElementById('step-back').addEventListener('click', stepBack);
    document.getElementById('step-once').addEventListener('click', stepForward);

    async function stepForward() {
      if (runtimeStatus?.running) await control('/control/pause');
      const response = await fetch('/control/step', { method: 'POST', cache: 'no-store' });
      if (!response.ok) return;
      const state = await response.json();
      historyViewTick = state.tick;
      observationLevel = 'World';
      selectedIds.clear();
      focusedOrganismId = null;
      clearWorldCache();
      await refreshRuntimeStatus();
      await loadObservation('World');
      updateTimeline();
    }

    async function stepBack() {
      await refreshRuntimeStatus();
      const currentTick = historyViewTick ?? runtimeStatus?.tick;
      if (!Number.isFinite(currentTick) || currentTick <= Number(document.getElementById('history').min)) return;
      if (runtimeStatus?.running) await control('/control/pause');
      await loadHistoricalWorld(currentTick - 1);
    }

    document.getElementById('speed').addEventListener('input', event => {
      const value = Number(event.target.value);
      if (!Number.isFinite(value) || value <= 0) return;
      document.getElementById('speed-value').textContent = Number(value).toFixed(1).replace(/\\.0$/, '');
    });
    document.getElementById('speed').addEventListener('change', async event => {
      const value = Number(event.target.value);
      if (Number.isFinite(value) && value > 0) await control('/control/speed/' + encodeURIComponent(value));
    });
    document.getElementById('speed').addEventListener('focus', () => { speedControlActive = true; });
    document.getElementById('speed').addEventListener('blur', () => { speedControlActive = false; });
    // The playhead addresses every retained simulation tick. Seeking changes
    // authoritative state; it does not merely display a stored screenshot.
    document.getElementById('history').addEventListener('input', event => {
      timelineScrubbing = true;
      document.getElementById('timeline-label').textContent = 'Seek to tick ' + event.target.value;
    });
    document.getElementById('history').addEventListener('change', event => {
      timelineScrubbing = false;
      const tick = Number(event.target.value);
      if (Number.isSafeInteger(tick)) loadHistoricalWorld(tick);
    });
    document.getElementById('live-follow').textContent = 'Continue from Here';
    document.getElementById('live-follow').addEventListener('click', continueFromHere);


    function resize() {
      const rect = canvas.getBoundingClientRect();
      const pixelWidth = Math.max(1, Math.floor(rect.width * devicePixelRatio));
      const pixelHeight = Math.max(1, Math.floor(rect.height * devicePixelRatio));
      // The workspace reparents the canvas into a flex viewport after this
      // script runs. Keep its backing store synchronized with its CSS box or
      // the browser stretches the old bitmap and distorts every world shape.
      if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
      if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      if (!cameraInitialized && observation) fitCurrentObservation();
      render();
    }
    function viewportSize() { return { width: canvas.clientWidth, height: canvas.clientHeight }; }
    function observationViewKey() { return 'full-world-observation'; }

    function payload() { return observation?.payload || null; }
    function worldPayload() { return payload()?.World || null; }
    function organismPayload() { return payload()?.Organism || null; }
    function organismPhysicalPayload() { return organismPayload()?.physical || null; }
    function structurePayload() { return payload()?.Structure || null; }
    function structurePhysicalPayload() { return structurePayload(); }

    function formBounds(form, x, y, rotation = 0) {
      if (!form || !Number.isFinite(x) || !Number.isFinite(y)) return null;
      let points = [];
      if (form.Circle) {
        const r = form.Circle.radius; points = [[-r, -r], [r, r]];
      } else if (form.Rectangle) {
        const w = form.Rectangle.width / 2, h = form.Rectangle.height / 2;
        points = [[-w, -h], [-w, h], [w, -h], [w, h]];
      } else if (form.RegularPolygon) {
        const n = form.RegularPolygon.sides, r = form.RegularPolygon.radius;
        for (let i = 0; i < n; i += 1) { const a = i * Math.PI * 2 / n; points.push([r * Math.cos(a), r * Math.sin(a)]); }
      } else if (form.Polygon) {
        points = form.Polygon.vertices || [];
      } else {
        return null; // Fluid has no authoritative finite boundary.
      }
      const c = Math.cos(rotation), s = Math.sin(rotation);
      const transformed = points.map(([px, py]) => [x + px * c - py * s, y + px * s + py * c]);
      return {
        minX: Math.min(...transformed.map(p => p[0])), maxX: Math.max(...transformed.map(p => p[0])),
        minY: Math.min(...transformed.map(p => p[1])), maxY: Math.max(...transformed.map(p => p[1]))
      };
    }

    function fitCurrentObservation() {
      const viewport = viewportSize();
      if (observationLevel === 'World') {
        const world = worldPayload();
        if (world) camera.fitWorld(world.width || 1, world.height || 1, viewport.width, viewport.height);
      } else if (observationLevel === 'Organism') {
        const organism = organismPhysicalPayload();
        if (organism) camera.fitBounds(organism.min_x, organism.max_x, organism.min_y, organism.max_y, viewport.width, viewport.height);
      } else {
        const structure = structurePayload();
        if (!structure || !structure.units?.length) return;
        const bounds = structure.units.map(u => formBounds(u.form, u.placement?.x, u.placement?.y, u.placement?.rotation_radians || 0)).filter(Boolean);
        if (!bounds.length) return;
        camera.fitBounds(
          Math.min(...bounds.map(b => b.minX)), Math.max(...bounds.map(b => b.maxX)),
          Math.min(...bounds.map(b => b.minY)), Math.max(...bounds.map(b => b.maxY)),
          viewport.width, viewport.height
        );
      }
      cameraInitialized = true;
    }

    function drawForm(form, x, y, rotation = 0, appearance = null) {
      if (!form) return;
      ctx.save(); ctx.translate(x, y); ctx.rotate(rotation); ctx.beginPath();
      if (form.Circle) {
        ctx.arc(0, 0, form.Circle.radius, 0, Math.PI * 2);
      } else if (form.Rectangle) {
        ctx.rect(-form.Rectangle.width / 2, -form.Rectangle.height / 2, form.Rectangle.width, form.Rectangle.height);
      } else if (form.RegularPolygon) {
        const n = form.RegularPolygon.sides, r = form.RegularPolygon.radius;
        for (let i = 0; i < n; i += 1) { const a = i * Math.PI * 2 / n, px = r * Math.cos(a), py = r * Math.sin(a); if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
        ctx.closePath();
      } else if (form.Polygon) {
        const vertices = form.Polygon.vertices || [];
        for (let i = 0; i < vertices.length; i += 1) { const [px, py] = vertices[i]; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
        ctx.closePath();
      } else {
        ctx.restore(); return; // Do not invent a boundary for Fluid.
      }
      ctx.fillStyle = appearance?.fill || '#d9e2ec';
      ctx.strokeStyle = appearance?.outline || '#17202a';
      ctx.lineWidth = Math.max(0.75 / Math.max(camera.scale, 1e-9), 0.01);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawObservedPart(part, viewport) {
      const point = camera.worldToScreen(part.x, part.y, viewport.width, viewport.height);
      ctx.save(); ctx.translate(point.x, point.y); ctx.scale(camera.scale, camera.scale);
      drawForm(part.form, 0, 0, part.rotation_radians); ctx.restore();
    }
    function drawSelectionBounds(id, bounds, viewport, pad = 3) {
      if (!selectedIds.has(id)) return;
      const a = camera.worldToScreen(bounds.min_x, bounds.min_y, viewport.width, viewport.height);
      const b = camera.worldToScreen(bounds.max_x, bounds.max_y, viewport.width, viewport.height);
      ctx.save();
      ctx.strokeStyle = '#d14';
      ctx.lineWidth = 2;
      ctx.strokeRect(a.x - pad, a.y - pad, b.x - a.x + pad * 2, b.y - a.y + pad * 2);
      ctx.restore();
    }
    function renderWaterField(world, viewport) {
      const width = Number(world.width) || 1;
      const height = Number(world.height) || 1;
      ctx.save();
      ctx.fillStyle = '#071522';
      ctx.fillRect(0, 0, viewport.width, viewport.height);
      const fieldTopLeft = camera.worldToScreen(0, 0, viewport.width, viewport.height);
      const fieldBottomRight = camera.worldToScreen(width, height, viewport.width, viewport.height);
      ctx.fillStyle = '#075985';
      ctx.fillRect(fieldTopLeft.x, fieldTopLeft.y,
        fieldBottomRight.x - fieldTopLeft.x, fieldBottomRight.y - fieldTopLeft.y);

      // Visualize the same S-shaped spine used by the transport model. These
      // lines are a rendering aid only; the Rust flow field remains authoritative.
      for (const offset of [-0.12, 0, 0.12]) {
        ctx.beginPath();
        const samples = 120;
        for (let index = 0; index <= samples; index += 1) {
          const x = width * index / samples;
          const y = height * 0.5 - height * 0.23 * Math.sin(Math.PI * 2 * x / width) + height * offset;
          const point = camera.worldToScreen(x, y, viewport.width, viewport.height);
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        }
        ctx.strokeStyle = offset === 0 ? 'rgba(224, 242, 254, 0.72)' : 'rgba(186, 230, 253, 0.24)';
        // Streamlines are projected into screen coordinates, so stroke width
        // must remain screen-space constant as the camera zooms.
        ctx.lineWidth = offset === 0 ? 1.5 : 1.0;
        ctx.stroke();
      }

      const vortexRadius = Math.max(2, height * 0.13 * camera.scale);
      // Place the left eddy on the lower bend and the right eddy on the upper
      // bend. The right eddy sits beside the hotspot so their visual regions overlap.
      const eddies = [
        { x: width * 0.25, y: height * 0.73, start: Math.PI * 0.8, end: Math.PI * 2.8 },
        { x: width * 0.75, y: height * 0.27, start: -Math.PI * 0.2, end: Math.PI * 1.45 }
      ];
      for (const eddy of eddies) {
        const point = camera.worldToScreen(eddy.x, eddy.y, viewport.width, viewport.height);
        ctx.beginPath();
        ctx.arc(point.x, point.y, vortexRadius, eddy.start, eddy.end);
        ctx.strokeStyle = 'rgba(186, 230, 253, 0.48)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.restore();
    }

    function renderHotspot(hotspot, viewport) {
      if (!hotspot || !Number.isFinite(hotspot.center_x) || !Number.isFinite(hotspot.center_y) ||
          !Number.isFinite(hotspot.radius) || hotspot.radius <= 0) return;
      const point = camera.worldToScreen(hotspot.center_x, hotspot.center_y, viewport.width, viewport.height);
      const radius = hotspot.radius * camera.scale;
      if (!Number.isFinite(radius) || radius <= 0) return;
      ctx.save();
      const gradient = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, radius);
      gradient.addColorStop(0, 'rgba(255, 112, 0, 0.48)');
      gradient.addColorStop(0.55, 'rgba(255, 170, 0, 0.20)');
      gradient.addColorStop(1, 'rgba(255, 80, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 150, 40, 0.72)';
      ctx.lineWidth = 1.25;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 245, 220, 0.95)';
      ctx.font = '11px sans-serif';
      ctx.fillText('Hotspot · 100 energy/tick/area', point.x + 7, point.y - 7);
      ctx.restore();
    }

    function renderWorld() {
      const world = worldPayload(), viewport = viewportSize(); if (!world) return;
      renderWaterField(world, viewport);
      renderHotspot(world.hotspot, viewport);
      for (const organism of world.organisms || []) {
        const physical = organism.physical;
        if (!physical) continue;
        for (const part of physical.silhouette || []) drawObservedPart(part, viewport);
        drawSelectionBounds(organism.id, physical, viewport);
      }
    }
    function renderOrganism() {
      const organism = organismPayload(), physical = organismPhysicalPayload(), viewport = viewportSize();
      if (!organism || !physical) return;
      for (const part of physical.silhouette || []) drawObservedPart(part, viewport);
      drawSelectionBounds(organism.id, physical, viewport, 5);
    }
    function renderStructure() {
      const structure = structurePhysicalPayload(), viewport = viewportSize(); if (!structure) return;
      ctx.save();
      ctx.strokeStyle = '#17202a';
      ctx.lineWidth = Math.max(1, Math.min(4, camera.scale * 0.08));
      for (const bond of structure.bonds || []) {
        if (!bond.endpoint_a || !bond.endpoint_b) continue;
        const a = camera.worldToScreen(bond.endpoint_a.x, bond.endpoint_a.y, viewport.width, viewport.height);
        const b = camera.worldToScreen(bond.endpoint_b.x, bond.endpoint_b.y, viewport.width, viewport.height);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.restore();
      for (const unit of structure.units || []) {
        if (!unit.form || !unit.placement) continue;
        const point = camera.worldToScreen(unit.placement.x, unit.placement.y, viewport.width, viewport.height);
        ctx.save(); ctx.translate(point.x, point.y); ctx.scale(camera.scale, camera.scale);
        drawForm(unit.form, 0, 0, unit.placement.rotation_radians); ctx.restore();
      }
    }
    function drawSelectionRectangle() {
      if (!interaction?.selecting) return;
      const x = Math.min(interaction.startX, interaction.currentX), y = Math.min(interaction.startY, interaction.currentY);
      const width = Math.abs(interaction.currentX - interaction.startX), height = Math.abs(interaction.currentY - interaction.startY);
      ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.strokeRect(x, y, width, height); ctx.restore();
    }
    function render(updateUi = true) {
      const viewport = viewportSize();
      ctx.clearRect(0, 0, viewport.width, viewport.height);
      ctx.fillStyle = '#071522';
      ctx.fillRect(0, 0, viewport.width, viewport.height);
      try {
        if (!observation) {
          ctx.fillStyle = '#d9e2ec';
          ctx.font = '13px ui-monospace, monospace';
          ctx.fillText('Waiting for simulation observation…', 18, 30);
          return;
        }
        if (!cameraInitialized) fitCurrentObservation();
        if (observationLevel === 'World') {
          if (!worldPayload()) {
            ctx.fillStyle = '#ffd28a';
            ctx.font = '13px ui-monospace, monospace';
            ctx.fillText('World observation received without payload.World', 18, 30);
            ctx.fillStyle = '#aaa';
            ctx.font = '11px ui-monospace, monospace';
            ctx.fillText('Check /observation/world response and browser console.', 18, 50);
          } else renderWorld();
        } else if (observationLevel === 'Organism') renderOrganism();
        else if (observationLevel === 'Structure') renderStructure();
        drawSelectionRectangle();
        if (updateUi) updateStatus();
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        ctx.fillStyle = '#ffd28a';
        ctx.font = '13px ui-monospace, monospace';
        ctx.fillText('World renderer error: ' + message.slice(0, 140), 18, 30);
        status.textContent = 'World renderer error: ' + message.slice(0, 180);
      }
    }
    function selectedIndex() { return focusedOrganismId == null ? -1 : [...selectedIds].indexOf(focusedOrganismId); }
    function updateStatus() {
      if (noLivingOrganisms) {
        status.textContent = 'No living organisms — physical world continues at tick ' + (runtimeStatus?.tick ?? '?') + '.';
        updateControls();
        return;
      }
      if (observationLevel === 'World') {
        const world = worldPayload(); status.textContent = `Observing World — ${world?.organisms?.length || 0} organisms — ${selectedIds.size} selected`;
      } else if (observationLevel === 'Organism') {
        const organism = organismPayload(), physical = organismPhysicalPayload();
        status.textContent = `Observing Organism — ${organism?.id || focusedOrganismId || 'unknown'} — ${physical?.unit_count || 0} units — ${physical?.bond_count || 0} bonds`;
      } else {
        const structure = structurePayload(), index = selectedIndex();
        const cycle = selectedIds.size > 1 ? ` — [${index + 1}/${selectedIds.size}]` : '';
        status.textContent = `Observing Structure — ${structure?.id || focusedOrganismId || 'unknown'} — ${structure?.units?.length || 0} units — ${structure?.bonds?.length || 0} bonds${cycle}`;
      }
      updateControls();
    }
    function canvasPoint(event) { const rect = canvas.getBoundingClientRect(); return { x: event.clientX - rect.left, y: event.clientY - rect.top }; }
    function organismAtScreenPoint(x, y) {
      const world = worldPayload(); if (!world) return null;
      const viewport = viewportSize(), point = camera.screenToWorld(x, y, viewport.width, viewport.height);
      for (let i = (world.organisms?.length || 0) - 1; i >= 0; i -= 1) {
        const organism = world.organisms[i];
        const physical = organism.physical;
        if (physical && point.x >= physical.min_x && point.x <= physical.max_x && point.y >= physical.min_y && point.y <= physical.max_y) return organism;
      }
      return null;
    }
    function organismsInScreenRect(startX, startY, endX, endY) {
      const world = worldPayload(); if (!world) return [];
      const viewport = viewportSize(), a = camera.screenToWorld(startX, startY, viewport.width, viewport.height), b = camera.screenToWorld(endX, endY, viewport.width, viewport.height);
      const minX = Math.min(a.x, b.x), maxX = Math.max(a.x, b.x), minY = Math.min(a.y, b.y), maxY = Math.max(a.y, b.y);
      return (world.organisms || []).filter(o => {
        const p = o.physical;
        return p && p.max_x >= minX && p.min_x <= maxX && p.max_y >= minY && p.min_y <= maxY;
      });
    }
    function centerSelection() {
      const world = worldPayload(); if (!world || !selectedIds.size) return;
      const selected = (world.organisms || []).filter(o => selectedIds.has(o.id)); if (!selected.length) return;
      const center = selected.reduce((sum, o) => {
        const p = o.physical;
        return { x: sum.x + (p.min_x + p.max_x) / 2, y: sum.y + (p.min_y + p.max_y) / 2 };
      }, { x: 0, y: 0 });
      camera.centerOn(center.x / selected.length, center.y / selected.length);
    }
    function finishWorldSelection(point) {
      if (!interaction || !interaction.selecting) return;
      const moved = Math.hypot(point.x - interaction.startX, point.y - interaction.startY);
      if (moved < 5) {
        const organism = organismAtScreenPoint(point.x, point.y);
        if (organism) { selectedIds.clear(); selectedIds.add(organism.id); focusedOrganismId = organism.id; centerSelection(); }
        else { selectedIds.clear(); focusedOrganismId = null; }
      } else {
        const organisms = organismsInScreenRect(interaction.startX, interaction.startY, point.x, point.y);
        selectedIds.clear(); for (const organism of organisms) selectedIds.add(organism.id);
        focusedOrganismId = organisms.length === 1 ? organisms[0].id : null;
        centerSelection();
      }
      interaction = null; render();
    }

    async function loadObservation(level, organismId = null) {
      const serial = ++requestSerial;
      const levelChanged = observationLevel !== level;
      let url = '/observation/world';
      if (level === 'World') {
        const params = new URLSearchParams();
        if (worldCache.organisms.size) {
          params.set('known_organisms', JSON.stringify([...worldCache.organisms.entries()].map(([id, value]) => [
            id, value.structure_revision, value.position_revision
          ])));
        }
        if (worldCache.field.size) {
          params.set('known_cells', JSON.stringify([...worldCache.field.entries()].map(([cellIndex, value]) => [
            Number(cellIndex), value.revision
          ])));
        }
        const query = params.toString();
        if (query) url += '?' + query;
      }
      if (level === 'Organism' && organismId != null) {
        url = `/observation/organism/${encodeURIComponent(organismId)}`;
        const current = organismPayload();
        if (current?.id === organismId) {
          const params = new URLSearchParams();
          if (Number.isInteger(current.structure_revision)) params.set('known_structure_revision', current.structure_revision);
          if (Number.isInteger(current.position_revision)) params.set('known_position_revision', current.position_revision);
          const query = params.toString();
          if (query) url += '?' + query;
        }
      }
      if (level === 'Structure' && organismId != null) {
        url = `/observation/structure/${encodeURIComponent(organismId)}`;
        const current = structurePayload();
        if (current?.id === organismId && Number.isInteger(current.structure_revision)) {
          url += '?' + new URLSearchParams({
            known_structure_revision: current.structure_revision
          }).toString();
        }
      }
      try {
        // Bound observation requests so a stalled simulation endpoint cannot
        // leave the canvas indefinitely showing its initial waiting state.
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        let response;
        try {
          response = await fetch(url, { cache: 'no-store', signal: controller.signal });
        } finally {
          clearTimeout(timeout);
        }
        if (!response.ok) throw new Error(`HTTP ${response.status} from ${url}`);
        const next = await response.json();
        if (serial !== requestSerial) return;
        if (level === 'World' && next?.payload?.World) {
          const previousParts = [...worldCache.field.values()].flatMap(cell => cell.physical_parts || []);
          const world = next.payload.World;
          for (const organism of world.organisms || []) {
            const cached = worldCache.organisms.get(organism.id);
            if (organism.physical == null && cached) {
              organism.physical = cached.physical;
            }
            worldCache.organisms.set(organism.id, organism);
          }
          for (const cell of world.field || []) {
            const cached = worldCache.field.get(cell.cell_index);
            if (cell.materials == null && cached) cell.materials = cached.materials;
            if (cell.physical_parts == null && cached) cell.physical_parts = cached.physical_parts;
            if (cell.materials?.length || cell.physical_parts?.length) worldCache.field.set(cell.cell_index, cell);
            else worldCache.field.delete(cell.cell_index);
          }
          // Match constituents by resource and nearest prior position. The observation
          // schema has no persistent constituent ID, so this is a display-only pairing.
          const nextParts = [...worldCache.field.values()].flatMap(cell => cell.physical_parts || []);
          const available = new Map();
          for (const part of previousParts) {
            const list = available.get(part.resource) || [];
            list.push({ x: part.x, y: part.y, used: false });
            available.set(part.resource, list);
          }
          for (const part of nextParts) {
            const candidates = available.get(part.resource) || [];
            let best = null, bestDistance = Infinity;
            for (const candidate of candidates) {
              if (candidate.used) continue;
              const distance = (candidate.x - part.x) ** 2 + (candidate.y - part.y) ** 2;
              if (distance < bestDistance) { best = candidate; bestDistance = distance; }
            }
            if (best) {
              best.used = true;
              displayPositionStarts.set(part, { x: best.x, y: best.y });
            }
          }
          displayAnimationStartedAt = performance.now();
          const configuredTps = Number(runtimeStatus?.ticks_per_second) || 10;
          displayAnimationDurationMs = Math.max(16, Math.min(250, 1000 / configuredTps));
        }
        if (
          level === 'Organism' &&
          next?.payload?.Organism?.physical == null &&
          observation?.payload?.Organism?.id === organismId
        ) {
          next.payload.Organism.physical = observation.payload.Organism.physical;
        }
        if (
          level === 'Structure' &&
          next?.payload?.Structure?.units == null &&
          observation?.payload?.Structure?.id === organismId
        ) {
          next.payload.Structure.units = observation.payload.Structure.units;
          next.payload.Structure.bonds = observation.payload.Structure.bonds;
        }
        observation = next; observationLevel = level;
        if (levelChanged) cameraInitialized = false;
        render();
      } catch (error) {
        if (serial === requestSerial) {
          const message = error instanceof Error ? error.message : String(error);
          status.textContent = 'Observation request failed: ' + message.slice(0, 180);
          const viewport = viewportSize();
          ctx.clearRect(0, 0, viewport.width, viewport.height);
          ctx.fillStyle = '#071522';
          ctx.fillRect(0, 0, viewport.width, viewport.height);
          ctx.fillStyle = '#ffd28a';
          ctx.font = '13px ui-monospace, monospace';
          ctx.fillText('Could not load /observation/world', 18, 30);
          ctx.fillStyle = '#d9e2ec';
          ctx.fillText(message.slice(0, 140), 18, 52);
        }
      }
    }
    async function enterOrganismLevel(id) { if (id == null) return; focusedOrganismId = id; selectedIds.add(id); await loadObservation('Organism', id); }
    async function enterStructureLevel(id) { if (id == null) return; focusedOrganismId = id; selectedIds.add(id); await loadObservation('Structure', id); }
    async function returnToWorld() { focusedOrganismId = null; observationLevel = 'World'; cameraInitialized = false; await loadObservation('World'); centerSelection(); render(); }
    async function resetSimulation() {
      try {
        const response = await fetch('/control/reset', { method: 'POST', cache: 'no-store' });
        if (!response.ok) throw new Error();
        historyViewTick = null;
        historyTicks = [];
        clearWorldCache();
        selectedIds.clear();
        focusedOrganismId = null;
        observationLevel = 'World';
        noLivingOrganisms = false;
        cameraInitialized = false;
        await refreshRuntimeStatus();
        await loadObservation('World');
      } catch (_) {
        status.textContent = 'Reset unavailable — simulation may be restarting…';
      }
    }
    async function returnToOrganism() { if (focusedOrganismId == null) return; await loadObservation('Organism', focusedOrganismId); }
    async function cycleFocused(delta) {
      const ids = [...selectedIds]; if (ids.length < 2) return;
      let index = ids.indexOf(focusedOrganismId); if (index < 0) index = 0;
      index = (index + delta + ids.length) % ids.length;
      focusedOrganismId = ids[index];
      cameraInitialized = false;
      await loadObservation('Structure', focusedOrganismId);
    }

    canvas.addEventListener('dblclick', async event => {
      const point = canvasPoint(event);
      if (observationLevel === 'World') {
        const organism = organismAtScreenPoint(point.x, point.y); if (organism) await enterOrganismLevel(organism.id);
      } else if (observationLevel === 'Organism') {
        await enterStructureLevel(focusedOrganismId);
      }
    });
    canvas.addEventListener('wheel', event => {
      event.preventDefault(); const point = canvasPoint(event), viewport = viewportSize();
      camera.zoomAt(point.x, point.y, Math.exp(-event.deltaY * 0.001), viewport.width, viewport.height);
      render();
    }, { passive: false });
    canvas.addEventListener('pointerdown', event => {
      event.preventDefault();
      if (event.button === 1) {
        canvas.setPointerCapture(event.pointerId);
        interaction = { pointerId: event.pointerId, panning: true, lastX: event.clientX, lastY: event.clientY };
        canvas.classList.add('panning');
        return;
      }
      if (event.button !== 0 || observationLevel !== 'World') return;
      const point = canvasPoint(event);
      canvas.setPointerCapture(event.pointerId);
      // In the organism-free chemistry experiment, empty-world dragging must
      // pan the camera. Keep click/drag selection for an organism hit target.
      if (!organismAtScreenPoint(point.x, point.y)) {
        interaction = {
          pointerId: event.pointerId, panning: true, clearOnClick: true, moved: false,
          lastX: event.clientX, lastY: event.clientY
        };
        canvas.classList.add('panning');
        return;
      }
      interaction = { pointerId: event.pointerId, selecting: true, startX: point.x, startY: point.y, currentX: point.x, currentY: point.y };
    });
    canvas.addEventListener('pointermove', event => {
      if (!interaction || interaction.pointerId !== event.pointerId) return;
      event.preventDefault();
      if (interaction.panning) {
        const viewport = viewportSize();
        camera.pan(event.clientX - interaction.lastX, event.clientY - interaction.lastY, viewport.width, viewport.height);
        interaction.lastX = event.clientX; interaction.lastY = event.clientY;
        interaction.moved = true;
        render();
      } else if (interaction.selecting) {
        const point = canvasPoint(event); interaction.currentX = point.x; interaction.currentY = point.y; render();
      }
    });
    function endPointer(event) {
      if (!interaction || interaction.pointerId !== event.pointerId) return;
      event.preventDefault();
      if (interaction.panning) {
        if (interaction.clearOnClick && !interaction.moved) {
          selectedIds.clear();
          focusedOrganismId = null;
          render();
        }
        interaction = null;
        canvas.classList.remove('panning');
      } else if (interaction.selecting) finishWorldSelection(canvasPoint(event));
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', event => {
      if (interaction?.pointerId === event.pointerId) interaction = null;
      canvas.classList.remove('panning'); render();
    });
    canvas.addEventListener('lostpointercapture', event => {
      // Do not pre-empt pointerup. Browsers can report capture loss as part of
      // the normal release sequence; pointercancel is the authoritative abort.
      if (interaction?.pointerId === event.pointerId) {
        canvas.classList.remove('panning');
      }
    });

    window.addEventListener('keydown', async event => {
      const target = event.target;
      const isTyping = target instanceof HTMLElement &&
        (target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName));
      if (isTyping || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;

      if (event.code === 'Space') {
        event.preventDefault();
        if (runtimeStatus?.running) await control('/control/pause');
        else {
          historyViewTick = null;
          await control('/control/resume');
        }
      } else if (event.key === '<' || (event.code === 'Comma' && event.shiftKey)) {
        event.preventDefault();
        await stepBack();
      } else if (event.key === '>' || (event.code === 'Period' && event.shiftKey)) {
        event.preventDefault();
        await stepForward();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        await resetSimulation();
      } else if (observationLevel === 'Structure' && (event.key === '[' || event.key === ']')) {
        await cycleFocused(event.key === ']' ? 1 : -1);
      }
    });

    let liveRefreshQueued = false;
    let liveStream = null;


    function queueLiveRefresh() {
      if (historyViewTick != null || liveRefreshQueued) return;
      liveRefreshQueued = true;
      setTimeout(async () => {
        liveRefreshQueued = false;
        if (historyViewTick != null) return;
        const previousTick = runtimeStatus?.tick;
        await refreshRuntimeStatus();
        if (historyViewTick != null || runtimeStatus?.tick == null) return;
        // Fetch a new observation only when the authoritative simulation tick
        // advances. WebSocket events provide the fast path; periodic status
        // checks below keep live mode working if a tick event is missed.
        if (runtimeStatus.tick === previousTick) return;
        if (observationLevel === 'World') await loadObservation('World');
        else if (focusedOrganismId != null) await loadObservation(observationLevel, focusedOrganismId);
      }, 25);
    }

    function connectLiveStream() {
      if (liveStream) liveStream.close();
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      liveStream = new WebSocket(protocol + '//' + location.host + '/observation/stream');
      liveStream.onopen = () => {
        status.textContent = 'Live observation stream connected';
        refreshRuntimeStatus();
      };
      liveStream.onmessage = event => {
        try {
          const message = JSON.parse(event.data);
          if (message.type === 'tick') {
            if (runtimeStatus?.session_id && message.session_id !== runtimeStatus.session_id) {
              historyViewTick = null;
              clearWorldCache();
              cameraInitialized = false;
            }
            queueLiveRefresh();
          }
        } catch (_) {}
      };
      liveStream.onclose = () => {
        liveStream = null;
        if (historyViewTick == null) status.textContent = 'Live stream disconnected — reconnecting…';
        setTimeout(connectLiveStream, 500);
      };
      liveStream.onerror = () => liveStream?.close();
    }

    // Draw continuously at the browser's refresh rate. New simulation observations
    // update targets; interpolation above makes constituent motion continuous between them.
    function animationFrame() {
      if (historyViewTick == null) render(false);
      requestAnimationFrame(animationFrame);
    }
    requestAnimationFrame(animationFrame);

    window.addEventListener('resize', resize);
    // Keep live playback attached to the newest simulation tick even if the
    // browser drops a WebSocket notification. This is status-only polling;
    // observations are fetched only when the tick actually advances.
    setInterval(queueLiveRefresh, 250);
    if (typeof ResizeObserver !== 'undefined') {
      const canvasResizeObserver = new ResizeObserver(() => resize());
      canvasResizeObserver.observe(canvas);
    }
    resize();
    awaitInitialObservation();

    async function awaitInitialObservation() {
      // Do not make the first world render wait for the status endpoint. A slow
      // status request must not block the independent world-observation request.
      selectedIds.clear();
      focusedOrganismId = null;
      observationLevel = 'World';
      const observationRequest = loadObservation('World');
      const statusRequest = refreshRuntimeStatus();
      await Promise.allSettled([observationRequest, statusRequest]);
      connectLiveStream();
      // This viewer opens the environmental chemistry experiment in live mode.
      if (!runtimeStatus?.running) await control('/control/resume');
    }
  </script>
</body>
</html>
